# Smartcard daemon configuration (KTD8).
# disable-ccid makes scdaemon access the card through pcscd on Linux and the
# PC/SC framework on macOS rather than claiming the USB CCID interface directly.
# pcsc-shared enables shared access so other tools (ykman, Yubico Authenticator)
# can access the card concurrently without killing scdaemon (R2).
# Recorded costs: agent-side PIN cache is disabled in shared mode, and card reset
# drops verification (handled transparently by the pinentry-card wrapper).
disable-ccid
pcsc-shared
