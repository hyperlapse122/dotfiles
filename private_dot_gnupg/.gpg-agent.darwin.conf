# pinentry-mac (Homebrew formula — packages.yaml authority `pinentry` capability)
# is not on gpg-agent's default pinentry search path, so name it explicitly: the
# macOS counterpart of the desktop-aware pinentry choice in .gpg-agent.linux.conf.
# The Windows sibling stays blank because Gpg4win bundles and wires its own
# pinentry.
pinentry-program /opt/homebrew/bin/pinentry-mac
