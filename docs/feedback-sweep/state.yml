  "gh-issues:hyperlapse122/dotfiles#186":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard: ARGV_PREFIXES skips the prefix but not its options - argvHead skips a recognised prefix (env, sudo, command, exec, nohup, time) and then treats the next token as the command name, so a prefix option such as env -C or sudo -u makes the head a flag, classifyBash drops the segment and fallbackScan never runs; P1, needs per-prefix option grammar or fail-closed on an unrecognised prefix option."
    author_class: "teammate"
    category: "bug"
    existing_ack: false
    existing_closeout: false
    id: "hyperlapse122/dotfiles#186"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/186"
    severity: "P1"
    updated_at: "2026-08-07T04:46:56Z"
  "gh-issues:hyperlapse122/dotfiles#187":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard: interpreter -c bodies are never scanned - classifyBash iterates only segment.bodies (heredoc/here-string), so a bash -c payload is never scanned, and a captured body is not re-split after decoded-whitespace expansion, so an ANSI-C-escaped inner command collapses into one token; P1, both variants classify as ignore."
    author_class: "teammate"
    category: "bug"
    existing_ack: false
    existing_closeout: false
    id: "hyperlapse122/dotfiles#187"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/187"
    severity: "P1"
    updated_at: "2026-08-07T04:46:57Z"
  "gh-issues:hyperlapse122/dotfiles#188":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard: argv-forwarding wrappers drop the segment silently - classifyBash continues past any head outside its short recognised set, so xargs, timeout, nice, stdbuf, setsid, parallel and watch hide a real gh/glab issue write; P2, framed as an allowlist problem solved with a denylist, with a proposal to fail closed on an unrecognised head whose argv contains gh or glab."
    author_class: "teammate"
    category: "bug"
    existing_ack: false
    existing_closeout: false
    id: "hyperlapse122/dotfiles#188"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/188"
    severity: "P2"
    updated_at: "2026-08-07T04:46:58Z"
  "gh-issues:hyperlapse122/dotfiles#189":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard: cliIsIssueWrite reads positions from a flag-stripped word list - the words filter strips flag tokens but keeps the value each value-taking flag consumes, so a value flag before the subcommand shifts every positional and misclassifies the verb; P2, the existing firstPositional valueFlags machinery is unused here and end-to-end exploitability was not established."
    author_class: "teammate"
    category: "bug"
    existing_ack: false
