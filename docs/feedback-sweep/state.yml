  "gh-issues:hyperlapse122/dotfiles#174":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard emits no durable audit trail when it blocks — the block path has no logging outside the config-failure branch, so a block's only trace is that session's own transcript; an operator cannot detect a fail-open `MCP_ISSUE_WRITE_PATTERN` miss or audit block frequency across a workstation."
    author_class: "teammate"
    category: "observability"
    existing_ack: false
    existing_closeout: false
