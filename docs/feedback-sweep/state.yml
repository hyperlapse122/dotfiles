    sensitive: false
    body: "refactor omp modelRoles onto a claude-opus-5 / sonnet-5 tier ladder - requests remapping slow/default/smol model roles in agents.yaml to specific Claude models, and flags several render-time/CI blocking constraints (fallback-chain key collisions, a Kimi model dependency) that must be resolved in the same change."
