  "gh-issues:hyperlapse122/dotfiles#178":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "verdict-cache hit drops fork-chain re-checks - probeOne's cache-hit path always returns parent:null, so a cached verdict for a fork skips re-walking its parent chain for the rest of the TTL even though the original uncached probe walked it; suggests caching the resolved parent or the fully-resolved chain outcome."
    fix_ref: "https://github.com/hyperlapse122/dotfiles/pull/190"
