  "gh-issues:hyperlapse122/dotfiles#173":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard tokenizer mis-models ANSI-C $'...' quoting — `splitCommand`'s quote tracker in the unmanaged-repo-guard treats an escaped quote inside `$'...'` as closing the quote, which can leave a phantom quote open through end of input; currently masked by the `fallbackScan` regex safety net, with no confirmed exploit."
    author_class: "teammate"
    category: "bug"
