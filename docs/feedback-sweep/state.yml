  "gh-issues:hyperlapse122/dotfiles#177":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "No runtime test for a subagent's own MCP-tool call through the repo guard - the repo-guard test suite only exercises a top-level bash gh issue create call, not a subagent's own MCP-tool call (e.g. mcp__glab_issue_create) against the real omp runtime; flagged low risk since both interception dimensions were confirmed separately."
