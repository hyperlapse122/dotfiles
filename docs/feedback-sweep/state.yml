  "gh-issues:hyperlapse122/dotfiles#171":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "CI never exercises omp's own extension resolution for the repo guard - the only test proving the guard's real runtime block actually stops execution needs live model credentials, which CI doesn't configure, so that step is unconditionally skipped on every run; a raw-.ts load step and a CI warning annotation partially mitigate, but a real credentialed run is still needed."
    author_class: "teammate"
    category: "chore"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#171"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/171"
    updated_at: "2026-08-05T15:05:14Z"
  "gh-issues:hyperlapse122/dotfiles#172":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Extract duplicated render-gate bash helpers into a shared .ci lib - six ~80-line helper functions are byte-identical across two CI gate scripts; deferred from an earlier security-fix PR since it restructures a green test and introduces a new .ci/lib convention, and nothing currently guards the two copies against drift."
    author_class: "teammate"
    category: "chore"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#172"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/172"
    updated_at: "2026-08-05T15:05:16Z"
  "gh-issues:hyperlapse122/dotfiles#173":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard tokenizer mis-models ANSI-C $'...' quoting - splitCommand's quote tracker doesn't understand $'...' escaping, which can leave a phantom open quote; no confirmed exploit found (it coincidentally triggers the fallbackScan safety net) but the internal quote-state model is objectively wrong."
    author_class: "teammate"
    category: "bug"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#173"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/173"
    updated_at: "2026-08-05T15:05:19Z"
  "gh-issues:hyperlapse122/dotfiles#174":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard emits no durable audit trail when it blocks - the guard has no logging on its block path, so a block's only trace is that run's own transcript; no session-independent way to detect a fail-open pattern silently missing a new tool or to audit block frequency over time."
    author_class: "teammate"
    category: "feature"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#174"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/174"
    updated_at: "2026-08-05T15:05:22Z"
  "gh-issues:hyperlapse122/dotfiles#175":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Repo guard identity lookup runs before the verdict cache is consulted - probeOne always pays a bounded identity-subprocess cost even on a verdict cache hit, because identity is part of the cache key by design; fix needs a cheaper identity cache check, not a reordering."
    author_class: "teammate"
    category: "bug"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#175"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/175"
    updated_at: "2026-08-05T15:05:25Z"
  "gh-issues:hyperlapse122/dotfiles#176":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "Document splitCommand's load-bearing invariants in the repo guard - two unstated invariants (bash-style backslash handling inside quotes; command-substitution exclusion enforced two functions away) should be documented at the function since it is the guard's security-boundary complexity concentration."
    author_class: "teammate"
    category: "docs"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#176"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/176"
