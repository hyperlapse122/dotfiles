  "gh-issues:hyperlapse122/dotfiles#168":
    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "tracker-defer fallback chain has no repository-management probe - a P0 security/adversarial-review residual: the instruction-core precedence rule over the skill-level tracker-defer fallback chain relies purely on the agent honoring it, since the skill's own filing procedure has no back-reference and never probes repo-management access, only reachability; not fixed in-PR because the referenced fallback doc lives in a read-only plugin cache outside this repo's ownership."
    author_class: "teammate"
    category: "bug"
    existing_ack: true
    existing_closeout: false
    id: "hyperlapse122/dotfiles#168"
    media: []
    origin: "https://github.com/hyperlapse122/dotfiles/issues/168"
    updated_at: "2026-08-05T15:05:33Z"
  "gh-issues:hyperlapse122/dotfiles#171":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "CI never exercises omp's own extension resolution for the repo guard - the only test proving the guard's real runtime block actually stops execution needs live model credentials, which CI doesn't configure, so that step is unconditionally skipped on every run; a raw-.ts load step and a CI warning annotation partially mitigate, but a real credentialed run is still needed."
    fix_ref: "https://github.com/hyperlapse122/dotfiles/pull/190"
    verified_merge_sha: "e44e6e41a20c89ac3a522ab86236eadd0979e0e5"
    verified_at: "2026-08-07T05:01:17Z"
    author_class: "teammate"
