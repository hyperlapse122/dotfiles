  "gh-issues:hyperlapse122/dotfiles#168":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "tracker-defer fallback chain has no repository-management probe - a P0 security/adversarial-review residual: the instruction-core precedence rule over the skill-level tracker-defer fallback chain relies purely on the agent honoring it, since the skill's own filing procedure has no back-reference and never probes repo-management access, only reachability; not fixed in-PR because the referenced fallback doc lives in a read-only plugin cache outside this repo's ownership."
    fix_ref: "https://github.com/hyperlapse122/dotfiles/pull/191"
    verified_merge_sha: "f5f0235b052e9efe6da30524767f41eac9469002"
    verified_at: "2026-08-07T06:55:30Z"
