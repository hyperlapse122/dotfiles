  "gh-issues:hyperlapse122/dotfiles#188":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "Repo guard: argv-forwarding wrappers drop the segment silently - classifyBash continues past any head outside its short recognised set, so xargs, timeout, nice, stdbuf, setsid, parallel and watch hide a real gh/glab issue write; P2, framed as an allowlist problem solved with a denylist, with a proposal to fail closed on an unrecognised head whose argv contains gh or glab."
