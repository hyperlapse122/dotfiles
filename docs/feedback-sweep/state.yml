  "gh-issues:hyperlapse122/dotfiles#176":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "Document splitCommand's load-bearing invariants in the repo guard - two unstated invariants (bash-style backslash handling inside quotes; command-substitution exclusion enforced two functions away) should be documented at the function since it is the guard's security-boundary complexity concentration."
    fix_ref: "https://github.com/hyperlapse122/dotfiles/pull/190"
    verified_merge_sha: "e44e6e41a20c89ac3a522ab86236eadd0979e0e5"
