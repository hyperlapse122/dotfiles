    source: "gh-issues"
    status: "acknowledged"
    sensitive: false
    body: "remove the agent-initiated issue-creation prohibition - proposes deleting the two-sentence issue-creation prohibition from .chezmoitemplates/agents-instructions.tmpl rather than adding a fourth conditional, citing three false blocks and zero prevented harms, and lists the neighbouring guards that must survive verbatim in meaning; a follow-up comment additionally asks to remove the unmanaged-repo-guard."
