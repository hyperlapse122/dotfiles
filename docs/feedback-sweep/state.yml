    updated_at: "2026-08-07T04:48:51Z"
  "gh-issues:hyperlapse122/dotfiles#175":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "Repo guard identity lookup runs before the verdict cache is consulted - probeOne always pays a bounded identity-subprocess cost even on a verdict cache hit, because identity is part of the cache key by design; fix needs a cheaper identity cache check, not a reordering."
    fix_ref: "https://github.com/hyperlapse122/dotfiles/pull/190"
    verified_merge_sha: "e44e6e41a20c89ac3a522ab86236eadd0979e0e5"
