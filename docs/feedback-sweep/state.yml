  "gh-issues:hyperlapse122/dotfiles#187":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "Repo guard: interpreter -c bodies are never scanned - classifyBash iterates only segment.bodies (heredoc/here-string), so a bash -c payload is never scanned, and a captured body is not re-split after decoded-whitespace expansion, so an ANSI-C-escaped inner command collapses into one token; P1, both variants classify as ignore."
