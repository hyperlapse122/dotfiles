  "gh-issues:hyperlapse122/dotfiles#183":
    source: "gh-issues"
    status: "closed"
    sensitive: false
    body: "allow user-directed issue creation in the agent instruction core - the agent-instructions template's unconditional issue-creation ban blocks an explicit same-turn user request to file an issue, even in a repo the user administers; proposes narrowing the clause to require explicit user direction rather than banning all non-review issue filing."
