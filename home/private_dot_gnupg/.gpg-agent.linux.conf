# Card PIN wrapper (KTD6), deployed at ~/.gnupg/pinentry-card.
# The wrapper owns the desktop-aware delegate choice (gnome -> pinentry-gnome3,
# kde -> pinentry-qt, none -> pinentry-curses). PINENTRY_KDE_USE_WALLET still
# reaches pinentry-qt through the wrapper's environment (environment.d/70-desktop.conf).
pinentry-program {{ .chezmoi.homeDir }}/.gnupg/pinentry-card
