# Card PIN wrapper (KTD6), deployed at ~/.gnupg/pinentry-card.
# The wrapper owns the architecture-aware delegate choice (arm64 ->
# /opt/homebrew/bin/pinentry-mac, amd64 -> /usr/local/bin/pinentry-mac,
# matching the hook's Homebrew resolution).
pinentry-program {{ .chezmoi.homeDir }}/.gnupg/pinentry-card
