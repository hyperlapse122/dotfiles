<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Hide Fedora's Latin-only Noto Sans family from font matching.

  Some Korean sites declare local("NotoSans Regular"), local("NotoSans
  Medium"), or local("NotoSans Bold") before their Korean webfont. Fedora's
  google-noto-sans-fonts package provides those local faces, but they do not
  contain precomposed Hangul syllables. Chromium then decomposes Hangul into
  compatibility jamo instead of loading the site's Korean font.

  The CJK family remains available as Noto Sans CJK KR. This is a user-level
  fontconfig filter, so it does not remove or modify the system package.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Noto Sans</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
