[tools]
aube = "latest"
bun = "latest"
"npm:@colbymchenry/codegraph" = "latest"
rust = { version = "1.98.0", components = "rust-analyzer,rust-src" }

[hooks]
postinstall = [
  { run = "bash -c \"cd packages; vp install\"" },
  { run = "bash -c \"cd crates/mxm4-haptic; cargo fetch\"" },
  { run = "codegraph init" },
  { run = "codegraph sync" },
]

[settings]
lockfile = true
