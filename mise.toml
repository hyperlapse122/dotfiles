[tools]
"npm:@sentry/dotagents" = "latest"
"npm:markdownlint-cli2" = "0.24.0"

[tasks.lint-staged-markdown]
run = "scripts/lint-staged-markdown"

[tasks.agent-check]
run = "bash scripts/check-changed-files"

[hooks]
postinstall = [
  { run = "dotagents --project install" },
]

[settings]
lockfile = true
