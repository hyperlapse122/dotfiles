{{- /* AI coding agents and adjacent tooling: claude, codex, kimi, agent-browser, agy, opencode, pi, omp, codegraph, aoe, cli-proxy-api (darwin), and the agent skills listed in .chezmoidata/agents.yaml (agents.skills.external). */ -}}

{{- $executableExtension := (replace "linux" "" (replace "darwin" "" (replace "windows" ".exe" .chezmoi.os))) -}}

{{- /* Host libc, probed once: true on a musl Linux, where some upstreams ship a separate
       static-musl build. Shared by the claude and agent-browser externals below so the
       `ldd` subprocess runs once per render rather than once per consumer. */ -}}
{{- $isMuslLinux := false -}}
{{- if eq .chezmoi.os "linux" -}}
  {{- if eq (output "sh" "-c" "ldd /bin/ls 2>&1 | grep -q musl; echo $?" | trim) "0" -}}
    {{- $isMuslLinux = true -}}
  {{- end -}}
{{- end -}}

{{- /* ---------- claude-code (anthropic downloads manifest, not a GitHub release) ---------- */ -}}

{{- /* Version, URL, sha256 and size are resolved at refresh time by
       packages/release-lock from the downloads.claude.ai latest + manifest.json
       pair; the lock carries per-platform artifacts with distinct musl keys
       (KTD11), so the render only reads the locked values. */ -}}
{{- $latestReleaseVersion := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "claude") -}}
{{- $claudeLockArtifact := dict "ctx" . "tool" "claude" "platform" "auto" "musl" $isMuslLinux -}}

[claude]
type = "file"
targetPath = '{{ printf ".local/share/claude/versions/%s%s" $latestReleaseVersion $executableExtension }}'
url = '{{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $claudeLockArtifact (dict "field" "url")) }}'
executable = true
# 0500: the binary is not rewritable in place, only replaceable by a chezmoi apply
# that fetches a new version dir.
private = true
readonly = true

[claude.checksum]
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $claudeLockArtifact (dict "field" "sha256")) }}'
size = {{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $claudeLockArtifact (dict "field" "size")) }}

{{- /* ---------- codex ---------- */ -}}

{{- $codexArch := (replace "amd64" "x86_64" (replace "arm64" "aarch64" .chezmoi.arch)) -}}

{{- $codexTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "codex") -}}
{{- $codexRelease := (replace "rust-v" "" $codexTag) -}}
{{- $codexTarget := (replace "linux" "unknown-linux-musl" (replace "darwin" "apple-darwin" (replace "windows" "pc-windows-msvc" .chezmoi.os))) -}}

{{- $codexReleasePath := (printf "%s-%s-%s" $codexRelease $codexArch $codexTarget) -}}

{{- $codexInstallationPath := (joinPath ".codex" "packages" "standalone" "releases" $codexReleasePath) }}

[codex]
type = "archive"
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "codex" "field" "url" "platform" "auto") }}'
stripComponents = 0
targetPath = '{{ $codexInstallationPath }}'

{{- /* ---------- kimi-code — the official standalone release is one executable per
       platform zip. The tag (verbatim, `@moonshot-ai/kimi-code@<semver>` — KTD10)
       and the GitHub-computed per-asset sha256 are resolved at refresh time by
       packages/release-lock; the download URL is built as a plain string from
       that same locked tag (KTD8 constructed-URL pattern), so the render
       performs no network I/O. The tag contains `@`, which the download URL
       carries percent-encoded (as upstream's browser_download_url does) while
       the path segment `/` stays literal. ---------- */ -}}

{{- $kimiTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "kimi") -}}

{{- $kimiOs := replace "windows" "win32" .chezmoi.os -}}
{{- $kimiArch := replace "amd64" "x64" .chezmoi.arch -}}
{{- $kimiAsset := printf "kimi-code-%s-%s.zip" $kimiOs $kimiArch }}

[kimi]
type = "archive-file"
targetPath = '{{ printf ".local/bin/kimi%s" $executableExtension }}'
url = '{{ printf "https://github.com/MoonshotAI/kimi-code/releases/download/%s/%s" (replace "@" "%40" $kimiTag) $kimiAsset }}'
path = '{{ printf "kimi%s" $executableExtension }}'
executable = true

[kimi.checksum]
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "kimi" "field" "sha256" "platform" "auto") }}'

{{- /* ---------- agent-browser (vercel-labs) — a single self-contained Rust binary
       ("Browser automation CLI for AI agents"), tracked at the newest release like
       claude/codex. The release ships bare per-platform binaries (agent-browser-<os>-<arch>,
       the linux fork split glibc vs static musl, windows carrying .exe) and NO checksums
       sidecar; the tag, per-platform download URL, and each asset's GitHub-computed
       sha256 digest are resolved at refresh time by packages/release-lock (distinct musl
       lock keys per KTD11), so the render only reads the locked values and performs no
       network I/O. windows-arm64 is served the x64 binary via the lock's emulated entry,
       so the URL MUST come from the lock — composing the asset name from the host arch
       would name a build upstream does not publish. ---------- */}}

[agent-browser]
type = "file"
targetPath = '{{ printf ".local/bin/agent-browser%s" $executableExtension }}'
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "agent-browser" "field" "url" "platform" "auto" "musl" $isMuslLinux) }}'
executable = true

[agent-browser.checksum]
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "agent-browser" "field" "sha256" "platform" "auto" "musl" $isMuslLinux) }}'

{{- /* ---------- antigravity (agy) — vendor auto-updater manifest, not a GitHub release ---------- */ -}}

{{- /* Version, per-platform URL and sha512 are resolved at refresh time by
       packages/release-lock from the vendor's per-platform GCS manifests; the
       render only reads the locked values. The version read also fail-closes
       here if the lock entry ever loses its version. */ -}}
{{- $antigravityVersion := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "agy") -}}
{{- $agyLockArtifact := dict "ctx" . "tool" "agy" "platform" "auto" -}}

{{- if eq .chezmoi.os "windows" }}
[agy]
type = "file"
targetPath = '{{ printf ".local/bin/agy%s" $executableExtension }}'
url = '{{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $agyLockArtifact (dict "field" "url")) }}'
executable = true

[agy.checksum]
sha512 = '{{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $agyLockArtifact (dict "field" "sha512")) }}'
{{- else }}
[agy]
type = "archive-file"
targetPath = '.local/bin/agy'
url = '{{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $agyLockArtifact (dict "field" "url")) }}'
path = 'antigravity'
executable = true

[agy.checksum]
sha512 = '{{ includeTemplate "release-lock-ref.tmpl" (mergeOverwrite $agyLockArtifact (dict "field" "sha512")) }}'
{{- end }}

{{- /* ---------- opencode (darwin ships a .zip, unlike the tar.gz users below) ---------- */}}

[opencode]
targetPath = '{{ printf ".local/bin/opencode%s" $executableExtension }}'
type = "archive-file"
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "opencode" "field" "url" "platform" "auto") }}'
executable = true
path = '{{ printf "opencode%s" $executableExtension }}'

{{- /* ---------- pi (earendil-works) — a whole-dir distribution, not a lone binary: the
       executable resolves its own sibling package.json / theme/ / export-html/ / .wasm, so the
       tree is extracted per version and ~/.local/bin/pi is symlinked at it by
       .chezmoiscripts/00-tools/run_onchange_after_pi.sh.tmpl. POSIX only (the release does ship
       windows .zip assets, but the linker script has no .ps1 counterpart). ---------- */ -}}

{{- if ne .chezmoi.os "windows" -}}

{{- /* $piTag is also read by dot_pi/agent/readonly_settings.json.tmpl
       (lastChangelogVersion) from the SAME release-lock key, so the managed
       settings.json always matches the pi on disk — no shared partial. */ -}}
{{- $piTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "pi") -}}

{{- /* The tag, per-asset URL and sha256 (upstream publishes one combined
       SHA256SUMS sidecar) are resolved at refresh time by
       packages/release-lock; the render reads the locked values. */ -}}
{{- $piSha := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "pi" "field" "sha256" "platform" "auto") }}

[pi]
type = "archive"
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "pi" "field" "url" "platform" "auto") }}'
targetPath = '{{ printf ".local/share/pi/versions/%s" $piTag }}'
stripComponents = 1

[pi.checksum]
sha256 = '{{ $piSha }}'

{{- end }}

{{- /* ---------- omp (oh-my-pi, can1357) — a lone per-platform binary that is a
       fork of pi: a raw executable (windows .exe), cross-platform (unlike pi it
       ships a windows build), placed directly at ~/.local/bin/omp via type="file"
       with executable=true. No pi-style archive extraction or symlink script; the
       tag, per-platform URL and sha256 come from the release lock's per-asset
       digest, and musl linux hosts pick the static-musl binary. ---------- */}}

[omp]
type = "file"
targetPath = '{{ printf ".local/bin/omp%s" $executableExtension }}'
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "omp" "field" "url" "platform" "auto" "musl" $isMuslLinux) }}'
executable = true

[omp.checksum]
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "omp" "field" "sha256" "platform" "auto" "musl" $isMuslLinux) }}'

{{- /* ---------- codegraph ---------- */ -}}

{{- $codegraphTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "codegraph") }}

[codegraph]
{{ if ne .chezmoi.os "windows" }}
targetPath = '{{ printf ".codegraph/versions/%s" $codegraphTag }}'
{{ else }}
targetPath = '{{ joinPath (env "LOCALAPPDATA") "codegraph" "current" }}'
{{ end }}
type = "archive"
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "codegraph" "field" "url" "platform" "auto") }}'
stripComponents = 1

{{- /* ---------- agent-of-empires (aoe) — the worktree/session orchestrator; no windows build ---------- */ -}}

{{- if ne "windows" .chezmoi.os }}

{{- $aoeTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "aoe") }}

[aoe]
type = "archive-file"
url = {{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "aoe" "field" "url" "platform" "auto") | quote }}
executable = true
targetPath = ".local/bin/aoe"
path = '{{ printf "aoe-%s-%s" .chezmoi.os .chezmoi.arch }}'

[aoe.checksum]
# The sidecar is sha256sum output ("<hash>  <file>"), so take the first field.
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "aoe" "field" "sha256" "platform" "auto") }}'

{{- end }}

{{- /* ---------- cli-proxy-api (router-for-me/CLIProxyAPI) — macOS runs the binary
       directly under launchd; linux runs the OCI quadlet instead, so this external
       is darwin-only. The tar.gz ships the binary as `cli-proxy-api` (lowercase)
       alongside LICENSE/README/config.example.yaml. ---------- */ -}}

{{- if eq "darwin" .chezmoi.os }}

[cli-proxy-api]
type = "archive-file"
url = {{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "cli-proxy-api-binary" "field" "url" "platform" "auto") | quote }}
executable = true
private = true
readonly = true
targetPath = ".local/bin/cli-proxy-api"
path = 'cli-proxy-api'

[cli-proxy-api.checksum]
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "cli-proxy-api-binary" "field" "sha256" "platform" "auto") }}'

{{- end }}

{{- /* ---------- agent skills (~/.agents/skills/<name>) — formerly dotagents remote skills.
       The LIST is data in .chezmoidata/agents.yaml (agents.skills.external); this section
       ranges over it. Now chezmoi externals so each skill's release/branch is pinned by
       chezmoi at render time rather than fetched by `dotagents install`. Two fetch forms,
       keyed on the entry's `host` (default github; unknown values fail):

       host: github — every source repo keeps its skill in a skills/<name>/ subdir, so
       stripComponents=3 drops the <repo>-<ref>/skills/<name>/ prefix (leaving SKILL.md +
       references/ at the target root) and the include (anchored on the skills/<name>/ path
       segment) isolates exactly that one skill — it excludes repo-root files, a repo's own
       dot-claude skills tree or nested package skills trees, and any sibling skill in the
       same repo (a source repo can ship several skills under skills/). exact=true so a
       skill update removes deleted files. The GitHub archive URL form takes a tag OR a
       commit.

       host: gitlab — a raw single-file external, for a skill whose subtree is exactly one
       SKILL.md (glab's bundled skills, whose `skillPath` is
       internal/commands/skills/bundled/assets/<name>/): fetching that one file beats
       extracting the whole repo tarball per skill. `exact` does not apply to a single
       file — the file is replaced when its URL changes, and an upstream removal 404s the
       fetch, failing apply loudly. A subtree that later gains sibling files (references/)
       must switch this branch to an archive form.

       Ref rule per entry: `versionSource: glabRelease` -> the shared
       glab-release-ref.tmpl partial (the glab CLI's latest release — the same tag the
       vcs.toml binary pins, so skills and CLI never diverge by configuration; mutually
       exclusive with `ref` (enforced), and unknown versionSource values fail; the tag is
       read once per render from the release lock and shared by every glabRelease entry,
       so all such skills pin one atomic tag); otherwise no `ref`
       key -> the newest upstream release tag recorded in the release lock,
       keyed on the skill name; a `ref` key -> that branch head
       resolved to a commit sha in the release lock at refresh time by
       packages/release-lock (repos with no releases/tags, e.g.
       shadcn/improve). In every case the resolved ref sits in the URL, so both the URL and
       chezmoi's refresh key stay immutable for one render and a release bump re-fetches on
       the next apply. dotagents runs for the MCP servers only now
       (no path: skills any more) and still owns the ~/.claude/skills -> ~/.agents/skills
       symlink; its `install` never prunes an UNDECLARED dir (prune is sync-only, which the
       apply never runs), so these externals coexist with the symlink and with any
       locally-authored chezmoi-managed skill under dot_agents/skills/<name>/. POSIX only,
       matching the install-dotagents-skills linux+darwin gate. Every ref in this
       file now resolves from the release lock at render time, so the render
       performs no GitHub API calls. ---------- */ -}}

{{- if ne .chezmoi.os "windows" -}}
{{- $skillsCtx := . -}}
{{- /* Lazy per-render cache: resolved on the first glabRelease entry, so one
       render pins every glabRelease skill to one atomic tag. */ -}}
{{- $glabReleaseRef := "" -}}
{{- range .agents.skills.external }}
{{- $ref := "" -}}
{{- if and (hasKey . "versionSource") (hasKey . "ref") -}}
  {{- fail (printf "%s skill: versionSource and ref are mutually exclusive" .name) -}}
{{- end -}}
{{- if hasKey . "versionSource" -}}
  {{- if eq .versionSource "glabRelease" -}}
    {{- if eq $glabReleaseRef "" -}}{{- $glabReleaseRef = includeTemplate "glab-release-ref.tmpl" $skillsCtx -}}{{- end -}}
    {{- $ref = $glabReleaseRef -}}
  {{- else -}}
    {{- fail (printf "%s skill: unsupported versionSource %q" .name .versionSource) -}}
  {{- end -}}
{{- else if hasKey . "ref" -}}
  {{- /* Branch refs (repos with no releases/tags, e.g. shadcn/improve) resolve to a
         40-character commit sha at refresh time by packages/release-lock, keyed on the
         skill name; the lock read fails closed if the key is missing (R6). */ -}}
  {{- $ref = includeTemplate "release-lock-ref.tmpl" (dict "ctx" $skillsCtx "tool" .name) -}}
{{- else -}}
  {{- /* No `ref` key: the newest upstream release tag recorded in the release
         lock at refresh time, keyed on the skill name (R6 fail-closed). */ -}}
  {{- $ref = includeTemplate "release-lock-ref.tmpl" (dict "ctx" $skillsCtx "tool" .name) -}}
{{- end }}
{{- $host := "github" -}}
{{- if hasKey . "host" -}}{{- $host = .host -}}{{- end -}}
{{- if and (ne $host "github") (ne $host "gitlab") -}}
  {{- fail (printf "%s skill: unsupported host %q" .name $host) -}}
{{- end -}}
{{- if eq $host "gitlab" -}}
  {{- if not (hasKey . "skillPath") -}}
    {{- fail (printf "%s skill: host gitlab requires skillPath" .name) -}}
  {{- end }}

[".agents/skills/{{ .name }}/SKILL.md"]
type = "file"
url = '{{ printf "https://gitlab.com/%s/-/raw/%s/%s/SKILL.md?ref_type=tags" .source $ref .skillPath }}'
{{- else }}

[".agents/skills/{{ .name }}"]
type = "archive"
url = '{{ printf "https://github.com/%s/archive/%s.tar.gz" .source $ref }}'
exact = true
stripComponents = 3
include = ["*/skills/{{ .name }}/**"]
{{- end }}
{{- end }}
{{- end }}

{{- /* ---------- opencode.plugins with install=localArchive — release tarballs extracted per
       version so every agent references the same on-disk path. Data lives in
       .chezmoidata/agents.yaml (agents.opencode.plugins); the OpenCode `plugin` array reads
       the same entry through .chezmoitemplates/opencode-plugins-json.tmpl, and
       the generic .chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins registers the
       same path with Claude Code and Codex and installs the native bundle root
       for AGY (pi installs CE separately as a git: source). Sibling versions are pruned by
       .chezmoiscripts/00-tools/run_onchange_after_compound-engineering.
       stripComponents=1 drops the GitHub archive's `<repo>-<tag>/` prefix so the
       repo root (package.json, .opencode/, .claude-plugin/, .codex-plugin/, skills/, ...)
       lands directly at the target. `exact` is intentionally OMITTED so the tree is
       additive — chezmoi adds/updates archive files but leaves others, letting the
       compound-engineering-overlays provisioner install archive-absent source
       personas such as ce-sweep's gitlab-issues reference. Tradeoff: a version dir no
       longer self-cleans upstream deletions within a version cycle (each version bump
       creates a fresh dir, resetting it); CE is the sole localArchive plugin today.
       POSIX only — matches the install script's linux+darwin gate
       and the sibling agent-skills block. compoundEngineeringRelease yields tags of the
       form `compound-engineering-v<semver>`; the on-disk version segment strips the
       front-half prefix and keeps the `v` so it matches the tag's own version suffix. */ -}}

{{- $ctx := . -}}
{{- if ne .chezmoi.os "windows" -}}
{{- range .agents.opencode.plugins -}}
{{-   if eq .install "localArchive" -}}
{{-     $ref := "" -}}
{{-     if eq .versionSource "compoundEngineeringRelease" -}}
{{-       $ref = includeTemplate "compound-engineering-ref.tmpl" $ctx -}}
{{-     else -}}
{{-       fail (printf "%s plugin: unsupported versionSource %q for install=localArchive" .package .versionSource) -}}
{{-     end -}}
{{-     $verSegment := "" -}}
{{-     if eq .versionSource "compoundEngineeringRelease" -}}
{{-       $verSegment = printf "v%s" (trimPrefix "compound-engineering-v" $ref) -}}
{{-     else -}}
{{-       $verSegment = printf "v%s" (trimPrefix "v" $ref) -}}
{{-     end }}

[{{ printf "%s/%s" .externalPath $verSegment | quote }}]
type = "archive"
url = '{{ printf "https://github.com/%s/archive/%s.tar.gz" .source $ref }}'
stripComponents = 1
{{-   end -}}
{{- end -}}
{{- end -}}
