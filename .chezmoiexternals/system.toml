{{- /*
  Host/system-level externals: docker credential helpers, wakatime-cli, the
  prezto zsh framework, and WinBox (MikroTik RouterOS GUI).
*/ -}}

{{- /* ---------- docker-credential-helpers (one helper per OS credential store) ---------- */ -}}

{{- $dockerCredentialHelpersUrl := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "docker-credential-helpers" "field" "url" "platform" "auto") }}

{{- if eq .chezmoi.os "linux" }}

[docker-credential-secretservice]
type = "file"
targetPath = '.local/share/chezmoi-commands/incomplete/docker-credential-secretservice/docker-credential-secretservice'
url = {{ $dockerCredentialHelpersUrl | quote }}
executable = true

{{- else if eq .chezmoi.os "darwin" }}

[docker-credential-osxkeychain]
type = "file"
targetPath = '.local/share/chezmoi-commands/incomplete/docker-credential-osxkeychain/docker-credential-osxkeychain'
url = {{ $dockerCredentialHelpersUrl | quote }}
executable = true

{{- end }}

{{- /* ---------- wakatime-cli ---------- */}}

[wakatime-cli]
type = "archive-file"
targetPath = '.local/share/chezmoi-commands/incomplete/wakatime-cli/wakatime-cli'
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "wakatime-cli" "field" "url" "platform" "auto") }}'
executable = true
path = '{{ printf "wakatime-cli-%s-%s" .chezmoi.os .chezmoi.arch }}'

{{- /* ---------- prezto (zsh framework) ---------- */}}

[prezto]
type = "git-repo"
targetPath = ".config/zsh/.zprezto"
url = "https://github.com/sorin-ionescu/prezto.git"
clone.args = ["--recursive"]
refreshPeriod = "8760h"

{{- /* ---------- winbox (MikroTik RouterOS GUI; vendor version endpoint, not GitHub) ---------- */ -}}
{{- /*
  WinBox is not published on GitHub, so the version comes from MikroTik's
  LATEST.4 endpoint (returns
  the bare current version, e.g. "4.3"), resolved at refresh time into the
  release lock by packages/release-lock rather than pinned. Every platform lands
  the app in the SAME ~/.local/share/winbox folder:
  the linux zip carries the binary + assets/img/winbox.png and is
  extracted whole (type=archive preserves the executable bit — verified), so the
  GUI keeps its bundled icon; the linux launcher is rendered separately as
  dot_local/share/applications/winbox.desktop. macOS ships only a .dmg, which
  chezmoi cannot extract, so it is staged here and
  .chezmoiscripts/00-tools/run_onchange_after_winbox-macos mounts it and copies
  WinBox.app into the same folder. MikroTik publishes Linux as x86_64-only and
  the tool is desktop-only, so the block gates on amd64-linux / darwin
  and is skipped in containers.

  linux uses TWO archive-file externals (binary + icon) sharing one
  cached download, NOT a single type=archive: an archive external has no fixed
  target path, so chezmoi must download and extract the whole zip just to
  enumerate its entries while building the target state — even during an
  unrelated `apply --include=externals <other>`, which coupled unrelated checks
  to a 20 MB MikroTik download. archive-file has explicit target paths, so
  the zip is fetched only when winbox itself is applied. Mirrors ast-grep/sg.
*/ -}}

{{- $winboxFacts := includeTemplate "facts.tmpl" . | fromYaml -}}
{{- if and (not $winboxFacts.container) (or (and (eq .chezmoi.os "linux") (eq .chezmoi.arch "amd64")) (eq .chezmoi.os "darwin")) -}}
{{- /* The version is resolved at refresh time by packages/release-lock from
       MikroTik's LATEST.4 endpoint; the render reads the locked version. */ -}}
{{- $winboxVersion := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "winbox") -}}
{{- $winboxBase := printf "https://download.mikrotik.com/routeros/winbox/%s" $winboxVersion -}}

{{- if and (eq .chezmoi.os "linux") (eq .chezmoi.arch "amd64") }}

[winbox]
type = "archive-file"
url = '{{ printf "%s/WinBox_Linux.zip" $winboxBase }}'
path = 'WinBox'
targetPath = '.local/share/winbox/WinBox'
executable = true

[winbox-icon]
type = "archive-file"
url = '{{ printf "%s/WinBox_Linux.zip" $winboxBase }}'
path = 'assets/img/winbox.png'
targetPath = '.local/share/winbox/assets/img/winbox.png'

{{- else if eq .chezmoi.os "darwin" }}

# chezmoi cannot extract a .dmg: stage it here; run_onchange_after_winbox-macos
# mounts it and copies WinBox.app into ~/.local/share/winbox.
[winbox]
type = "file"
url = '{{ printf "%s/WinBox.dmg" $winboxBase }}'
targetPath = '.local/share/winbox/WinBox.dmg'

{{- end }}
{{- end }}
