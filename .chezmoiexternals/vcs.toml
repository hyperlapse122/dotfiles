{{- /* Version-control & repo-orchestration CLIs: gh, glab, garden. glab's
       bundled skills are agent-skill externals in ai-agents.toml, pinned to
       the same release via glab-release-ref.tmpl. */ -}}

{{- /* ---------- gh ---------- */ -}}
{{- /* The per-platform URL is resolved at refresh time by packages/release-lock;
       the render only reads the locked value. */}}

[gh]
type = "archive-file"
targetPath = '.local/share/chezmoi-commands/incomplete/gh/gh'
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "gh" "field" "url" "platform" "auto") }}'
path = 'bin/gh'
executable = true
stripComponents = 1

{{- /* ---------- glab (GitLab-hosted release, not GitHub) ---------- */ -}}

{{- /* The tag is single-sourced with the bundled-skill externals in
       ai-agents.toml (their versionSource: glabRelease) via the shared
       partial, so the CLI and its skills never pin different releases. */ -}}
{{- $glabTag := includeTemplate "glab-release-ref.tmpl" . -}}

{{- $glabArchiveUrl := (printf "https://gitlab.com/gitlab-org/cli/-/releases/%s/downloads/glab_%s_%s_%s.tar.gz" $glabTag (replace "v" "" $glabTag) .chezmoi.os .chezmoi.arch) }}

[glab]
targetPath = '.local/share/chezmoi-commands/incomplete/glab/glab'
type = "archive-file"
url = '{{ $glabArchiveUrl }}'
path = 'bin/glab'
executable = true

{{- /* ---------- garden ---------- */ -}}

{{- $gardenTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "garden") -}}
{{- $gardenVersion := trimPrefix "v" $gardenTag -}}
{{- /* An emulated arch borrows the amd64 build (lock marks it emulated), so the
       archive-internal path composes from the SERVED arch, not the host's. */ -}}
{{- $gardenPathArch := .chezmoi.arch -}}
{{- if eq (includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "garden" "field" "emulated" "platform" "auto" "optional" true)) "true" -}}
{{-   $gardenPathArch = "amd64" -}}
{{- end -}}
{{- $gardenArch := (replace "arm64" "aarch64" (replace "amd64" "x86_64" $gardenPathArch)) -}}
{{- $gardenOperatingSystem := (replace "linux" "unknown-linux-gnu" (replace "darwin" "apple-darwin" .chezmoi.os)) -}}
{{- $gardenStem := (printf "garden-%s-%s-%s" $gardenVersion $gardenArch $gardenOperatingSystem) }}

[garden]
type = "archive-file"
url = {{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "garden" "field" "url" "platform" "auto") | quote }}
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/garden/garden'
path = '{{ printf "%s/garden" $gardenStem }}'
