{{- /* Kubernetes CLIs: kubectl (+ kubectl-convert), helm, minikube. */ -}}

{{- /* ---------- kubectl (versioned by the kubernetes/kubernetes tag, served from dl.k8s.io) ---------- */ -}}

{{- /* Version-only lock read: the tag comes from the release lock (resolved at
       refresh time by packages/release-lock), the download URL keeps building
       against dl.k8s.io (KTD8). */ -}}
{{- $kubectlTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "kubectl") }}

[kubectl]
type = "file"
targetPath = '.local/bin/kubectl'
url = '{{ printf "https://dl.k8s.io/release/%s/bin/%s/%s/kubectl" $kubectlTag .chezmoi.os .chezmoi.arch }}'
executable = true

[kubectl-convert]
type = "file"
targetPath = '.local/bin/kubectl-convert'
url = '{{ printf "https://dl.k8s.io/release/%s/bin/%s/%s/kubectl-convert" $kubectlTag .chezmoi.os .chezmoi.arch }}'
executable = true

{{- /* ---------- helm (tag from the release lock, archive from get.helm.sh) ---------- */ -}}

{{- $helmTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "helm") }}

[helm]
targetPath = '.local/bin/helm'
type = "archive-file"
url = '{{ printf "https://get.helm.sh/helm-%s-%s-%s.tar.gz" $helmTag .chezmoi.os .chezmoi.arch }}'
path = '{{ printf "%s-%s/helm" .chezmoi.os .chezmoi.arch }}'
executable = true

{{- /* ---------- minikube ---------- */}}

[minikube]
type = "archive-file"
targetPath = '.local/bin/minikube'
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "minikube" "field" "url" "platform" "auto") }}'
path = '{{ printf "out/minikube-%s-%s" .chezmoi.os .chezmoi.arch }}'
executable = true
