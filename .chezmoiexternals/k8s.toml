{{- /* Kubernetes CLIs: kubectl (+ kubectl-convert), helm, minikube. */ -}}

{{- $executableExtension := (replace "linux" "" (replace "darwin" "" (replace "windows" ".exe" .chezmoi.os))) -}}
{{- $archiveExtension := (replace "linux" ".tar.gz" (replace "darwin" ".tar.gz" (replace "windows" ".zip" .chezmoi.os))) -}}

{{- /* ---------- kubectl (versioned by the kubernetes/kubernetes tag, served from dl.k8s.io) ---------- */ -}}

{{- /* Version-only lock read: the tag comes from the release lock (resolved at
       refresh time by packages/release-lock), the download URL keeps building
       against dl.k8s.io (KTD8). */ -}}
{{- $kubectlTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "kubectl") }}

[kubectl]
type = "file"
targetPath = '{{ printf ".local/bin/kubectl%s" $executableExtension }}'
url = '{{ printf "https://dl.k8s.io/release/%s/bin/%s/%s/kubectl%s" $kubectlTag .chezmoi.os .chezmoi.arch $executableExtension }}'
executable = true

[kubectl-convert]
type = "file"
targetPath = '{{ printf ".local/bin/kubectl-convert%s" $executableExtension }}'
url = '{{ printf "https://dl.k8s.io/release/%s/bin/%s/%s/kubectl-convert%s" $kubectlTag .chezmoi.os .chezmoi.arch $executableExtension }}'
executable = true

{{- /* ---------- helm (tag from the release lock, archive from get.helm.sh) ---------- */ -}}

{{- $helmTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "helm") }}

[helm]
targetPath = '{{ printf ".local/bin/helm%s" $executableExtension }}'
type = "archive-file"
url = '{{ printf "https://get.helm.sh/helm-%s-%s-%s%s" $helmTag .chezmoi.os .chezmoi.arch $archiveExtension }}'
path = '{{ printf "%s-%s/helm" .chezmoi.os .chezmoi.arch }}'
executable = true

{{- /* ---------- minikube ---------- */ -}}
{{- /* windows-arm64 borrows the amd64 tarball (lock marks it emulated), so the
       archive-internal path composes from the SERVED arch, not the host's. */}}

{{- $minikubePathArch := .chezmoi.arch -}}
{{- if eq (includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "minikube" "field" "emulated" "platform" "auto" "optional" true)) "true" -}}
{{-   $minikubePathArch = "amd64" -}}
{{- end }}

[minikube]
type = "archive-file"
targetPath = '{{ printf ".local/bin/minikube%s" $executableExtension }}'
url = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "minikube" "field" "url" "platform" "auto") }}'
path = '{{ printf "out/minikube-%s-%s%s" .chezmoi.os $minikubePathArch $executableExtension }}'
executable = true
