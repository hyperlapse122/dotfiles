{{- /*
  Developer CLIs & language servers: android, ast-grep, buf, marksman,
  shellcheck, wasm-pack, rust-analyzer, uv/uvx.
*/ -}}

{{- /* Rust-style triple components, shared by the rust-toolchain-built CLIs below. */ -}}
{{- $rustArch := (replace "arm64" "aarch64" (replace "amd64" "x86_64" .chezmoi.arch)) -}}
{{- /* Same, but for the projects that only publish a static musl linux build. */ -}}
{{- $muslTarget := (replace "linux" "unknown-linux-musl" (replace "darwin" "apple-darwin" .chezmoi.os)) -}}

{{- /* ---------- android (Google Android CLI) ---------- */ -}}

{{- $androidUrl := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "android" "field" "url" "platform" "auto") }}

[android]
type = "file"
targetPath = '.local/share/chezmoi-commands/incomplete/android/android'
url = {{ $androidUrl | quote }}
executable = true
[android.checksum]
sha256 = '{{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "android" "field" "sha256" "platform" "auto") }}'

{{- /* ---------- ast-grep (ships the `sg` alias from the same archive) ---------- */ -}}

{{- $astGrepArchiveUrl := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "ast-grep" "field" "url" "platform" "auto") }}

[ast-grep]
type = "archive-file"
url = '{{ $astGrepArchiveUrl }}'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/ast-grep/ast-grep'
path = 'ast-grep'

[sg]
type = "archive-file"
url = '{{ $astGrepArchiveUrl }}'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/sg/sg'
path = 'sg'

{{- /* ---------- buf (+ its protoc plugins, zsh completion and man pages) ---------- */ -}}

{{- $bufArchiveUrl := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "buf" "field" "url" "platform" "auto") }}

[buf]
type = "archive-file"
url = '{{ $bufArchiveUrl }}'
path = 'buf/bin/buf'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/buf/buf'

[protoc-gen-buf-breaking]
type = "archive-file"
url = '{{ $bufArchiveUrl }}'
path = 'buf/bin/protoc-gen-buf-breaking'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/protoc-gen-buf-breaking/protoc-gen-buf-breaking'

[protoc-gen-buf-lint]
type = "archive-file"
url = '{{ $bufArchiveUrl }}'
path = 'buf/bin/protoc-gen-buf-lint'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/protoc-gen-buf-lint/protoc-gen-buf-lint'

[buf-zsh-completion]
type = "archive-file"
targetPath = '.local/share/zsh/site-functions/_buf'
url = '{{ $bufArchiveUrl }}'
path = 'buf/share/zsh/site-functions/_buf'
executable = false

[buf-man]
type = "archive"
targetPath = '.local/share/man/man1'
url = '{{ $bufArchiveUrl }}'
include = ["**/*.1"]
stripComponents = 4
executable = false

{{- /* ---------- marksman (bare binaries; asset naming differs per OS) ---------- */ -}}

{{- $marksmanUrl := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "marksman" "field" "url" "platform" "auto") }}

[marksman]
type = "file"
targetPath = '.local/share/chezmoi-commands/incomplete/marksman/marksman'
url = {{ $marksmanUrl | quote }}
executable = true

{{- /* ---------- shellcheck ---------- */ -}}
{{- /*
  Assets are per-arch (shellcheck-<tag>.<os>.<arch>.tar.gz) and nest the
  binary under a shellcheck-<tag>/ directory.
*/ -}}

{{- $shellcheckTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "shellcheck") -}}
{{- $shellcheckPath := (printf "shellcheck-%s/shellcheck" $shellcheckTag) }}

[shellcheck]
type = "archive-file"
url = {{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "shellcheck" "field" "url" "platform" "auto") | quote }}
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/shellcheck/shellcheck'
path = '{{ $shellcheckPath }}'

{{- /* ---------- wasm-pack ---------- */ -}}
{{- /*
  Linux is published only as a static musl build, which runs fine on glibc.
*/ -}}

{{- $wasmPackTag := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "wasm-pack") -}}
{{- $wasmPackStem := (printf "wasm-pack-%s-%s-%s" $wasmPackTag $rustArch $muslTarget) }}

[wasm-pack]
type = "archive-file"
url = {{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "wasm-pack" "field" "url" "platform" "auto") | quote }}
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/wasm-pack/wasm-pack'
path = '{{ printf "%s/wasm-pack" $wasmPackStem }}'

{{- /* ---------- rust-analyzer ---------- */ -}}
{{- /*
  The tag is a bare date (e.g. 2026-07-13) with NO leading "v" — do not trim one.
  The asset is a raw gzipped BINARY, not a tarball, so it is a
  type = "file" external with decompress = "gzip".
*/}}

[rust-analyzer]
type = "file"
url = {{ includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "rust-analyzer" "field" "url" "platform" "auto") | quote }}
decompress = "gzip"
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/rust-analyzer/rust-analyzer'

{{- /* ---------- uv (+ uvx, from the same archive) ---------- */ -}}
{{- /*
  The tag carries NO leading "v" (e.g. 0.11.28). Archives nest both
  binaries under uv-<arch>-<target>/.
*/ -}}

{{- $uvStem := (printf "uv-%s-%s" $rustArch $muslTarget) -}}
{{- $uvArchiveUrl := includeTemplate "release-lock-ref.tmpl" (dict "ctx" . "tool" "uv" "field" "url" "platform" "auto") -}}
{{- $uvPathPrefix := (printf "%s/" $uvStem) }}

[uv]
type = "archive-file"
url = '{{ $uvArchiveUrl }}'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/uv/uv'
path = '{{ printf "%suv" $uvPathPrefix }}'

[uvx]
type = "archive-file"
url = '{{ $uvArchiveUrl }}'
executable = true
targetPath = '.local/share/chezmoi-commands/incomplete/uvx/uvx'
path = '{{ printf "%suvx" $uvPathPrefix }}'

{{- /* ---------- flutter ---------- */ -}}
{{- /*
  DELIBERATELY NOT AN EXTERNAL. A chezmoi archive external makes every
  extracted file part of the target state, and the Flutter SDK rewrites its
  own tree on ordinary use: bin/internal/shared.sh runs `git -C $FLUTTER_ROOT
  rev-parse HEAD` on every invocation (so .git cannot be excluded either — the
  tool aborts without it), git rewrites .git/objects/info/commit-graph, and the
  tool deletes and regenerates `version` and bin/cache/flutter.version.json.
  chezmoi then reports "has changed since chezmoi last wrote it" and, with no
  TTY, fails the whole apply. Delivery therefore lives in
  .chezmoiscripts/00-tools/run_onchange_after_flutter.sh.tmpl, which reads the
  same lock through release-lock-ref.tmpl and verifies the recorded sha256.
*/ -}}
