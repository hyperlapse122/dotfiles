# 1Password Connect server credential.
#
# The value is the RAW JSON of the whole 1password-credentials.json file.
# Verified against Connect 1.8.2: it unmarshals this key directly and refuses a
# base64 body with "invalid character 'e' looking for beginning of value". Base64
# is what the 1Password OPERATOR wants, which is not what runs here.
#
# 1Password issues that file once when the Connect server is created and it is
# not recoverable afterwards, so it lives in the vault as a document.
apiVersion: v1
kind: Secret
metadata:
  name: op-credentials
  namespace: onepassword
type: Opaque
stringData:
  1password-credentials.json: "{{ op://njbkpy6emfxkbl7n6zmwmz7jfu/Orca-Connect-Server/credentials-json }}"
