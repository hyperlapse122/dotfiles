# 1Password Connect server credential.
#
# The value is the BASE64 of the whole 1password-credentials.json file, which is
# what the Connect server expects to find in this key. 1Password issues that file
# once when the Connect server is created; it is not recoverable from the CLI, so
# it lives in the vault as a document.
apiVersion: v1
kind: Secret
metadata:
  name: op-credentials
  namespace: onepassword
type: Opaque
stringData:
  1password-credentials.json: "{{ op://H82/Orca-Connect-Server/credentials-base64 }}"
