# The auth key worker pods register with.
#
# Ephemeral and reusable, tagged tag:orca-workspace. Ephemeral is what makes a
# deleted pod's node disappear instead of accumulating; reusable is what lets
# more than one workspace exist at a time.
apiVersion: v1
kind: Secret
metadata:
  name: orca-worker-tailscale
  namespace: orca-workers
type: Opaque
stringData:
  TS_AUTHKEY: "{{ op://njbkpy6emfxkbl7n6zmwmz7jfu/Orca-Workspace-Tailscale/auth key }}"
