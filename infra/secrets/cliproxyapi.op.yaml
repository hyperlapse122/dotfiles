# CLIProxyAPI's two secret-bearing settings.
#
# worker-api-key is what workers send as ANTHROPIC_AUTH_TOKEN; the same value is
# stored in the agent vault as op://<agents vault>/CLIProxyAPI/worker api key, so
# the worker can resolve it through Connect at pod start.
#
# management-secret-key guards every /v0/management route. Management shares port
# 8317 with the API, so this key and the tailnet ACL are the two things standing
# between a tailnet peer and the proxy's credential store.
apiVersion: v1
kind: Secret
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
type: Opaque
stringData:
  worker-api-key: "{{ op://tum6wsa7azjvbkgwnp6fgamcvm/CLIProxyAPI/worker api key }}"
  # One item per cluster -- the title carries the cluster name, because each
  # cluster issues its own key and a shared title would silently serve the wrong
  # one. hp-z1-g6-01 is this cluster; a second cluster edits this line in its own
  # copy of the tree.
  management-secret-key: "{{ op://njbkpy6emfxkbl7n6zmwmz7jfu/CLIProxyAPI-Management-hp-z1-g6-01/credential }}"
