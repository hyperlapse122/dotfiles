# Tailscale Operator OAuth client.
#
# The chart mounts this Secret by name and templates it only when the chart
# values carry the client, which they deliberately do not. The client needs the
# `devices` and `auth_keys` write scopes and must own tag:orca-proxy.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
type: Opaque
stringData:
  client_id: "{{ op://H82/Tailscale-K8s-Operator/client id }}"
  client_secret: "{{ op://H82/Tailscale-K8s-Operator/client secret }}"
