# The Connect token a worker uses.
#
# This is the scoped one: it may reach the agent vault and nothing else. It is
# useless outside the cluster, is revoked centrally, and is the only 1Password
# credential an agent-controlled pod ever holds.
apiVersion: v1
kind: Secret
metadata:
  name: orca-worker-connect
  namespace: orca-workers
type: Opaque
stringData:
  token: "{{ op://H82/Orca-Connect-Server/worker token }}"
