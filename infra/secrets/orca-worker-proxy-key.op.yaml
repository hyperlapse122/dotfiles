# The proxy API key, worker side.
#
# The same value as `worker-api-key` in the cliproxyapi Secret. It lives twice
# because Secrets are namespace-scoped, not because there are two credentials:
# seed both from one generated value, and rotate both together.
#
# There is no op:// reference here on purpose. The cluster issues this key, so
# 1Password would hold a copy of something the cluster already owns.
apiVersion: v1
kind: Secret
metadata:
  name: orca-worker-proxy
  namespace: orca-workers
type: Opaque
stringData:
  api-key: "REPLACE-WITH-THE-SAME-VALUE-AS-cliproxyapi/worker-api-key"
