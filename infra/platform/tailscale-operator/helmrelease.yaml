# Tailscale Operator.
#
# It exists for ONE job here: put the long-lived CLIProxyAPI Service on the
# tailnet. Worker pods do not go through it -- they are created imperatively and
# run their own tailscale sidecar, because an Operator-managed Service per
# workspace would add a proxy pod to every create and slow it down (B6).
#
# The OAuth client is NOT in this repository. The chart templates its
# `operator-oauth` Secret only when oauth.clientId is set, and the operator
# Deployment mounts that Secret by NAME either way -- so leaving the values empty
# and seeding the Secret with kubectl is the supported shape, not a workaround.
# A missing Secret leaves the operator Pod unschedulable and this HelmRelease
# NotReady, which is the intended loud failure.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.3"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    operatorConfig:
      hostname: orca-k8s-operator
      logging: info
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    proxyConfig:
      # Every proxy the operator creates for this cluster carries this tag, so
      # the tailnet policy can name it. tag:orca-proxy is the tag the ACL grants
      # the desktop and denies tag:orca-workspace (B4).
      defaultTags: "tag:orca-proxy"
