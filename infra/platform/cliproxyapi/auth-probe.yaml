# Read-only credential health probe.
#
# The proxy holds the only copy of the agent OAuth credentials, and a refresh
# that starts failing is otherwise invisible until a worker gets a 401 in the
# middle of a task. This job asks the management API what state the auth files
# are in and fails the Job when the answer is not "all healthy".
#
# It only ever issues GET. Writing from here would add a second writer to the
# auth-dir and break the single-writer property the whole B4 shape rests on.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cliproxyapi-auth-probe
  namespace: cliproxyapi
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: probe
              image: docker.io/curlimages/curl:8.18.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Verified against v7.2.152: /v0/management/auth-files answers
                  # 200 to Authorization: Bearer <management key> (and to
                  # X-Management-Key), 401 to a query parameter or no header.
                  body=$(curl -fsS --max-time 20 \
                    -H "Authorization: Bearer ${MANAGEMENT_SECRET_KEY}" \
                    "http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v0/management/auth-files")
                  # The body names credential files, so it is not printed. An
                  # EMPTY list is a failure, not a pass: a proxy with no auth
                  # files is healthy in every way except the one that matters,
                  # and that is exactly the outage this probe exists to catch.
                  case "$body" in
                    *'"files":[]'*|*'"files": []'*)
                      echo "no authenticated agent credentials; see runbook 03" >&2
                      exit 1
                      ;;
                    *'"files"'*)
                      echo "auth-files reachable and non-empty"
                      ;;
                    *)
                      echo "unexpected auth-files response shape" >&2
                      exit 1
                      ;;
                  esac
              env:
                - name: MANAGEMENT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cliproxyapi
                      key: management-secret-key
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
