name: Test events
run-name: Test ${{ github.event_name }} ${{ github.ref }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  admission:
    name: Select validation owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.policy.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          env: false
      - name: Install only read-only admission tools
        run: mise install chezmoi python gh
      - name: Select branch or merge-result validation
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec chezmoi python gh -- python scripts/ci-event-policy.py

  test:
    name: Validate
    needs: admission
    if: needs.admission.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
