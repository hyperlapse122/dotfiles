name: Update harness plugin pins

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-harness-plugin-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      lock-artifact: ${{ steps.lock.outputs.artifact-id }}
      skill-drift: ${{ steps.refresh.outputs.skill-drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Record the publication base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh the complete pin set
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Exit 3 means plugin pins were written but a skill pack kept its reviewed pin.
          set +e
          mise exec -- python scripts/update-harness-plugin-lock.py
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "skill-drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Stage the immutable publication input
        run: |
          mkdir -p "$RUNNER_TEMP/locked-plugins"
          cp -- home/.chezmoidata/harness-plugin-lock.json "$RUNNER_TEMP/locked-plugins/harness-plugin-lock.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: lock
        with:
          name: harness-plugin-lock
          path: ${{ runner.temp }}/locked-plugins/harness-plugin-lock.json
          if-no-files-found: error

  validate:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      base-sha: ${{ needs.resolve.outputs.base-sha }}
      harness-lock-artifact: ${{ needs.resolve.outputs.lock-artifact }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base-sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.lock-artifact }}
          path: ${{ runner.temp }}/locked-plugins
      - name: Publish only changed generated pins
        shell: bash
        run: |
          set -euo pipefail
          lock=home/.chezmoidata/harness-plugin-lock.json
          cp -- "$RUNNER_TEMP/locked-plugins/harness-plugin-lock.json" "$lock"
          if git diff --quiet -- "$lock"; then
            echo "Harness plugin pins are unchanged; no commit needed."
            exit 0
          fi
          git add -- "$lock"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: refresh harness plugin pins' -- "$lock"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

  report-skill-drift:
    needs: [resolve, publish]
    if: ${{ always() && needs.resolve.outputs.skill-drift == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail until the shared skill change is reviewed
        run: |
          echo "::error::A shared skill pack kept its previous pin because upstream changed or could not be checked. The resolve job log names the difference; review it and update home/.chezmoidata/harness-skills.json."
          exit 1
