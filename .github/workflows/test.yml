name: Test

on:
  workflow_dispatch:
    inputs:
      base-sha:
        description: Immutable checkout SHA (empty uses the dispatch ref)
        type: string
        default: ""
      lock-artifact:
        description: Candidate personal-app lock artifact ID
        type: string
        default: ""
  workflow_call:
    inputs:
      base-sha:
        type: string
        default: ""
      lock-artifact:
        type: string
        default: ""
      harness-lock-artifact:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unit:
    name: Unit ${{ matrix.area }} (${{ matrix.runner }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm, windows-2025, xcode-27]
        area: [applications, security, platform, build-contracts]
    runs-on: ${{ matrix.runner }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-sha || github.sha }}
          persist-credentials: false
      - &candidate-lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.lock-artifact != ''
        with:
          artifact-ids: ${{ inputs.lock-artifact }}
          path: ${{ runner.temp }}/locked-apps
      - &select-lock
        name: Select the immutable candidate pins
        if: inputs.lock-artifact != ''
        shell: bash
        run: cp -- "$RUNNER_TEMP/locked-apps/personal-app-lock.json" home/.chezmoidata/personal-app-lock.json
      - &download-harness-lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.harness-lock-artifact != ''
        with:
          artifact-ids: ${{ inputs.harness-lock-artifact }}
          path: ${{ runner.temp }}/locked-plugins
      - &select-harness-lock
        name: Select the immutable candidate harness pins
        if: inputs.harness-lock-artifact != ''
        shell: bash
        run: cp -- "$RUNNER_TEMP/locked-plugins/harness-plugin-lock.json" home/.chezmoidata/harness-plugin-lock.json
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - &native-windows-gpg
        name: Provision native Windows GPG integration-test prerequisite
        if: runner.os == 'Windows' && (matrix.area == 'security' || matrix.area == 'github-auth' || matrix.area == 'gitlab-auth')
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Git's MSYS GPG interprets Windows GNUPGHOME as a relative POSIX path.
          $package = Join-Path $env:RUNNER_TEMP 'gnupg-fixture.zip'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'gnupg-package'
          $gpgRoot = Join-Path $env:RUNNER_TEMP 'native-gnupg'
          Invoke-WebRequest 'https://community.chocolatey.org/api/v2/package/gnupg/2.5.21' -OutFile $package
          $expected = 'ec0d87043a192be65d7bd9678609bfb29154f565183c135f7569ad9682e208c6230ed9cce706c706726f4436084528775d7ae993e4994033068021904c22fdd3'
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA512).Hash -ne $expected) {
            throw 'Native GnuPG fixture checksum mismatch.'
          }
          Expand-Archive -LiteralPath $package -DestinationPath $packageRoot
          $installer = Join-Path $packageRoot 'tools/gnupg-w32-2.5.21_20260702.exe'
          mise exec chezmoi python -- 7z x -y "-o$gpgRoot" $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gpgBin = Join-Path $gpgRoot 'bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gpgBin 'gpgconf.exe'))) {
            throw 'Native GnuPG payload was not found.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $gpgBin -Encoding utf8
          mise exec chezmoi python -- (Join-Path $gpgBin 'gpgconf.exe') --version
      - name: Provision macOS unit encryption prerequisite
        if: runner.os == 'macOS' && matrix.area == 'security'
        run: brew install gnupg
      - name: Validate complete ownership and run this area
        run: mise exec -- python scripts/run-test-area.py --area ${{ matrix.area }} --report "${{ runner.temp }}/unit-results.json"
      - name: Retain area timing and test-ID evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-${{ matrix.runner }}-${{ matrix.area }}
          path: ${{ runner.temp }}/unit-results.json
          retention-days: 7
          if-no-files-found: warn

  native:
    name: Native ${{ matrix.area }} (${{ matrix.platform.runner }}, ${{ matrix.platform.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        area: [apps, t3, ce, codex, claude, github-auth, gitlab-auth]
        platform:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-26.04
            target: linux-amd64
          - runner: ubuntu-26.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-amd64
          - runner: windows-11-arm
            target: windows-arm64
          - runner: xcode-27
            target: darwin-arm64
    runs-on: ${{ matrix.platform.runner }}
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - *checkout
      - *candidate-lock
      - *select-lock
      - *download-harness-lock
      - *select-harness-lock
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          env: false
      # Windows ARM has no full development lock or supported ast-grep payload.
      # Each area installs only its own existing tool declarations.
      - name: Install native smoke base tools
        run: mise install chezmoi python
      - name: Install desktop release acquisition tool
        if: matrix.area == 't3'
        run: mise install gh
      - name: Install native credential runtime
        if: matrix.area == 'github-auth' || matrix.area == 'gitlab-auth'
        run: mise install uv pipx:keyring
      - *native-windows-gpg
      - name: Provision disposable macOS encryption prerequisite
        if: runner.os == 'macOS' && (matrix.area == 'github-auth' || matrix.area == 'gitlab-auth')
        run: brew install gnupg
      - name: Provision disposable Linux credential service
        if: runner.os == 'Linux' && (matrix.area == 'github-auth' || matrix.area == 'gitlab-auth')
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring gnupg
      - name: Apply real pins and prove discovery in a fresh terminal
        if: matrix.area == 'apps'
        timeout-minutes: 10
        run: mise exec chezmoi python -- python tests/smoke_personal_apps.py --path-integration --expected-target ${{ matrix.platform.target }}
      - name: Prove desktop-bundled T3 and native Codex/Claude integration
        if: matrix.area == 't3'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec chezmoi python gh -- python tests/smoke_t3_code.py --install-desktop --expected-target ${{ matrix.platform.target }}
      - name: Prove Antigravity pins, native CE, and fresh T3 ACP initialization
        if: matrix.area == 't3'
        timeout-minutes: 15
        run: mise exec chezmoi python -- python tests/smoke_antigravity.py --expected-target ${{ matrix.platform.target }}
      - name: Apply pinned CE and prove native skill discovery
        if: matrix.area == 'ce'
        timeout-minutes: 10
        run: mise exec chezmoi python -- python tests/smoke_harness_plugins.py --expected-target ${{ matrix.platform.target }}
      - name: Apply pinned Codex and prove native instructions and CE
        if: matrix.area == 'codex'
        timeout-minutes: 10
        run: mise exec chezmoi python -- python tests/smoke_codex.py --expected-target ${{ matrix.platform.target }}
      - name: Apply pinned Claude and prove native preferences, instructions, and CE
        if: matrix.area == 'claude'
        timeout-minutes: 10
        run: mise exec chezmoi python -- python tests/smoke_claude.py --expected-target ${{ matrix.platform.target }}
      - name: Prove native GitHub and Gist credentials
        if: runner.os != 'Linux' && matrix.area == 'github-auth'
        timeout-minutes: 5
        run: mise exec chezmoi python uv pipx:keyring -- python tests/smoke_github_auth.py
      - name: Prove native GitLab credentials
        if: runner.os != 'Linux' && matrix.area == 'gitlab-auth'
        timeout-minutes: 5
        run: mise exec chezmoi python uv pipx:keyring -- python tests/smoke_gitlab_auth.py
      - name: Prove native credentials in this job's isolated Linux session
        if: runner.os == 'Linux' && (matrix.area == 'github-auth' || matrix.area == 'gitlab-auth')
        timeout-minutes: 5
        env:
          SMOKE_SCRIPT: ${{ matrix.area == 'github-auth' && 'tests/smoke_github_auth.py' || 'tests/smoke_gitlab_auth.py' }}
        run: |
          dbus-run-session -- sh -eu -c '
            printf "%s" fixture-keyring-password | gnome-keyring-daemon --unlock --components=secrets
            mise exec chezmoi python uv pipx:keyring -- python "$SMOKE_SCRIPT"
          '

  macos-build:
    name: Native macOS ARM64 builds
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - *checkout
      - *candidate-lock
      - *select-lock
      - *download-harness-lock
      - *select-harness-lock
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env: &macos-build-env
          MISE_DATA_DIR: ${{ runner.temp }}/mise-macos-build/data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-macos-build/cache
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - name: Provision native build tools in a disposable home
        shell: bash
        env: *macos-build-env
        run: |
          set -eu
          fixture_home="$RUNNER_TEMP/macos-build-home"
          mkdir -p "$fixture_home"
          env -u DOTNET_ROOT -u CARGO_HOME -u RUSTUP_HOME -u RUSTUP_TOOLCHAIN \
            HOME="$fixture_home" mise run macos-build
      - name: Compile, identify and run native programs
        shell: bash
        env: *macos-build-env
        run: |
          set -eu
          mise exec -- python tests/smoke_macos_build_environment.py \
            --home "$RUNNER_TEMP/macos-build-home" \
            --report "$RUNNER_TEMP/native-macos-build.json"
      - name: Retain native build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-build
          path: ${{ runner.temp }}/native-macos-build.json
          retention-days: 7
          if-no-files-found: warn
