name: Update personal application pins

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-personal-app-lock
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      lock-artifact: ${{ steps.lock.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Record the publication base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh the complete pin set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- python scripts/update-personal-app-lock.py
      - name: Refresh Synthetic model pins
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
        run: mise exec -- python scripts/update-synthetic-model-lock.py
      - name: Stage the immutable publication input
        run: |
          mkdir -p "$RUNNER_TEMP/locked-apps"
          cp -- home/.chezmoidata/personal-app-lock.json "$RUNNER_TEMP/locked-apps/personal-app-lock.json"
          cp -- home/.chezmoidata/synthetic-model-lock.json "$RUNNER_TEMP/locked-apps/synthetic-model-lock.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: lock
        with:
          name: personal-app-lock
          path: |
            ${{ runner.temp }}/locked-apps/personal-app-lock.json
            ${{ runner.temp }}/locked-apps/synthetic-model-lock.json
          if-no-files-found: error

  publish:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base-sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.lock-artifact }}
          path: ${{ runner.temp }}/locked-apps
      - name: Publish only changed generated pins
        shell: bash
        run: |
          set -euo pipefail
          apps=home/.chezmoidata/personal-app-lock.json
          models=home/.chezmoidata/synthetic-model-lock.json
          test -f "$RUNNER_TEMP/locked-apps/personal-app-lock.json"
          test -f "$RUNNER_TEMP/locked-apps/synthetic-model-lock.json"
          cp -- "$RUNNER_TEMP/locked-apps/personal-app-lock.json" "$apps"
          cp -- "$RUNNER_TEMP/locked-apps/synthetic-model-lock.json" "$models"
          if git diff --quiet -- "$apps" "$models"; then
            echo "Application and Synthetic model pins are unchanged; no commit needed."
            exit 0
          fi
          git add -- "$apps" "$models"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: refresh application and Synthetic model pins' -- "$apps" "$models"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
