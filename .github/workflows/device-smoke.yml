name: Device smoke

# Protected device evidence for the cross-platform support contract.
#
# Manual-only (workflow_dispatch). A dispatcher names ONE protected device leg
# (fedora-arm64 | windows-arm64 | macos-arm64) and the candidate commit to
# measure. The policy job reads the device allowlist, trusted collector
# digests, and attestation policy from `.ci/cutover-gates.json` ON THE DEFAULT
# BRANCH — never from the candidate — so a candidate can never expand or
# weaken the policy. The job FAILS CLOSED when the policy is absent or
# malformed, the requested leg is not allowlisted (or is revoked), a trusted
# collector digest pin is missing or does not match the default-branch file,
# or the signer-workflow pin is missing or does not match the default-branch
# blob SHA of this workflow. Until the operator pins those digests on the
# default branch, no device run can proceed. It also requires this workflow
# file to hash identically on the default branch, the dispatch ref, and the
# candidate commit, so the executed workflow is always the
# default-branch-pinned one.
#
# The measure job runs inside the protected `device-evidence` environment on
# exactly the runner labels the allowlist entry declares (self-hosted device
# labels for the Fedora/Windows arm64 legs), fetches the TRUSTED collector
# from the default branch, re-verifies its digest against the policy job's
# output, and uses it to measure the candidate checkout. The collector never
# applies the candidate to a live HOME/profile and never changes device state
# — its measurements are runtime architecture, candidate-commit binding,
# support-snapshot binding, and an isolated `chezmoi execute-template` render.
# The emitted evidence record is attested with GitHub artifact attestations
# (Sigstore); the verify job re-verifies the bundle against the pinned issuer,
# repository, and default-branch signer workflow, and binds the attested
# subject digest to the evidence file's local digest. Anything missing or
# mismatched fails the run closed.
#
# Required protected inputs (all default-branch/environment-controlled):
#   * environment `device-evidence` (protection rules gate every job)
#   * `.ci/cutover-gates.json` on the default branch: `.devices[]` allowlist,
#     `.trustedCollectors` digest pins, `.attestation` issuer/signer pins
#   * `.ci/support-matrix.json` in the candidate commit (canonical snapshot)
#   * default-branch `.ci/collect-device-evidence.{sh,ps1}` (trusted collectors)

on:
  workflow_dispatch:
    inputs:
      device:
        description: Protected device leg to measure
        required: true
        type: choice
        options:
          - fedora-arm64
          - windows-arm64
          - macos-arm64
      candidate_commit:
        description: Candidate commit SHA to measure (40-hex)
        required: true
        type: string
      g1b_proof_json:
        description: Protected operator proof JSON for every requested G1b visual claim
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: device-smoke-${{ inputs.device }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  PROTECTED_ENVIRONMENT: device-evidence

jobs:
  policy:
    name: Protected policy and trusted inputs
    runs-on: ubuntu-24.04
    environment: device-evidence
    outputs:
      deviceId: ${{ steps.policy.outputs.deviceId }}
      os: ${{ steps.policy.outputs.os }}
      arch: ${{ steps.policy.outputs.arch }}
      runnerClass: ${{ steps.policy.outputs.runnerClass }}
      runnerLabelsJson: ${{ steps.policy.outputs.runnerLabelsJson }}
      collectorPath: ${{ steps.policy.outputs.collectorPath }}
      collectorSha256: ${{ steps.policy.outputs.collectorSha256 }}
      workflowSha: ${{ steps.policy.outputs.workflowSha }}
      workflowRef: ${{ steps.policy.outputs.workflowRef }}
      snapshotPath: ${{ steps.policy.outputs.snapshotPath }}
      snapshotSha256: ${{ steps.policy.outputs.snapshotSha256 }}
      claimsJson: ${{ steps.policy.outputs.claimsJson }}
      visualClaimsJson: ${{ steps.policy.outputs.visualClaimsJson }}
    steps:
      - name: Check out the default branch (trusted policy source)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch

      - name: Check out the candidate commit (measured subject)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          path: candidate

      - name: Resolve protected policy and trusted digests
        id: policy
        env:
          DISPATCH_SHA: ${{ github.sha }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          REQUESTED_DEVICE: ${{ inputs.device }}
          OPERATOR_PROOF: ${{ inputs.g1b_proof_json }}
        run: |
          set -euo pipefail

          printf '%s' "${CANDIDATE_COMMIT}" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error::candidate_commit is not a 40-hex SHA: ${CANDIDATE_COMMIT}"
            exit 1
          }

          # The protected policy is the DEFAULT-BRANCH copy of the canonical
          # gates file. A candidate checkout is a measured subject only.
          gates="default-branch/.ci/cutover-gates.json"
          [ -f "${gates}" ] || {
            echo "::error::protected gates policy is absent on the default branch: ${gates}"
            exit 1
          }
          jq -e '.devices | type == "array" and length > 0' "${gates}" >/dev/null || {
            echo "::error::protected gates policy carries no device allowlist: ${gates}"
            exit 1
          }

          # The dispatch names a LEG (<os>-<arch>); the allowlist authorizes
          # physical devices. Resolve the leg to exactly one ACTIVE self-hosted
          # device for that os/arch — zero or several matches fail closed.
          leg_os=${REQUESTED_DEVICE%-*}
          leg_arch=${REQUESTED_DEVICE##*-}
          device=$(jq -c --arg os "${leg_os}" --arg arch "${leg_arch}" \
            '[.devices[] | select(.os == $os and .arch == $arch
               and .runnerClass == "self-hosted" and .status == "active")] |
             if length == 1 then .[0] else empty end' "${gates}")
          [ -n "${device}" ] || {
            echo "::error::leg '${REQUESTED_DEVICE}' does not resolve to exactly one active self-hosted device in the protected allowlist"
            exit 1
          }
          device_id=$(jq -r '.id' <<<"${device}")
          jq -e '
            (.os | type == "string") and
            (.arch | type == "string") and
            (.runnerClass == "github-hosted" or .runnerClass == "self-hosted") and
            (.runnerLabels | type == "array" and length > 0 and all(type == "string"))' \
            <<<"${device}" >/dev/null || {
            echo "::error::allowlist entry for '${REQUESTED_DEVICE}' is malformed"
            exit 1
          }
          runner_class=$(jq -r '.runnerClass' <<<"${device}")
          labels_json=$(jq -c '.runnerLabels' <<<"${device}")
          if [ "${runner_class}" = self-hosted ]; then
            jq -e 'index("self-hosted")' <<<"${labels_json}" >/dev/null || {
              echo "::error::allowlist entry declares runnerClass self-hosted but no self-hosted label"
              exit 1
            }
          fi

          # Attestation policy must pin the GitHub OIDC issuer and this
          # workflow's default-branch blob SHA. Both pins are empty until the
          # operator pins them on the default branch — fail closed until then.
          issuer=$(jq -r '.attestation.issuer // empty' "${gates}")
          [ "${issuer}" = "https://token.actions.githubusercontent.com" ] || {
            echo "::error::protected attestation policy issuer '${issuer}' != https://token.actions.githubusercontent.com"
            exit 1
          }
          workflow_rel=".github/workflows/device-smoke.yml"
          workflow_sha=$(git hash-object "default-branch/${workflow_rel}")
          pinned_workflow_sha=$(jq -r --arg path "${workflow_rel}" \
            '.attestation.signerWorkflows[$path].defaultBranchSha // empty' "${gates}")
          [ -n "${pinned_workflow_sha}" ] || {
            echo "::error::protected attestation policy pins no default-branch SHA for ${workflow_rel}"
            exit 1
          }
          [ "${workflow_sha}" = "${pinned_workflow_sha}" ] || {
            echo "::error::default-branch ${workflow_rel} blob ${workflow_sha} != policy pin ${pinned_workflow_sha}"
            exit 1
          }

          # The executed workflow must be the default-branch-pinned one: it
          # must hash identically on the dispatch ref and the candidate
          # commit. Fail closed on any drift so a candidate can never supply
          # its own device workflow.
          candidate_workflow_sha=$(git hash-object "candidate/${workflow_rel}")
          [ "${candidate_workflow_sha}" = "${workflow_sha}" ] || {
            echo "::error::candidate commit modified ${workflow_rel} (candidate blob ${candidate_workflow_sha} != default-branch blob ${workflow_sha})"
            exit 1
          }
          if [ "${DISPATCH_SHA}" != "${CANDIDATE_COMMIT}" ]; then
            git -C candidate fetch --depth 1 origin "${DISPATCH_SHA}"
            dispatch_workflow_sha=$(git -C candidate show "FETCH_HEAD:${workflow_rel}" | git hash-object --stdin)
            [ "${dispatch_workflow_sha}" = "${workflow_sha}" ] || {
              echo "::error::dispatch ref modified ${workflow_rel} (dispatch blob ${dispatch_workflow_sha} != default-branch blob ${workflow_sha})"
              exit 1
            }
          fi

          # Trusted collector: fixed per-OS path, digest pinned by the
          # protected policy. Missing pin or any drift fails closed.
          device_os=$(jq -r '.os' <<<"${device}")
          case "${device_os}" in
            windows) collector_rel=".ci/collect-device-evidence.ps1" ;;
            *)       collector_rel=".ci/collect-device-evidence.sh" ;;
          esac
          trusted_collector="default-branch/${collector_rel}"
          [ -f "${trusted_collector}" ] || {
            echo "::error::trusted collector is absent on the default branch: ${trusted_collector}"
            exit 1
          }
          collector_sha=$(sha256sum "${trusted_collector}" | awk '{print $1}')
          pinned_collector_sha=$(jq -r --arg path "${collector_rel}" \
            '.trustedCollectors[$path] // empty' "${gates}")
          [ -n "${pinned_collector_sha}" ] || {
            echo "::error::protected policy pins no trusted digest for ${collector_rel}"
            exit 1
          }
          [ "${collector_sha}" = "${pinned_collector_sha}" ] || {
            echo "::error::trusted collector ${collector_rel} digest ${collector_sha} != policy pin ${pinned_collector_sha}"
            exit 1
          }

          # The canonical support snapshot is part of the candidate under
          # measurement; fail closed when the candidate lacks it.
          snapshot_rel=".ci/support-matrix.json"
          [ -f "candidate/${snapshot_rel}" ] || {
            echo "::error::candidate commit lacks the canonical support snapshot: ${snapshot_rel}"
            exit 1
          }
          # Canonical-JSON digest — identical to the evaluator's snapshotDigest()
          # (verified byte-for-byte), so evidence and evaluation agree.
          snapshot_sha=$(jq -S -c . "candidate/${snapshot_rel}" | tr -d '\n' | sha256sum | awk '{print $1}')

          # Derive every requested claim from the protected default-branch
          # policy. Candidate policy never reaches the collector.
          claims=$(jq -c --argjson device "${device}" '
            [.gates | to_entries[] | .key as $gate | .value.mandatoryLegs[]
             | select(
                 (.subject.os == null or .subject.os == $device.os) and
                 (.subject.arch == null or .subject.arch == $device.arch) and
                 (.subject.runnerClass == null or .subject.runnerClass == $device.runnerClass))
             | .claims[] | {gate: $gate, name: .}]
            | unique_by(.name)' "${gates}")
          [ "$(jq 'length' <<<"${claims}")" -gt 0 ] || {
            echo "::error::protected policy requests no claims for device ${device_id}"
            exit 1
          }
          claim_names=$(jq -c '[.[].name] | sort' <<<"${claims}")
          visual_claims=$(jq -c '[.[] | select(.gate == "G1b") | .name] | sort' <<<"${claims}")

          # G1b is human-observed and MUST NOT be replaced by render smoke.
          # The protected-environment dispatcher supplies an operator proof
          # whose complete identity and outcome are folded into the evidence
          # record that this workflow later attests.
          if [ "$(jq 'length' <<<"${visual_claims}")" -gt 0 ]; then
            [ -n "${OPERATOR_PROOF}" ] || {
              echo "::error::protected G1b claims require g1b_proof_json"
              exit 1
            }
            jq -e \
              --arg device "${device_id}" \
              --arg commit "${CANDIDATE_COMMIT}" \
              --arg snapshot "${snapshot_sha}" \
              --argjson claims "${visual_claims}" '
              type == "object" and
              keys == ["candidate", "checks", "device", "schemaVersion", "supportSnapshot"] and
              .schemaVersion == 1 and
              (.device | type == "object" and keys == ["id"]) and
              .device.id == $device and
              (.candidate | type == "object" and keys == ["commit"]) and
              .candidate.commit == $commit and
              (.supportSnapshot | type == "object" and keys == ["path", "sha256"]) and
              .supportSnapshot.path == ".ci/support-matrix.json" and
              .supportSnapshot.sha256 == $snapshot and
              (.checks | type == "array" and length == ($claims | length)) and
              ([.checks[].name] | sort) == $claims and
              ([.checks[].name] | unique | length) == (.checks | length) and
              all(.checks[];
                type == "object" and keys == ["detail", "name", "status"] and
                (.status == "pass" or .status == "fail") and
                (.detail | type == "string" and length > 0 and length <= 500))
            ' <<<"${OPERATOR_PROOF}" >/dev/null || {
              echo "::error::g1b_proof_json is malformed or not exactly bound to the protected claims/device/commit/snapshot"
              exit 1
            }
          fi

          {
            echo "deviceId=${device_id}"
            echo "os=${device_os}"
            echo "arch=$(jq -r '.arch' <<<"${device}")"
            echo "runnerClass=${runner_class}"
            echo "runnerLabelsJson=${labels_json}"
            echo "collectorPath=${collector_rel}"
            echo "collectorSha256=${collector_sha}"
            echo "workflowSha=${workflow_sha}"
            echo "workflowRef=${GITHUB_REPOSITORY}/${workflow_rel}@refs/heads/${DEFAULT_BRANCH}"
            echo "snapshotPath=${snapshot_rel}"
            echo "snapshotSha256=${snapshot_sha}"
            echo "claimsJson=${claim_names}"
            echo "visualClaimsJson=${visual_claims}"
          } >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Measure — runs on exactly the runner labels the protected allowlist entry
  # declares. The trusted collector is fetched from the default branch, its
  # digest re-verified against the policy job, and only then used against the
  # candidate checkout. No step applies the candidate to a live HOME/profile
  # or changes device state.
  # ---------------------------------------------------------------------------
  measure:
    name: Measure candidate (${{ inputs.device }})
    needs: policy
    environment: device-evidence
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ fromJSON(needs.policy.outputs.runnerLabelsJson) }}
    steps:
      - name: Assert POSIX prerequisites
        if: needs.policy.outputs.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for tool in git jq curl; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::protected device is missing required tool: ${tool}"
              exit 1
            }
          done

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          path: candidate

      - name: Verify trusted collector digest
        if: needs.policy.outputs.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          collector="trusted/${{ needs.policy.outputs.collectorPath }}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "${collector}" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "${collector}" | awk '{print $1}')
          fi
          [ "${actual}" = "${{ needs.policy.outputs.collectorSha256 }}" ] || {
            echo "::error::trusted collector digest mismatch: ${actual} != ${{ needs.policy.outputs.collectorSha256 }}"
            exit 1
          }

      - name: Verify trusted collector digest
        if: needs.policy.outputs.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Get-FileHash -LiteralPath 'trusted/${{ needs.policy.outputs.collectorPath }}' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ needs.policy.outputs.collectorSha256 }}') {
            throw "trusted collector digest mismatch: $actual != ${{ needs.policy.outputs.collectorSha256 }}"
          }

      - name: Install locked chezmoi (POSIX)
        if: needs.policy.outputs.os != 'windows'
        shell: bash
        env:
          OS: ${{ needs.policy.outputs.os }}
          ARCH: ${{ needs.policy.outputs.arch }}
        run: |
          set -euo pipefail
          case "${OS}" in
            fedora) lock_os=linux ;;
            macos)  lock_os=darwin ;;
            *) echo "::error::unsupported POSIX device os: ${OS}"; exit 1 ;;
          esac
          case "${ARCH}" in
            x64)   lock_arch=amd64 ;;
            arm64) lock_arch=arm64 ;;
            *) echo "::error::unsupported device arch: ${ARCH}"; exit 1 ;;
          esac
          lock_key="${lock_os}-${lock_arch}"
          artifact_url=$(jq -r --arg k "${lock_key}" '.releases.tools.chezmoi.artifacts[$k].url // empty' candidate/.chezmoidata/releases.json)
          artifact_sha=$(jq -r --arg k "${lock_key}" '.releases.tools.chezmoi.artifacts[$k].sha256 // empty' candidate/.chezmoidata/releases.json)
          [ -n "${artifact_url}" ] && [ -n "${artifact_sha}" ] || {
            echo "::error::release lock carries no chezmoi artifact for ${lock_key}"
            exit 1
          }
          curl -fsSL "${artifact_url}" -o "${RUNNER_TEMP}/chezmoi.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${artifact_sha}" "${RUNNER_TEMP}/chezmoi.tar.gz" | sha256sum --check -
          else
            printf '%s  %s\n' "${artifact_sha}" "${RUNNER_TEMP}/chezmoi.tar.gz" | shasum -a 256 --check -
          fi
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/chezmoi.tar.gz" -C "${RUNNER_TEMP}/bin" chezmoi
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Install locked chezmoi (Windows)
        if: needs.policy.outputs.os == 'windows'
        shell: pwsh
        env:
          ARCH: ${{ needs.policy.outputs.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lockArch = switch ($env:ARCH) { 'x64' { 'amd64' } 'arm64' { 'arm64' } default { throw "unsupported device arch: $env:ARCH" } }
          $lock = Get-Content -LiteralPath 'candidate/.chezmoidata/releases.json' -Raw | ConvertFrom-Json
          $artifact = $lock.releases.tools.chezmoi.artifacts."windows-$lockArch"
          if (-not $artifact) { throw "release lock carries no chezmoi artifact for windows-$lockArch" }
          $archive = Join-Path $env:RUNNER_TEMP 'chezmoi.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          Invoke-WebRequest -Uri $artifact.url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $artifact.sha256) {
            throw "chezmoi SHA-256 mismatch: expected $($artifact.sha256), got $actual"
          }
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $bin -Force
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'chezmoi.exe'))) {
            throw 'locked chezmoi archive did not contain chezmoi.exe'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Collect device evidence (POSIX)
        if: needs.policy.outputs.os != 'windows'
        shell: bash
        env:
          CLAIMS_JSON: ${{ needs.policy.outputs.claimsJson }}
          LABELS_JSON: ${{ needs.policy.outputs.runnerLabelsJson }}
          PROOF_JSON: ${{ inputs.g1b_proof_json }}
          VISUAL_CLAIMS_JSON: ${{ needs.policy.outputs.visualClaimsJson }}
        run: |
          set -euo pipefail
          labels=$(jq -r 'join(",")' <<<"${LABELS_JSON}")
          args=(
            --device-id "${{ needs.policy.outputs.deviceId }}"
            --os "${{ needs.policy.outputs.os }}"
            --arch "${{ needs.policy.outputs.arch }}"
            --candidate-dir "${GITHUB_WORKSPACE}/candidate"
            --candidate-commit "${{ inputs.candidate_commit }}"
            --support-snapshot "${GITHUB_WORKSPACE}/candidate/${{ needs.policy.outputs.snapshotPath }}"
            --repository "${GITHUB_REPOSITORY}"
            --workflow-ref "${{ needs.policy.outputs.workflowRef }}"
            --workflow-sha "${{ needs.policy.outputs.workflowSha }}"
            --environment "${PROTECTED_ENVIRONMENT}"
            --runner-class "${{ needs.policy.outputs.runnerClass }}"
            --runner-labels "${labels}"
            --output "${GITHUB_WORKSPACE}/evidence/evidence.json"
          )
          while IFS= read -r claim; do
            args+=(--claim "${claim}")
          done < <(jq -r '.[]' <<<"${CLAIMS_JSON}")
          if [ "$(jq 'length' <<<"${VISUAL_CLAIMS_JSON}")" -gt 0 ]; then
            proof_file="${RUNNER_TEMP}/g1b-proof.json"
            printf '%s' "${PROOF_JSON}" > "${proof_file}"
            args+=(--proof-file "${proof_file}")
          fi
          bash "trusted/${{ needs.policy.outputs.collectorPath }}" "${args[@]}"

      - name: Collect device evidence (Windows)
        if: needs.policy.outputs.os == 'windows'
        shell: pwsh
        env:
          CLAIMS_JSON: ${{ needs.policy.outputs.claimsJson }}
          LABELS_JSON: ${{ needs.policy.outputs.runnerLabelsJson }}
          PROOF_JSON: ${{ inputs.g1b_proof_json }}
          VISUAL_CLAIMS_JSON: ${{ needs.policy.outputs.visualClaimsJson }}
        run: |
          $ErrorActionPreference = 'Stop'
          $labels = @($env:LABELS_JSON | ConvertFrom-Json)
          $collectorParams = @{
            DeviceId = '${{ needs.policy.outputs.deviceId }}'
            OS = 'windows'
            Arch = '${{ needs.policy.outputs.arch }}'
            CandidateDir = (Join-Path $env:GITHUB_WORKSPACE 'candidate')
            CandidateCommit = '${{ inputs.candidate_commit }}'
            SupportSnapshot = (Join-Path $env:GITHUB_WORKSPACE 'candidate/${{ needs.policy.outputs.snapshotPath }}')
            Repository = '${{ github.repository }}'
            WorkflowRef = '${{ needs.policy.outputs.workflowRef }}'
            WorkflowSha = '${{ needs.policy.outputs.workflowSha }}'
            Environment = '${{ env.PROTECTED_ENVIRONMENT }}'
            RunnerClass = '${{ needs.policy.outputs.runnerClass }}'
            RunnerLabels = $labels
            Output = (Join-Path $env:GITHUB_WORKSPACE 'evidence/evidence.json')
            Claim = @($env:CLAIMS_JSON | ConvertFrom-Json)
          }
          if (@($env:VISUAL_CLAIMS_JSON | ConvertFrom-Json).Count -gt 0) {
            $proofFile = Join-Path $env:RUNNER_TEMP 'g1b-proof.json'
            Set-Content -LiteralPath $proofFile -Value $env:PROOF_JSON -Encoding utf8 -NoNewline
            $collectorParams.ProofFile = $proofFile
          }
          & 'trusted/${{ needs.policy.outputs.collectorPath }}' @collectorParams
          if ($LASTEXITCODE -ne 0) { throw "device evidence collector exited with code $LASTEXITCODE" }

      - name: Assert evidence identities (POSIX)
        if: needs.policy.outputs.os != 'windows'
        shell: bash
        env:
          CLAIMS_JSON: ${{ needs.policy.outputs.claimsJson }}
          LABELS_JSON: ${{ needs.policy.outputs.runnerLabelsJson }}
        run: |
          set -euo pipefail
          jq -e \
            --arg device "${{ needs.policy.outputs.deviceId }}" \
            --arg commit "${{ inputs.candidate_commit }}" \
            --arg snapshot "${{ needs.policy.outputs.snapshotSha256 }}" \
            --arg collector "${{ needs.policy.outputs.collectorSha256 }}" \
            --argjson labels "${LABELS_JSON}" \
            --argjson claims "${CLAIMS_JSON}" \
            '.device.id == $device
             and .candidate.commit == $commit
             and .supportSnapshot.sha256 == $snapshot
             and .collector.sha256 == $collector
             and .device.runnerLabels == $labels
             and ([.measurements.checks[].name] | sort) == ($claims | sort)
             and ([.measurements.checks[].name] | unique | length) == (.measurements.checks | length)
             and (.measurements.checks | all(
               (.status == "pass" or .status == "fail") and
               (.detail | type == "string" and length > 0)))' \
            evidence/evidence.json >/dev/null

      - name: Assert evidence identities (Windows)
        if: needs.policy.outputs.os == 'windows'
        shell: pwsh
        env:
          LABELS_JSON: ${{ needs.policy.outputs.runnerLabelsJson }}
          CLAIMS_JSON: ${{ needs.policy.outputs.claimsJson }}
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Get-Content -LiteralPath 'evidence/evidence.json' -Raw | ConvertFrom-Json
          if ($record.device.id -ne '${{ needs.policy.outputs.deviceId }}') { throw 'evidence device id mismatch' }
          if ($record.candidate.commit -ne '${{ inputs.candidate_commit }}') { throw 'evidence candidate commit mismatch' }
          if ($record.supportSnapshot.sha256 -ne '${{ needs.policy.outputs.snapshotSha256 }}') { throw 'evidence snapshot digest mismatch' }
          if ($record.collector.sha256 -ne '${{ needs.policy.outputs.collectorSha256 }}') { throw 'evidence collector digest mismatch' }
          $expectedLabels = @($env:LABELS_JSON | ConvertFrom-Json)
          if (@(Compare-Object $record.device.runnerLabels $expectedLabels).Count -ne 0) { throw 'evidence runner labels differ from the allowlist entry' }
          $expectedClaims = @($env:CLAIMS_JSON | ConvertFrom-Json)
          $actualClaims = @($record.measurements.checks | ForEach-Object { $_.name })
          if (@(Compare-Object $actualClaims $expectedClaims).Count -ne 0) { throw 'evidence claims differ from protected policy' }
          if (@($actualClaims | Select-Object -Unique).Count -ne $actualClaims.Count) { throw 'evidence carries duplicate claims' }
          foreach ($check in $record.measurements.checks) {
            if ($check.status -notin @('pass', 'fail') -or [string]::IsNullOrWhiteSpace($check.detail)) {
              throw "evidence check $($check.name) is malformed"
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: device-evidence-${{ inputs.device }}
          path: evidence/evidence.json
          retention-days: 90
          if-no-files-found: error

      - name: Attest evidence
        uses: actions/attest@v3
        with:
          subject-path: evidence/evidence.json

  # ---------------------------------------------------------------------------
  # Verification binding: re-verify the Sigstore bundle against the pinned
  # issuer/repository/default-branch signer workflow and bind the attested
  # subject digest to the evidence file's local digest. Runs always so a
  # failed or skipped measure leg is one stable red result, never grey.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify attested evidence
    if: always()
    needs: [policy, measure]
    environment: device-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Require policy and measure to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "policy=${POLICY_RESULT}" "measure=${MEASURE_RESULT}"; do
            echo "${result}"
            [ "${result#*=}" = success ] || failed=1
          done
          exit "${failed}"

      - uses: actions/download-artifact@v8
        with:
          name: device-evidence-${{ inputs.device }}
          path: evidence

      - name: Verify the attestation bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_REF: ${{ needs.policy.outputs.workflowRef }}
        run: |
          set -euo pipefail
          local_digest=$(sha256sum evidence/evidence.json | awk '{print $1}')
          gh attestation verify evidence/evidence.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${WORKFLOW_REF}" \
            --format json > verification.json
          # Bind the attested subject digest to the evidence file's digest.
          attested_digest=$(jq -r '.[0].verificationResult.statement.subject[0].digest.sha256' verification.json)
          [ "${attested_digest}" = "${local_digest}" ] || {
            echo "::error::attested subject digest ${attested_digest} != local evidence digest ${local_digest}"
            exit 1
          }

      - name: Assert verification bindings
        env:
          EXPECTED_DEVICE: ${{ needs.policy.outputs.deviceId }}
          EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_SNAPSHOT: ${{ needs.policy.outputs.snapshotSha256 }}
          EXPECTED_WORKFLOW_SHA: ${{ needs.policy.outputs.workflowSha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -e \
            --arg device "${EXPECTED_DEVICE}" \
            --arg commit "${EXPECTED_COMMIT}" \
            --arg snapshot "${EXPECTED_SNAPSHOT}" \
            --arg workflowsha "${EXPECTED_WORKFLOW_SHA}" \
            --arg repo "${EXPECTED_REPOSITORY}" \
            --arg envname "${PROTECTED_ENVIRONMENT}" \
            '.device.id == $device
             and .candidate.commit == $commit
             and .supportSnapshot.sha256 == $snapshot
             and .attestation.issuer == "https://token.actions.githubusercontent.com"
             and .attestation.repository == $repo
             and .attestation.workflowSha == $workflowsha
             and .attestation.environment == $envname' \
            evidence/evidence.json >/dev/null
          echo "- attested device evidence verified for ${EXPECTED_DEVICE} @ ${EXPECTED_COMMIT}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-verification-${{ inputs.device }}
          path: verification.json
          retention-days: 90
          if-no-files-found: ignore
