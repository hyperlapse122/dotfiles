name: Update dependencies and model catalogs
"on":
  schedule:
    - cron: 7,37 * * * *
  workflow_dispatch:
    inputs:
      part:
        description: Maintenance part to run
        required: true
        type: choice
        default: all
        options:
          - all
          - dependencies
          - catalogs
          - drift
concurrency:
  group: update-dependencies
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update-dependencies:
    if: "!cancelled() && (github.event_name == 'schedule' || inputs.part != 'drift')"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Make room for NixOS closures
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Enable KVM for the Nix builder
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Initialize maintenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/updates"
          if [ -z "${GH_TOKEN_FOR_UPDATES:-}" ]; then
            echo '::error::Set the GH_TOKEN_FOR_UPDATES repository secret before running maintenance; it must publish commits and open reconciliation PRs.'
            exit 1
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        id: initialize
        env:
          GH_TOKEN_FOR_UPDATES: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Prepare catalogs candidate
        shell: bash
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git worktree add --detach "$RUNNER_TEMP/updates/catalogs" origin/main
        id: prepare_catalogs
        if: "!cancelled() && (github.event_name == 'schedule' || inputs.part == 'all' || inputs.part == '' || inputs.part == 'catalogs') && steps.initialize.outcome == 'success'"
        continue-on-error: true
      - name: Refresh the Synthetic catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot=home/h82/agents/synthetic-catalog.json
          if [ -z "${SYNTHETIC_API_KEY:-}" ]; then
            echo '::warning::SYNTHETIC_API_KEY is not set; keeping the current catalog snapshot.'
            exit 1
          fi
          if ! nix run .#synthetic-models-watch -- --snapshot "$snapshot"; then
            git restore -- "$snapshot"
            echo '::warning::Catalog refresh failed; keeping the committed snapshot.'
            exit 1
          fi
          if [ -n "$(git status --porcelain -- "$snapshot")" ]; then
            git add -- "$snapshot"
            git commit -m 'chore(agents): refresh the synthetic catalog snapshot' -- "$snapshot"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
        id: catalog
        if: "!cancelled() && steps.prepare_catalogs.outcome == 'success'"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/updates/catalogs
        timeout-minutes: 20
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
      - name: Publish verified catalogs
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci-update-publish" catalogs "$RUNNER_TEMP/updates/catalogs-logs"
        id: publish_catalogs
        if: "!cancelled() && steps.catalog.outcome == 'success' && steps.catalog.outputs.changed == 'true'"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/updates/catalogs
        timeout-minutes: 40
        env:
          GH_TOKEN_FOR_UPDATES: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Prepare dependencies candidate
        shell: bash
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git worktree add --detach "$RUNNER_TEMP/updates/dependencies" origin/main
        id: prepare_dependencies
        if: "!cancelled() && (github.event_name == 'schedule' || inputs.part == 'all' || inputs.part == '' || inputs.part == 'dependencies') && steps.initialize.outcome == 'success'"
        continue-on-error: true
      - name: Update flake inputs, agent plugins, and packages
        id: update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 1. Update flake inputs
          nix flake update

          # 2. Update agent plugins
          PLUGIN_SOURCE="EveryInc/compound-engineering-plugin"
          TAG_PREFIX="compound-engineering-"
          resolved=$(nix run .#agent-plugin-release -- --source "$PLUGIN_SOURCE" --tag-prefix "$TAG_PREFIX")
          current=$(sed -n 's#.*url = "github:EveryInc/compound-engineering-plugin/\(.*\)";#\1#p' flake.nix)
          if [ -n "$resolved" ] && [ "$resolved" != "$current" ]; then
            case "$resolved" in
              "$TAG_PREFIX"v[0-9]*) ;;
              *) echo "refusing an unexpected resolved tag: $resolved" >&2; exit 1 ;;
            esac
            sed -i "s#compound-engineering-plugin/$current#compound-engineering-plugin/$resolved#" flake.nix
            sed -i "s#tag = \"$current\";#tag = \"$resolved\";#" home/h82/agents/agent-plugin-pins.nix
            nix flake lock --update-input compound-engineering-plugin
            rev=$(jq -r '.nodes["compound-engineering-plugin"].locked.rev' flake.lock)
            case "$rev" in
              [0-9a-f][0-9a-f]*) ;;
              *) echo "flake.lock recorded no usable revision" >&2; exit 1 ;;
            esac
            sed -i "s#expectedRev = \"[0-9a-f]*\";#expectedRev = \"$rev\";#" home/h82/agents/agent-plugin-pins.nix
          fi

          # Refresh the imported application and font asset pins.
          for pin in bun-pin overlay-fonts; do
            nix run .#overlay-release -- --output "packages/$pin.json"
          done

          # 3. Update Claude Desktop
          nix run .#claude-desktop-release -- --output packages/claude-desktop-version.json

          # 4. Update Claude Code
          nix run .#claude-code-release -- --output packages/claude-code-manifest.json

          # 5. Update the Android SDK pin
          nix run .#android-sdk-release -- --output packages/android-sdk-repo.json

          # 6. Update mise
          nix run .#mise-release -- --output packages/mise-release.json

          # 7. Update ChatGPT. A feed failure or changed release identity keeps
          # the current pin and lets the other updates through.
          if ! nix run .#chatgpt-release -- --output packages/chatgpt-version.json; then
            echo "::warning title=ChatGPT update skipped::chatgpt-release failed; keeping the current pin in packages/chatgpt-version.json."
            git checkout -- packages/chatgpt-version.json
          fi

          # 8. Update T3 Code. A release can be published before its assets
          # and digests are, so a failure here keeps the current pin and lets
          # the other updates through. Status 2 means the release's embedded
          # Antigravity table could not be read or trusted. Status 1 can also
          # mean the repository's runtime rebuild does not fit that release's
          # runtime. In both cases the whole file stays, so the T3 Code and
          # runtime pins never split, and the warning carries the updater's
          # own message.
          t3code_status=0
          t3code_log=$(mktemp)
          nix run .#t3code-release -- --output packages/t3code-release.json 2>"$t3code_log" || t3code_status=$?
          cat "$t3code_log" >&2
          t3code_message=$(tail -n 1 "$t3code_log")
          rm -f "$t3code_log"
          if [ "$t3code_status" -eq 2 ]; then
            echo "::warning title=T3 Code Antigravity table unreadable::t3code-release could not read or trust the Antigravity table embedded in the T3 Code CLI; keeping the current pin in packages/t3code-release.json. $t3code_message"
            git checkout -- packages/t3code-release.json
          elif [ "$t3code_status" -ne 0 ]; then
            echo "::warning title=T3 Code update skipped::t3code-release failed; keeping the current pin in packages/t3code-release.json. $t3code_message"
            git checkout -- packages/t3code-release.json
          fi

          # 9. Update the Antigravity CLI. A feed failure keeps the current
          # pin and lets the other updates through, as T3 Code's does.
          if ! nix run .#antigravity-cli-release -- --output packages/antigravity-cli-release.json; then
            echo "::warning title=Antigravity CLI update skipped::antigravity-cli-release failed; keeping the current pin in packages/antigravity-cli-release.json."
            git checkout -- packages/antigravity-cli-release.json
          fi


          # 11. Update Pi. A release can be published before every platform
          # tarball or its SHA256SUMS line, so a failure keeps the current pin
          # and lets the other updates through, as T3 Code's does.
          if ! nix run .#pi-release -- --output packages/pi-release.json; then
            echo "::warning title=Pi update skipped::pi-release failed; keeping the current pin in packages/pi-release.json."
            git checkout -- packages/pi-release.json
          fi

          # 12. Update the npm packages: the shared ACP client and the Claude
          # Agent SDK that agent-usage reads Claude limits through. Each pin
          # moves with its regenerated lock file, so a failure restores both
          # and lets the other updates through, as Pi's does.
          for npm_package in acpx claude-agent-sdk; do
            case "$npm_package" in
              claude-agent-sdk) registry_name=@anthropic-ai/claude-agent-sdk ;;
              *) registry_name=$npm_package ;;
            esac
            if ! nix run .#npm-release -- --package "$registry_name" \
              --output "packages/$npm_package-release.json" \
              --lock "packages/$npm_package/package-lock.json"; then
              echo "::warning title=$npm_package update skipped::npm-release failed; keeping the current pin in packages/$npm_package-release.json."
              git checkout -- "packages/$npm_package-release.json" "packages/$npm_package/package-lock.json"
            fi
          done

          # 13. Update Codex. A release can be published before every platform
          # tarball or its digest, so a failure keeps the current pin and lets
          # the other updates through, as Pi's does.
          if ! nix run .#codex-release -- --output packages/codex-release.json; then
            echo "::warning title=Codex update skipped::codex-release failed; keeping the current pin in packages/codex-release.json."
            git checkout -- packages/codex-release.json
          fi

          # 14. Update Grok Build. The stable pointer can move before every
          # platform's binary is published, so a failure keeps the current pin
          # and lets the other updates through, as Codex's does.
          if ! nix run .#grok-build-release -- --output packages/grok-build-release.json; then
            echo "::warning title=Grok Build update skipped::grok-build-release failed; keeping the current pin in packages/grok-build-release.json."
            git checkout -- packages/grok-build-release.json
          fi

          # 15. Refresh Prezto and every recursively pinned submodule.
          nix run .#prezto-release -- --output packages/prezto-pin.json

          if [ -z "$(git status --porcelain)" ]; then
            echo "No updates detected across all targets."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
        if: "!cancelled() && steps.prepare_dependencies.outcome == 'success'"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/updates/dependencies
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit dependency candidates
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain packages/claude-desktop-version.json)" ]; then
            NEW_VER=$(jq -r .version packages/claude-desktop-version.json)
            git add packages/claude-desktop-version.json
            git commit -m "chore(packages): bump claude-desktop to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/claude-code-manifest.json)" ]; then
            NEW_VER=$(jq -r .version packages/claude-code-manifest.json)
            git add packages/claude-code-manifest.json
            git commit -m "chore(packages): bump claude-code to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/codex-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/codex-release.json)
            git add packages/codex-release.json
            git commit -m "chore(packages): bump codex to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/grok-build-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/grok-build-release.json)
            git add packages/grok-build-release.json
            git commit -m "chore(packages): bump grok-build to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/pi-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/pi-release.json)
            git add packages/pi-release.json
            git commit -m "chore(packages): bump pi to $NEW_VER"
          fi

          for npm_package in acpx claude-agent-sdk; do
            if [ -n "$(git status --porcelain "packages/$npm_package-release.json" "packages/$npm_package/package-lock.json")" ]; then
              NEW_VER=$(jq -r .version "packages/$npm_package-release.json")
              git add "packages/$npm_package-release.json" "packages/$npm_package/package-lock.json"
              git commit -m "chore(packages): bump $npm_package to $NEW_VER"
            fi
          done
          if [ -n "$(git status --porcelain packages/t3code-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/t3code-release.json)
            git add packages/t3code-release.json
            git commit -m "chore(packages): bump t3code to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/antigravity-cli-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/antigravity-cli-release.json)
            git add packages/antigravity-cli-release.json
            git commit -m "chore(packages): bump antigravity-cli to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/chatgpt-version.json)" ]; then
            NEW_VER=$(jq -r .version packages/chatgpt-version.json)
            git add packages/chatgpt-version.json
            git commit -m "chore(packages): bump chatgpt to $NEW_VER"
          fi


          if [ -n "$(git status --porcelain packages/mise-release.json)" ]; then
            NEW_VER=$(jq -r .version packages/mise-release.json)
            git add packages/mise-release.json
            git commit -m "chore(packages): bump mise to $NEW_VER"
          fi

          if [ -n "$(git status --porcelain packages/prezto-pin.json)" ]; then
            NEW_REV=$(jq -r '.zshLock.archives[0].commit' packages/prezto-pin.json)
            git add packages/prezto-pin.json
            git commit -m "chore(packages): refresh prezto to ${NEW_REV:0:12}"
          fi

          if [ -n "$(git status --porcelain packages/android-sdk-repo.json)" ]; then
            PINNED=$(jq -r '.latest | to_entries | map("\(.key) \(.value)") | join(", ")' packages/android-sdk-repo.json)
            git add packages/android-sdk-repo.json
            git commit -m "chore(packages): bump android sdk pin" -m "Pinned: $PINNED"
          fi

          if [ -n "$(git status --porcelain home/h82/agents/agent-plugin-pins.nix)" ]; then
            NEW_TAG=$(sed -n 's/.*tag = "\(.*\)";/\1/p' home/h82/agents/agent-plugin-pins.nix)
            git add flake.nix flake.lock home/h82/agents/agent-plugin-pins.nix
            git commit -m "chore(agents): bump compound-engineering to $NEW_TAG"
          fi

          for pin in bun-pin overlay-fonts; do
            if [ -n "$(git status --porcelain "packages/$pin.json")" ]; then
              git add "packages/$pin.json"
              git commit -m "chore(packages): refresh $pin"
            fi
          done

          if [ -n "$(git status --porcelain flake.lock)" ]; then
            git add flake.lock
            git commit -m "chore(flake): update flake.lock"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(deps): update dependencies"
          fi
        id: commit
        if: "!cancelled() && steps.update.outcome == 'success' && steps.update.outputs.changed == 'true'"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/updates/dependencies
      - name: Publish verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci-update-publish" dependencies "$RUNNER_TEMP/updates/dependencies-logs"
        id: publish_dependencies
        if: "!cancelled() && steps.commit.outcome == 'success'"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/updates/dependencies
        timeout-minutes: 120
        env:
          GH_TOKEN_FOR_UPDATES: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Open reconciliation PR on failure
        shell: bash
        run: |
          set -euo pipefail
          FAILURE_STAGE=${FAILURE_STAGE:-interrupted}
          LOG_DIR=${LOG_DIR:-$RUNNER_TEMP/updates/dependencies-logs}
          if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            git rebase --abort
          fi
          open_pr=$(gh pr list --state open --limit 1000 --json number,headRefName \
            --jq 'map(select(.headRefName == "update-dependencies-fix" or (.headRefName | startswith("update-dependencies-fix-")))) | sort_by(.number) | .[0].number // empty')
          body="$RUNNER_TEMP/updates/reconciliation.md"
          python3 - "$body" "$LOG_DIR" "$open_pr" "$FAILURE_STAGE" <<'PYBODY'
          from collections import deque
          import os
          from pathlib import Path
          import sys

          path, directory, open_pr, stage = sys.argv[1:]
          directory = Path(directory)
          logs = list(directory.glob('*.log'))
          failed = directory / 'failed'
          if failed.exists():
              selected = [directory / f'{name}.log' for name in failed.read_text().splitlines()]
              note = 'Failed verification logs follow.'
          else:
              newest = max(logs, key=lambda log: log.stat().st_mtime_ns, default=None)
              selected = ([newest] if newest else []) + [
                  log for log in logs
                  if log != newest and (log.name in ('fmt.log', 'check.log') or log.name.endswith('-targets.log'))
              ]
              note = f'{len(logs)} verification logs recorded. The most recent log follows first; its target may have been interrupted.'
          sections = []
          for log in selected:
              if not log.is_file():
                  continue
              with log.open(errors='replace') as stream:
                  text = ''.join(deque(stream, maxlen=80))[-8000:]
              sections.append(f'### {log.name}\n\n' + ''.join('    ' + line + '\n' for line in text.splitlines()) + '\n')
          excerpt = ''.join(sections)
          if len(excerpt) > 56000:
              excerpt = excerpt[:56000] + '\n\nAdditional log output omitted.\n'
          run = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = (
              '## Automated Dependency Update (Reconciliation Required)\n\n'
              'The dependency update runs every 30 minutes. Its publication failed; no failing dependency candidate was pushed to main.\n\n'
              f'Failure stage: {stage}\n\n'
              'Push a fix to this branch; CI runs on each push. This PR waits for you to review and merge it.\n\n'
          )
          if open_pr:
              body += 'These logs are from the latest failing run, which left this branch as it was.\n\n'
          Path(path).write_text(body + note + '\n\n' + excerpt + f'\nFull logs: [workflow run]({run}).\n')
          PYBODY
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file "$body"
          else
            BRANCH="update-dependencies-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git -c core.hooksPath=/dev/null checkout -b "$BRANCH"
            authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
              GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null \
              git push origin "HEAD:refs/heads/$BRANCH"
            gh pr create --head "$BRANCH" --title 'chore(deps): automated dependency update (reconciliation required)' --body-file "$body"
          fi
        id: reconcile
        if: "!cancelled() && steps.publish_dependencies.outcome == 'failure'"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/updates/dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          FAILURE_STAGE: ${{ steps.publish_dependencies.outputs.failure_stage }}
          LOG_DIR: ${{ steps.publish_dependencies.outputs.log_dir }}
      - name: Remove candidate worktrees
        shell: bash
        run: |
          set -euo pipefail
          for part in catalogs dependencies; do
            if [ -d "$RUNNER_TEMP/updates/$part" ]; then
              git worktree remove --force "$RUNNER_TEMP/updates/$part"
            fi
          done
        id: cleanup
        if: always()
      - name: Report maintenance outcomes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Maintenance results'
            printf 'Catalog refresh: %s; changed: %s; publication: %s\n' "$CATALOG" "$CATALOG_CHANGED" "$CATALOG_PUSH"
            printf 'Dependencies: %s; changed: %s; publication: %s; reconciliation: %s\n' "$DEPENDENCIES" "$DEPENDENCIES_CHANGED" "$DEPENDENCIES_PUSH" "$RECONCILE"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$PREPARE_CATALOGS" "$PREPARE_DEPENDENCIES" "$CATALOG" "$CATALOG_PUSH" "$DEPENDENCIES" "$COMMIT" "$DEPENDENCIES_PUSH" "$RECONCILE" "$CLEANUP"; do
            if [ "$outcome" = failure ] || [ "$outcome" = cancelled ]; then
              exit 1
            fi
          done
        if: always()
        env:
          PREPARE_CATALOGS: ${{ steps.prepare_catalogs.outcome }}
          PREPARE_DEPENDENCIES: ${{ steps.prepare_dependencies.outcome }}
          CATALOG: ${{ steps.catalog.outcome }}
          CATALOG_CHANGED: ${{ steps.catalog.outputs.changed }}
          CATALOG_PUSH: ${{ steps.publish_catalogs.outcome }}
          DEPENDENCIES: ${{ steps.update.outcome }}
          DEPENDENCIES_CHANGED: ${{ steps.update.outputs.changed }}
          COMMIT: ${{ steps.commit.outcome }}
          DEPENDENCIES_PUSH: ${{ steps.publish_dependencies.outcome }}
          RECONCILE: ${{ steps.reconcile.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: main
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Compare with Synthetic's catalog
        id: compare
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
        run: |
          set -euo pipefail
          nix run .#synthetic-models-watch -- \
            --result "$RUNNER_TEMP/watch.json" \
            --issue-body "$RUNNER_TEMP/issue.md"
        shell: bash
      - name: Open, update, or close the reconcile issue
        if: ${{ !cancelled() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: model-reconcile
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          watch() { nix run .#synthetic-models-watch -- "$@"; }
          result="$RUNNER_TEMP/watch.json"
          body="$RUNNER_TEMP/issue.md"

          # The oldest open issue is the reconcile issue; any other is closed.
          gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
            --json number --limit 100 > "$RUNNER_TEMP/open.json"
          number=$(jq -r 'map(.number) | sort | .[0] // ""' "$RUNNER_TEMP/open.json")
          duplicates=$(jq -r 'map(.number) | sort | .[1:] | .[]' "$RUNNER_TEMP/open.json")
          for duplicate in $duplicates; do
            printf 'Closing as a duplicate of #%s, the reconcile issue this workflow keeps.\n' "$number" \
              > "$RUNNER_TEMP/duplicate.md"
            gh issue comment "$duplicate" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/duplicate.md"
            gh issue close "$duplicate" --repo "$GITHUB_REPOSITORY"
          done

          if [ -n "$number" ]; then
            gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body,comments > "$RUNNER_TEMP/open-issue.json"
            watch --issue-state "$RUNNER_TEMP/open-issue.json" > "$RUNNER_TEMP/state.json"
          else
            printf '{}\n' > "$RUNNER_TEMP/state.json"
          fi
          previous=$(jq -r '.fingerprint // ""' "$RUNNER_TEMP/state.json")
          previous_digest=$(jq -r '.bodyDigest // ""' "$RUNNER_TEMP/state.json")
          notice=$(jq -r '.notice // ""' "$RUNNER_TEMP/state.json")

          if [ "$COMPARE_OUTCOME" != success ]; then
            # One comment per failure streak; with no open issue, the failed
            # run is the signal.
            if [ -n "$number" ] && [ "$notice" != unreachable ]; then
              watch --notice unreachable > "$RUNNER_TEMP/notice.md"
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"
            fi
            echo "the comparison with Synthetic's catalog failed" >&2
            exit 1
          fi

          status=$(jq -r '.status' "$result")
          fingerprint=$(jq -r '.fingerprint // ""' "$result")
          digest=$(jq -r '.bodyDigest // ""' "$result")

          case "$status" in
            drift)
              title=$(jq -r '.title' "$result")
              if [ -z "$number" ]; then
                gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force \
                  --color B60205 --description 'Synthetic model drift for home/h82/agents/synthetic-models.nix'
                gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
                  --title "$title" --body-file "$body"
              else
                if [ "$previous" != "$fingerprint" ]; then
                  gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
                  {
                    printf 'The drift changed; the issue body now reads:\n\n'
                    head -n 1 "$body"
                  } > "$RUNNER_TEMP/changed.md"
                  gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/changed.md"
                elif [ "$previous_digest" != "$digest" ]; then
                  # Same drift, new details: refresh the body without a comment.
                  gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
                else
                  echo "Issue #$number already reports this drift."
                fi
                if [ "$notice" = unreachable ]; then
                  watch --notice reachable > "$RUNNER_TEMP/notice.md"
                  gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"
                fi
              fi
              ;;
            clean)
              if [ -n "$number" ]; then
                printf 'No Synthetic model drift remains as of commit %s.\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/resolved.md"
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/resolved.md"
                gh issue close "$number" --repo "$GITHUB_REPOSITORY"
              fi
              ;;
            *)
              echo "unexpected watch status: $status" >&2
              exit 1
              ;;
          esac
        shell: bash
    permissions:
      contents: read
      issues: write
    if: "!cancelled() && (github.event_name == 'schedule' || inputs.part == 'all' || inputs.part == '' || inputs.part == 'drift')"
