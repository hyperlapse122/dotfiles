name: Nix
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  push:
    branches: [main]
# A push cancels the previous run on the ref. A label event gets a group of
# its own, so it never cancels the run already on the head (which would leave
# a cancelled run there) and no later event cancels it: adding full-ci starts
# a run with only the closure jobs beside the existing run, and any other
# label starts a run with no jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && format('-labeled-{0}', github.run_id) || '' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fmt:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Check formatting
        run: nix fmt -- --ci

  agent-check:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Select committed range
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          parent_or_empty_tree() {
            git rev-parse --verify "$1^" 2>/dev/null ||
              git hash-object -w -t tree --stdin </dev/null
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base=$(git merge-base "$PR_BASE" "$PR_HEAD")
              head=$PR_HEAD
              ;;
            push)
              base=$PUSH_BEFORE
              head=$HEAD_SHA
              if [[ $base == 0000000000000000000000000000000000000000 ]]; then
                base=$(parent_or_empty_tree "$head")
              elif ! git cat-file -e "$base^{commit}"; then
                git fetch --no-tags origin "$base"
              fi
              ;;
            workflow_dispatch)
              head=$HEAD_SHA
              base=$(parent_or_empty_tree "$head")
              ;;
          esac
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"
      - name: Check registry dependencies
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          REGISTRY_POLICY: ${{ vars.AGENT_CHECK_REGISTRY_POLICY }}
        run: |
          policy=$(mktemp "$RUNNER_TEMP/agent-check-registries.XXXXXX")
          trap 'rm -f -- "$policy"' EXIT
          if [[ -z "$REGISTRY_POLICY" ]]; then REGISTRY_POLICY='{}'; fi
          printf '%s\n' "$REGISTRY_POLICY" > "$policy"
          nix shell .#agent-check -c agent-check --registry-policy "$policy" --range "$BASE" "$HEAD_SHA"
      - name: Run project checks
        if: "!cancelled() && steps.range.outcome == 'success'"
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: nix shell .#agent-check -c agent-check --range "$BASE" "$HEAD_SHA"

  markdown-lint:
    needs: changes
    # Other events run markdown-lint in a light shard.
    if: "!cancelled() && github.event_name == 'pull_request' && github.event.action != 'labeled' && needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Lint markdown
        run: nix build --no-link .#checks.x86_64-linux.markdown-lint

  changes:
    # Of the label events, only full-ci needs the docs-only classifier; any
    # other label leaves the run with no jobs.
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          # base.sha is the base branch tip as of the last PR sync event, not
          # necessarily its current tip -- a two-dot diff against it would
          # include every unrelated commit main has gained since, so diff
          # from the merge-base instead.
          merge_base=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          docs_only=$(git diff --name-only "$merge_base" "${{ github.event.pull_request.head.sha }}" | ./scripts/ci-docs-only-paths)
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  flake-check:
    needs: changes
    # A skipped or failed classifier must not silently skip real Nix
    # validation, so this condition (not the implicit needs-succeeded
    # default) decides whether the job runs: any event other than
    # pull_request, or a classifier that did not complete successfully,
    # always runs; only a definitive docs_only:true skips.
    if: &run-light-checks >-
      !cancelled()
      && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      # The checks are built in check-shards and the VM tests in vm-checks;
      # this job evaluates every output once, so an evaluation error reports
      # here without waiting on builds, and it needs no disk cleanup or KVM.
      - name: Evaluate
        run: nix flake check --no-build

  check-shard-names:
    needs: changes
    if: *run-light-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: List check shards
        id: list
        run: |
          names=$(nix eval --json .#checkShards --apply 's: builtins.filter (n: builtins.match "light-.*" n != null) (builtins.attrNames s)')
          # An empty matrix would skip check-shards and leave the run green
          # with no check evidence.
          if [ "$names" = "[]" ]; then
            echo "no shards found under checkShards" >&2
            exit 1
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"

  check-shards:
    needs: [changes, check-shard-names]
    if: *run-light-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.check-shard-names.outputs.names) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Make room for NixOS closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = big-parallel benchmark
      - name: Build check shard
        # The name comes from the checkShards attribute names, so it reaches
        # the shell as data rather than being spliced into the script.
        # --keep-going reports every failing check in the shard, not only
        # the first.
        env:
          NAME: ${{ matrix.name }}
        run: nix build --no-link --keep-going --print-build-logs ".#checkShards.${NAME}"

  host-checks:
    needs: changes
    if: &run-closure-checks >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && ((github.event.action == 'labeled' && github.event.label.name == 'full-ci')
      || ((github.event.action == 'synchronize' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'full-ci')))))
      && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - &free-host-build-space
        name: Make room for NixOS closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /usr/lib/jvm /usr/share/swift /opt/hostedtoolcache
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Build CUDA Ollama before the host checks
        run: ./scripts/ci-prebuild-ollama
      - name: Build host check shard
        run: nix build --no-link --keep-going --print-build-logs .#checkShards.hosts

  vm-check-names:
    needs: changes
    if: *run-closure-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: List VM checks
        id: list
        run: |
          names=$(nix eval --json .#vmChecks --apply 'v: builtins.filter (n: n != "all") (builtins.attrNames v)')
          # An empty matrix would skip vm-checks and leave the run green with
          # no VM evidence.
          if [ "$names" = "[]" ]; then
            echo "no VM checks found under vmChecks" >&2
            exit 1
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"

  vm-checks:
    needs: [changes, vm-check-names]
    if: *run-closure-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.vm-check-names.outputs.names) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Make room for NixOS closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Enable KVM for the Nix builder
        run: sudo chmod 666 /dev/kvm
      - name: Build VM check
        # The name comes from the vmChecks attribute names, so it reaches the
        # shell as data rather than being spliced into the script.
        env:
          NAME: ${{ matrix.name }}
        run: nix build --no-link --print-build-logs ".#vmChecks.${NAME}"

  hosts:
    needs: changes
    if: *run-closure-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      darwin_targets: ${{ steps.list.outputs.darwin_targets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: List host configurations
        id: list
        run: |
          # List every production/bootstrap NixOS and Darwin target.
          # shellcheck disable=SC2016
          lists=$(nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              darwinHosts = builtins.filter (n: builtins.match ".*-bootstrap" n == null)
                (builtins.attrNames flake.darwinConfigurations);
            in {
              targets = builtins.attrNames flake.nixosConfigurations;
              darwin_targets =
                map (n: "darwinConfigurations.${n}.system darwinConfigurations.${n}-bootstrap.system") darwinHosts
                ++ map (n: "checks.aarch64-darwin.${n}") (builtins.attrNames flake.checks.aarch64-darwin);
            }')
          for key in targets darwin_targets; do
            echo "$key=$(jq -c --arg key "$key" '.[$key]' <<<"$lists")" >> "$GITHUB_OUTPUT"
          done

  build:
    needs: [changes, hosts]
    if: *run-closure-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.hosts.outputs.targets) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - *free-host-build-space
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            system-features = big-parallel benchmark
      - name: Build CUDA Ollama for the target
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/ci-prebuild-ollama "$TARGET"
      - name: Build host configuration without secrets
        # The target comes from hosts/ directory names, so it reaches the
        # shell as data rather than being spliced into the script.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          nix build --no-link \
            ".#nixosConfigurations.${TARGET}.config.system.build.toplevel"

  build-darwin:
    needs: [changes, hosts]
    if: *run-closure-checks
    # macOS outputs build on an Apple Silicon runner; nothing is activated.
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.hosts.outputs.darwin_targets) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Build macOS output
        # The target comes from the hosts job, so it reaches the shell as
        # data rather than being spliced into the script. One entry may name
        # several attributes, separated by spaces.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -f
          args=()
          for attr in $TARGET; do args+=(".#$attr"); done
          nix build --no-link --print-build-logs "${args[@]}"
