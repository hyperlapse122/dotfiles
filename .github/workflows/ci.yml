name: CI

on:
  push:
  pull_request:

jobs:
  codex-wrapper:
    name: Codex Tokscale wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render Tokscale wrapper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/op-stub"
          printf '#!/usr/bin/env bash\nprintf dummy-secret\n' > "$RUNNER_TEMP/op-stub/op"
          chmod 700 "$RUNNER_TEMP/op-stub/op"
          : > "$RUNNER_TEMP/empty.toml"
          PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
            --config "$RUNNER_TEMP/empty.toml" \
            --source "$GITHUB_WORKSPACE" \
            execute-template \
            < dot_local/bin/private_executable_tokscale.tmpl \
            > "$RUNNER_TEMP/tokscale"
          chmod 700 "$RUNNER_TEMP/tokscale"
      - name: Test Codex wrapper
        env:
          TOKSCALE_WRAPPER_UNDER_TEST: ${{ runner.temp }}/tokscale
        run: .ci/test-codex-tokscale-wrapper.sh

  omp-agent-integration:
    name: oh-my-pi agent integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render OMP scripts and extension
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op-stub"
          printf '#!/usr/bin/env bash\nprintf dummy-secret\n' > "$RUNNER_TEMP/op-stub/op"
          chmod 700 "$RUNNER_TEMP/op-stub/op"
          : > "$RUNNER_TEMP/empty.toml"
          for item in \
            ".chezmoiscripts/70-agents/run_after_config-omp-auth.sh.tmpl:auth.sh" \
            ".chezmoiscripts/70-agents/run_onchange_after_update-omp-plugins.sh.tmpl:plugins.sh" \
            ".chezmoiscripts/70-agents/run_after_config-omp-settings.sh.tmpl:settings.sh" \
            "dot_omp/private_agent/extensions/mxm4-haptic.ts.tmpl:haptic.ts"
          do
            source_path=${item%%:*}
            output_name=${item#*:}
            PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
              --config "$RUNNER_TEMP/empty.toml" \
              --source "$GITHUB_WORKSPACE" \
              execute-template < "$source_path" > "$RUNNER_TEMP/$output_name"
          done
          # The Windows half is OS-gated, so force the render to compare both
          # halves' declared path sets from this Linux job.
          PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
            --config "$RUNNER_TEMP/empty.toml" \
            --source "$GITHUB_WORKSPACE" \
            --override-data '{"chezmoi":{"os":"windows"}}' \
            execute-template \
            < ".chezmoiscripts/70-agents/run_after_config-omp-settings.ps1.tmpl" \
            > "$RUNNER_TEMP/settings.ps1"
          chmod 700 "$RUNNER_TEMP/auth.sh" "$RUNNER_TEMP/plugins.sh" "$RUNNER_TEMP/settings.sh"
      - name: Test OMP reconciliation and haptics
        run: >-
          .ci/test-omp-agent-reconcile.sh
          "$RUNNER_TEMP/auth.sh"
          "$RUNNER_TEMP/plugins.sh"
          "$RUNNER_TEMP/haptic.ts"
          "$RUNNER_TEMP/settings.sh"
          "$RUNNER_TEMP/settings.ps1"

  ts-workspace:
    name: TypeScript workspace (packages/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run -r build
      - run: vp run -r typecheck
      - run: vp run -r test
      - run: vp check

  rust-crate:
    name: Rust crate (crates/mxm4-haptic/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mxm4-haptic
    steps:
      - uses: actions/checkout@v7
      - name: Install libudev (hidapi linux-static-hidraw backend)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo fmt --check

  open-design-integration:
    name: Open Design integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run isolated Open Design integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .ci/test-open-design-integration.sh
      - name: Run Open Design sleep hook
        run: .ci/test-open-design-sleep-hook.sh

  cli-proxy-api-integration:
    name: CLIProxyAPI quadlet integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run isolated CLIProxyAPI integration
        run: .ci/test-cli-proxy-api-integration.sh
      - name: Run CLIProxyAPI sleep hook
        run: .ci/test-cli-proxy-api-sleep-hook.sh
      - name: Render ignore gates under the container fact
        run: |
          set -euo pipefail
          sudo touch /run/.containerenv
          trap 'sudo rm -f /run/.containerenv' EXIT
          CLI_PROXY_API_TEST_EXPECT=container .ci/test-cli-proxy-api-render-matrix.sh

  cli-proxy-api-render-matrix:
    name: CLIProxyAPI ignore render matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render ignore/removal gates
        run: .ci/test-cli-proxy-api-render-matrix.sh

  compound-engineering-overlays:
    name: compound-engineering overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run overlay injection test
        run: .ci/test-compound-engineering-overlays.sh "$GITHUB_WORKSPACE"

  tmux-kitty-passthrough:
    name: tmux Kitty image passthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The test drives a real tmux server; util-linux script(1) is already on
      # the runner and provides the pty the transport cases need.
      - name: Install tmux
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Run isolated tmux passthrough test
        run: .ci/test-tmux-kitty-passthrough.sh

  kitty-provisioning:
    name: kitty provisioning and tab bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run kitty provisioning render test
        run: .ci/test-kitty-provisioning.sh

  # NOTE: shellcheck moved to the `render-dotfiles` workflow's `shellcheck` job,
  # which runs after the Fedora/Ubuntu render so it can lint the REAL rendered
  # scripts (including the `.chezmoiscripts/**` templates shellcheck cannot parse
  # in `.tmpl` form) plus the repo-meta scripts. It is therefore PR-only.
