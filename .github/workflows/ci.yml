name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omp-agent-integration:
    name: oh-my-pi agent integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - name: Install locked chezmoi
        run: |
          set -euo pipefail
          artifact_url=$(jq -r '.releases.tools.chezmoi.artifacts["linux-amd64"].url' .chezmoidata/releases.json)
          artifact_sha=$(jq -r '.releases.tools.chezmoi.artifacts["linux-amd64"].sha256' .chezmoidata/releases.json)
          curl -fsSL "$artifact_url" -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' "$artifact_sha" "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/bin" chezmoi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Render OMP scripts and haptic package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/op-stub"
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'case "$*" in'
            printf '%s\n' '  *"op://Private/OpenRouter/API Key"*) printf openrouter-test-secret ;;'
            printf '%s\n' '  *) printf dummy-secret ;;'
            printf '%s\n' 'esac'
          } > "$RUNNER_TEMP/op-stub/op"
          chmod 700 "$RUNNER_TEMP/op-stub/op"
          : > "$RUNNER_TEMP/empty.toml"
          for item in \
            ".chezmoiscripts/70-agents/run_after_config-omp-auth.sh.tmpl:auth.sh" \
            ".chezmoiscripts/70-agents/run_onchange_after_update-omp-plugins.sh.tmpl:plugins.sh" \
            ".chezmoiscripts/70-agents/run_after_config-omp-settings.sh.tmpl:settings.sh"
          do
            source_path=${item%%:*}
            output_name=${item#*:}
            PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
              --config "$RUNNER_TEMP/empty.toml" \
              --source "$GITHUB_WORKSPACE" \
              execute-template < "$source_path" > "$RUNNER_TEMP/$output_name"
          done
          mkdir -p "$RUNNER_TEMP/haptic-package/dist"
          PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
            --config "$RUNNER_TEMP/empty.toml" \
            --source "$GITHUB_WORKSPACE" \
            execute-template \
            < "dot_local/share/omp-plugins/plugins/mxm4-haptic/package.json.tmpl" \
            > "$RUNNER_TEMP/haptic-package/package.json"
          (cd packages && vp install --frozen-lockfile)
          (cd packages/mxm4-haptic && vp run build:omp-plugin)
          cp packages/mxm4-haptic/dist/omp-plugin/index.js "$RUNNER_TEMP/haptic-package/dist/index.js"
          PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
            --config "$RUNNER_TEMP/empty.toml" \
            --source "$GITHUB_WORKSPACE" \
            execute-template \
            < ".chezmoiscripts/60-build/run_after_build-mxm4-haptic.sh.tmpl" \
            > "$RUNNER_TEMP/build-mxm4-haptic.sh"
          chmod 700 "$RUNNER_TEMP/auth.sh" "$RUNNER_TEMP/plugins.sh" \
            "$RUNNER_TEMP/settings.sh" \
            "$RUNNER_TEMP/build-mxm4-haptic.sh"
      # Same locked render shape as the step above: an empty config so no user
      # state leaks in, and the `op` stub so no template secret read can reach a
      # real vault. Each fixture rewrites the render-time desktop fact in its own
      # scratch copy, so this headless runner's Linux render is usable for the
      # GNOME and KDE sources.
      - name: Render the fatal-boundary scripts under test
        run: |
          set -euo pipefail
          for item in \
            ".chezmoiscripts/50-linux-gnome/run_onchange_after_config-gnome-1password-shortcut.sh.tmpl:gnome-1password-shortcut.sh" \
            ".chezmoiscripts/50-linux-gnome/run_onchange_after_config-gnome-remove-ibus-source.sh.tmpl:gnome-remove-ibus-source.sh" \
            ".chezmoiscripts/50-linux-kde/run_onchange_after_config-kde-calendar.sh.tmpl:kde-calendar.sh" \
            ".chezmoiscripts/60-build/run_onchange_after_build-figma-auth.sh.tmpl:build-figma-auth.sh" \
            ".chezmoiscripts/60-build/run_onchange_after_build-settings-reconcile.sh.tmpl:build-settings-reconcile.sh"
          do
            source_path=${item%%:*}
            output_name=${item#*:}
            PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
              --config "$RUNNER_TEMP/empty.toml" \
              --source "$GITHUB_WORKSPACE" \
              execute-template < "$source_path" > "$RUNNER_TEMP/$output_name"
            chmod 700 "$RUNNER_TEMP/$output_name"
          done
          # setup-podman-cluster gates on osRelease.id, not just os, so the ubuntu
          # runner renders it empty without this override.
          PATH="$RUNNER_TEMP/op-stub:$PATH" chezmoi \
            --config "$RUNNER_TEMP/empty.toml" \
            --source "$GITHUB_WORKSPACE" \
            --override-data '{"chezmoi":{"os":"linux","osRelease":{"id":"fedora"}}}' \
            execute-template \
            < ".chezmoiscripts/30-linux/run_after_setup-podman-cluster.sh.tmpl" \
            > "$RUNNER_TEMP/setup-podman-cluster.sh"
          chmod 700 "$RUNNER_TEMP/setup-podman-cluster.sh"
      - name: Install locked OMP
        run: |
          set -euo pipefail
          artifact_url=$(jq -r '.releases.tools.omp.artifacts["linux-amd64"].url' .chezmoidata/releases.json)
          artifact_sha=$(jq -r '.releases.tools.omp.artifacts["linux-amd64"].sha256' .chezmoidata/releases.json)
          curl -fsSL "$artifact_url" -o "$RUNNER_TEMP/bin/omp"
          printf '%s  %s\n' "$artifact_sha" "$RUNNER_TEMP/bin/omp" | sha256sum --check -
          chmod 700 "$RUNNER_TEMP/bin/omp"
      - name: Test OMP reconciliation, haptics, and real plugin
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP/bin:$PATH" .ci/test-omp-agent-reconcile.sh \
            "$RUNNER_TEMP/auth.sh" \
            "$RUNNER_TEMP/plugins.sh" \
            "$RUNNER_TEMP/haptic-package" \
            "$RUNNER_TEMP/settings.sh"
          PATH="$RUNNER_TEMP/bin:$PATH" .ci/test-omp-comment-rules.sh
          .ci/check-omp-agent-roster.sh "$RUNNER_TEMP/settings.sh"
          .ci/test-podman-cluster-convergence.sh "$RUNNER_TEMP/setup-podman-cluster.sh"
          .ci/test-omp-real-plugin.sh "$RUNNER_TEMP/haptic-package"
          .ci/test-mxm4-haptic-provision.sh "$RUNNER_TEMP/build-mxm4-haptic.sh"
          .ci/test-mxm4-haptic-gates.sh
          .ci/test-mxm4-haptic-chezmoi-retry.sh
          .ci/test-agent-instructions.sh
          .ci/check-omp-seat-routing.sh
      # Prerequisites are already in this job: locked chezmoi and the runner's
      # python3 for the render and matrix gates, bun and jq for the merged-result
      # audit, git for the prune fixtures. The R6 post-merge workflow itself stays
      # out of CI — it can only run on a merged pull-request close event — and its
      # resolver and topology contract is proved before merge by the local gate.
      - name: Run focused regression gates
        run: |
          set -euo pipefail
          # These fixtures put their disposable trees under $XDG_RUNTIME_DIR or
          # else $HOME/.cache, which a runner does not necessarily have yet.
          mkdir -p "$HOME/.cache"
          .ci/test-fontconfig-korean-local-font.sh
          .ci/test-fingerprint-gates.sh
          .ci/test-extension-retry.sh
          .ci/test-capability-cache.sh
          .ci/test-skip-declaration-gates.sh
          .ci/test-dotfiles-skips.sh
          .ci/test-chezmoiignore-script-paths.sh
          .ci/test-gnome-hard-errors.sh \
            "$RUNNER_TEMP/gnome-1password-shortcut.sh" \
            "$RUNNER_TEMP/gnome-remove-ibus-source.sh"
          .ci/test-kde-calendar-hard-error.sh "$RUNNER_TEMP/kde-calendar.sh"
          .ci/test-build-figma-auth.sh "$RUNNER_TEMP/build-figma-auth.sh"
          .ci/test-build-settings-reconcile.sh "$RUNNER_TEMP/build-settings-reconcile.sh"
          .ci/test-merge-commit-only-gates.sh
          .ci/test-git-prune-local-branches.sh

  ts-workspace:
    name: TypeScript workspace (packages/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run -r build
      - run: vp run -r typecheck
      - run: vp run -r test
      - run: vp check


  rust-crate:
    name: Rust crate (crates/mxm4-haptic/, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/mxm4-haptic
    steps:
      - uses: actions/checkout@v7
      - name: Install libudev (hidapi linux-static-hidraw backend)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: .ci/lib/apt-install.sh - libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo fmt --check

  compound-engineering-overlays:
    name: compound-engineering overlays
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: |
          set -euo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run overlay injection test
        run: .ci/test-compound-engineering-overlays.sh "$GITHUB_WORKSPACE"

  tmux-kitty-passthrough:
    name: tmux Kitty image passthrough
    runs-on: ubuntu-latest
    # Drives a real tmux server and pty; the GitHub default is 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The test drives a real tmux server; util-linux script(1) is already on
      # the runner and provides the pty the transport cases need.
      - name: Install tmux
        run: .ci/lib/apt-install.sh tmux tmux
      - name: Run isolated tmux passthrough test
        run: .ci/test-tmux-kitty-passthrough.sh

  omp-zsh-completion:
    name: omp zsh completion install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install locked chezmoi
        run: |
          set -euo pipefail
          artifact_url=$(jq -r '.releases.tools.chezmoi.artifacts["linux-amd64"].url' .chezmoidata/releases.json)
          artifact_sha=$(jq -r '.releases.tools.chezmoi.artifacts["linux-amd64"].sha256' .chezmoidata/releases.json)
          curl -fsSL "$artifact_url" -o "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' "$artifact_sha" "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/bin" chezmoi
          chmod 700 "$RUNNER_TEMP/bin/chezmoi"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The test drives a real zsh so the $fpath prepend is proven to make
      # compinit resolve _omp, and proven NOT to without it.
      - name: Install zsh
        run: .ci/lib/apt-install.sh zsh zsh
      # Same render shape as the omp-agent-integration job's three call sites:
      # an empty config so no user state leaks in, and no --destination, which
      # execute-template does not need (it reads stdin and writes stdout).
      - name: Render the completion generator
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/empty.toml"
          chezmoi --config "$RUNNER_TEMP/empty.toml" \
            --source "$GITHUB_WORKSPACE" \
            execute-template \
            < .chezmoiscripts/70-agents/run_onchange_after_install-omp-zsh-completion.sh.tmpl \
            > "$RUNNER_TEMP/omp-zsh-completion.sh"
      - name: Run isolated completion install test
        run: .ci/test-omp-zsh-completion.sh "$RUNNER_TEMP/omp-zsh-completion.sh"

  # Every quality gate above must actually RUN. GitHub skips a job whose
  # `needs:` dependency fails, so checking only named jobs can mistake grey
  # for green. This always-running aggregate turns failure, cancellation, and
  # skip in any required job into one stable red required check.
  delivery:
    name: Final delivery
    if: always()
    needs:
      [
        omp-agent-integration,
        ts-workspace,
        rust-crate,
        tmux-kitty-passthrough,
        omp-zsh-completion,
        compound-engineering-overlays,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every job to succeed
        env:
          OMP_AGENT_INTEGRATION_RESULT: ${{ needs.omp-agent-integration.result }}
          TS_WORKSPACE_RESULT: ${{ needs.ts-workspace.result }}
          RUST_CRATE_RESULT: ${{ needs.rust-crate.result }}
          TMUX_KITTY_PASSTHROUGH_RESULT: ${{ needs.tmux-kitty-passthrough.result }}
          OMP_ZSH_COMPLETION_RESULT: ${{ needs.omp-zsh-completion.result }}
          COMPOUND_ENGINEERING_OVERLAYS_RESULT: ${{ needs.compound-engineering-overlays.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "omp-agent-integration=${OMP_AGENT_INTEGRATION_RESULT}" \
            "ts-workspace=${TS_WORKSPACE_RESULT}" \
            "rust-crate=${RUST_CRATE_RESULT}" \
            "tmux-kitty-passthrough=${TMUX_KITTY_PASSTHROUGH_RESULT}" \
            "omp-zsh-completion=${OMP_ZSH_COMPLETION_RESULT}" \
            "compound-engineering-overlays=${COMPOUND_ENGINEERING_OVERLAYS_RESULT}"; do
            echo "${result}"
            if [[ "${result#*=}" != success ]]; then
              failed=1
            fi
          done
          exit "${failed}"

  # NOTE: shellcheck moved to the `render-dotfiles` workflow's `shellcheck` job,
  # which runs after the Fedora and macOS renders so it can lint the REAL rendered
  # scripts (including the `.chezmoiscripts/**` templates shellcheck cannot parse
  # in `.tmpl` form) plus the repo-meta scripts. It is therefore PR-only.
