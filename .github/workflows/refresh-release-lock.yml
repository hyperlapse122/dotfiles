name: Refresh release lock

# Re-resolves .chezmoidata/releases.json from upstream on a schedule.
#
# The resolver omits sources it could not reach and exits non-zero; `--out`
# overlays the result onto the committed lock, so a failed source keeps its last
# good entry instead of being blanked. The commit therefore happens even on a
# partial failure, and the job still reports failure afterwards.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-release-lock
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve upstream releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Resolve releases into the lock
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bun run packages/release-lock/src/cli.ts --out .chezmoidata/releases.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Strict platform-vocabulary and source validation, fail-closed BEFORE
      # any commit: every artifact must use one of the resolver's eight
      # PlatformKey values, carry an https source URL and a 64-hex SHA-256,
      # and never mark a Linux or macOS resolution as emulated (emulation is
      # only ever an explicit Windows resolution).
      - name: Validate lock architecture and sources
        run: |
          set -euo pipefail
          lock=.chezmoidata/releases.json
          supported='["linux-amd64","linux-arm64","linux-amd64-musl","linux-arm64-musl","darwin-amd64","darwin-arm64","windows-amd64","windows-arm64"]'

          bad_keys=$(jq -r --argjson supported "${supported}" '
            [.releases.tools[].artifacts // {} | keys[]] - $supported | .[]' "${lock}")
          if [ -n "${bad_keys}" ]; then
            echo "::error::lock carries platform keys outside the canonical support matrix:"
            printf '  %s\n' ${bad_keys}
            exit 1
          fi

          jq -e '
            [.releases.tools[].artifacts // {} | to_entries[] | .value
             | select((.url | type == "string" and startswith("https://") | not)
                      or (.sha256 | type == "string" and test("^[0-9a-f]{64}$") | not))]
            | length == 0' "${lock}" >/dev/null || {
            echo "::error::lock carries an artifact without an https source URL and 64-hex SHA-256"
            exit 1
          }

          emulated=$(jq -r '
            [paths(objects | select(.emulated == true)) as $p | ($p | map(tostring) | join("."))]
            | .[]' "${lock}")
          if [ -n "${emulated}" ] && grep -qE '\.artifacts\.(linux|darwin)-' <<<"${emulated}"; then
            echo "::error::emulated resolution is never valid on Linux or macOS:"
            grep -E '\.artifacts\.(linux|darwin)-' <<<"${emulated}"
            exit 1
          fi

      - name: Commit the lock when it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- .chezmoidata/releases.json; then
            echo "Lock unchanged — nothing to commit."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(release-lock): refresh release lock' \
              -- .chezmoidata/releases.json
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Fail when any source could not be resolved
        if: steps.resolve.outputs.exit_code != '0'
        run: |
          echo "::error::One or more sources failed to resolve; their previous lock entries were kept."
          exit 1
