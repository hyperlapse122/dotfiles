name: Render dotfiles

# On every pull request and push to main, actually run `chezmoi apply --init` on all four target
# platforms and capture what chezmoi renders, so a reviewer can eyeball the real
# output of any template change without a local checkout:
#   * Fedora         — a slim container image (`apply` / `render-internals`).
#   * macOS          — a native `macos-26` arm64 runner (`apply-macos`); a
#                      container cannot provide a `darwin` chezmoi, and darwin-only
#                      templates (e.g. the mxm4-haptic build) render only here.
#   * Windows         — a native `windows-latest` runner (`apply-windows`); needed
#                       so `.chezmoi.os == "windows"` and the `.ps1` read-source
#                       hook path exercise, and to feed the PowerShell lint.
#
# Two independent artifacts are produced per OS:
#   1. rendered-files-<os>     — the dotfiles `chezmoi apply --init` writes into
#                                an isolated $HOME (scripts + externals excluded).
#   2. rendered-internals-<os> — the `.chezmoiscripts/**` and `.chezmoiexternals/**`
#                                templates rendered via `chezmoi execute-template`
#                                (these are never linked into $HOME, so they have
#                                to be rendered explicitly to be inspected).
#
# The rendered scripts then flow into two lint gates: `shellcheck` lints every
# rendered bash/sh script across Fedora and macOS, and `lint-powershell`
# runs PSScriptAnalyzer over the Windows `.ps1` files.
#
# No real 1Password or GitHub PAT is used. A PATH-local dummy `op` satisfies
# `onepasswordRead` / `onepassword`, and a dummy `mise` satisfies the container
# fast path in .install-prerequisites.sh. Source rendering reads external
# versions, URLs, and digests only from `.chezmoidata/releases.json`. Artifacts
# are short-lived (retention-days: 3) and are review aids, not release artifacts.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-dotfiles-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Bootstrap commands can use the workflow token to download the current
  # chezmoi release. Template rendering itself performs no GitHub release
  # lookup; the committed release lock is authoritative.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # Task 1: real `chezmoi apply --init` -> rendered dotfiles artifact.
  # ---------------------------------------------------------------------------
  apply:
    name: apply --init (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: fedora, image: "fedora:44" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Assert runtime architecture
        run: |
          set -euxo pipefail
          # Canonical matrix: fedora x64 renders in a fedora:44 container on the
          # ubuntu-24.04-class x64 hosted fleet. Fail closed on arch drift.
          [ "$(uname -m)" = "x86_64" ]
          . /etc/os-release
          [ "${ID}" = "fedora" ]

      - name: Install base tooling (${{ matrix.os }})
        run: |
          set -euxo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y --setopt=install_weak_deps=False git jq tar gzip >/dev/null
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl git jq tar gzip >/dev/null
          fi

      - uses: actions/checkout@v7

      - name: Install chezmoi + dummy op/mise
        run: |
          set -euxo pipefail
          # Use the current chezmoi release to exercise current render behavior.
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin
          chezmoi --version

          # Dummy `op`: satisfies op_ready() (`op whoami`), onepasswordRead
          # (`op read`) and onepassword (`op item get --format json`) with
          # placeholders — no real 1Password is contacted. The secret-read /
          # resolve-op-refs cache shims fall back to onepasswordRead here (no GPG
          # key or readiness marker in CI), so this stub covers them too. printf
          # (not a heredoc) keeps YAML block indentation out of the shebang line.
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -eu'
            printf '%s\n' 'case "${1-}" in'
            printf '%s\n' '  whoami)    printf "dummy@example.invalid\n" ;;'
            printf '%s\n' '  --version) printf "2.0.0\n" ;;'
            printf '%s\n' '  signin)    : ;;'
            printf '%s\n' '  account)   printf "[]\n" ;;'
            printf '%s\n' '  item)      printf "%s\n" "{\"fields\":[{\"id\":\"username\",\"label\":\"username\",\"value\":\"dummy-user\"},{\"id\":\"API\",\"label\":\"API\",\"value\":\"dummy-secret\"},{\"id\":\"password\",\"label\":\"password\",\"value\":\"dummy-secret\"},{\"id\":\"credential\",\"label\":\"credential\",\"value\":\"dummy-secret\"}]}" ;;'
            printf '%s\n' '  *)         printf "dummy-secret\n" ;;'
            printf '%s\n' 'esac'
          } > /usr/local/bin/op
          chmod 0755 /usr/local/bin/op

          # Dummy `mise`: only needs to exist on PATH so the container fast-path in
          # .install-prerequisites.sh (`command -v mise && op_ready`) exits 0. It is
          # never executed for real here — scripts are excluded from the apply.
          printf '%s\n' '#!/usr/bin/env bash' 'exit 0' > /usr/local/bin/mise
          chmod 0755 /usr/local/bin/mise

      - name: chezmoi apply --init into an isolated HOME
        run: |
          set -euxo pipefail
          # Reproduce chezmoi's canonical layout in a throwaway HOME: the source
          # tree lives at ~/.local/share/chezmoi so the read-source-state.pre hook
          # path (.local/share/chezmoi/.install-prerequisites.sh) resolves exactly
          # as it does on a real host.
          export HOME="${RUNNER_TEMP}/fakehome"
          SRC="${HOME}/.local/share/chezmoi"
          mkdir -p "${SRC}"
          cp -a "${GITHUB_WORKSPACE}/." "${SRC}/"
          rm -rf "${SRC}/.git"
          # This task renders managed FILES only; the .chezmoiexternals fetches
          # (git clones + release downloads) are rendered separately by the
          # render-internals job. Dropping them keeps this apply hermetic.
          rm -rf "${SRC}/.chezmoiexternals"
          cd "${HOME}"

          # Non-fatal: --keep-going renders everything it can and reports a
          # non-zero rc if ANY managed file errors. We surface that rc but do not
          # fail the job here — targeted assertion steps below are the
          # authoritative gates for templates changed by a PR.
          #
          # Feed a blank line on stdin with --no-tty: the Fedora config template
          # calls promptString for the LUKS passphrase, and newer chezmoi errors
          # when it tries to open /dev/tty in a non-interactive container instead
          # of using the default. A blank answer skips the per-host secret, so
          # the keyring-encryption path in .chezmoi.toml.tmpl is never entered
          # here and no keyring daemon is needed. Extra lines are harmless.
          set +e
          printf '\n\n\n' | chezmoi apply --init \
            --exclude=scripts,externals \
            --keep-going \
            --no-tty \
            --verbose
          rc=$?
          set -e
          echo "chezmoi apply --init exit code: ${rc}"
          echo "- \`chezmoi apply --init\` exit code: ${rc}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Stage rendered files
        if: always()
        run: |
          set -euxo pipefail
          src="${RUNNER_TEMP}/fakehome"
          out="${GITHUB_WORKSPACE}/_artifacts/rendered-files"
          mkdir -p "${out}"
          [ -d "${src}" ] || exit 0
          cp -a "${src}/." "${out}/"
          # Drop the source copy and chezmoi's own state/cache — keep only the
          # files chezmoi rendered into the target.
          rm -rf "${out}/.local/share/chezmoi" "${out}/.config/chezmoi" "${out}/.cache"

      - name: Upload rendered files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-files-${{ matrix.os }}
          path: _artifacts/rendered-files
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error


      - name: Assert LUKS TPM2 tool renders the shared dracut backend
        run: |
          set -euxo pipefail
          # The deployed tool (dot_local/bin/executable_setup-luks-tpm2-unlock.sh.tmpl)
          # inlines the enrollment backend at apply time via {{ include }}. Assert
          # the rendered tool carries the Fedora dracut + systemd-cryptenroll
          # backend so a regression is caught here
          # rather than at a reboot on a real host.
          tool="${GITHUB_WORKSPACE}/_artifacts/rendered-files/.local/bin/setup-luks-tpm2-unlock.sh"
          test -f "${tool}"
          # NB: the tool's header comments legitimately mention `{{ include }}` (escaped in
          # the source), so a blanket unrendered-template check would false-positive here.
          # The specific backend markers below + `bash -n` prove the include actually
          # resolved: an unresolved `{{ include ... }}` directive yields neither BACKEND_LABEL
          # nor valid bash.
          grep -q 'BACKEND_LABEL="dracut + systemd-cryptenroll"' "${tool}"  # shared backend inlined
          grep -q 'systemd-cryptenroll'                          "${tool}"  # TPM2 enrollment tool
          grep -q 'tpm2-device=auto'                             "${tool}"  # crypttab unlock option
          grep -q 'dracut -f --regenerate-all'                   "${tool}"  # initramfs rebuild
          bash -n "${tool}"                                                  # rendered result is valid bash
          echo "- LUKS TPM2 tool (${{ matrix.os }}) rendered the shared dracut + systemd-cryptenroll backend" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Assert solaar gesture rules render per-desktop
        run: |
          set -euxo pipefail
          # dot_config/solaar/rules.yaml.tmpl selects its gesture ACTIONS via
          # lookPath at render time: plasmashell on PATH -> KWin global-shortcut
          # actions (also the no-desktop default, which the artifact apply above
          # already covers); gnome-shell WITHOUT plasmashell -> GNOME Shell
          # D-Bus actions. The containers ship neither binary, so exercise both
          # branches explicitly with stub binaries on PATH and assert each
          # variant carries its desktop's D-Bus calls — and none of the other's.
          scratch="${RUNNER_TEMP}/de-render"
          mkdir -p "${scratch}/target" "${scratch}/kde-bin" "${scratch}/gnome-bin"
          : > "${scratch}/empty.toml"
          printf '%s\n' '#!/usr/bin/env bash' 'exit 0' > "${scratch}/kde-bin/plasmashell"
          printf '%s\n' '#!/usr/bin/env bash' 'exit 0' > "${scratch}/gnome-bin/gnome-shell"
          chmod 0755 "${scratch}/kde-bin/plasmashell" "${scratch}/gnome-bin/gnome-shell"

          # KDE host (plasmashell on PATH). The rendered file's comment header
          # documents BOTH desktop maps, so every check below anchors on rule
          # lines (^- Execute) — a bare grep would match the comments.
          env PATH="${scratch}/kde-bin:${PATH}" \
            chezmoi --config "${scratch}/empty.toml" \
              --source "${GITHUB_WORKSPACE}" \
              --destination "${scratch}/target" \
              execute-template < "${GITHUB_WORKSPACE}/dot_config/solaar/rules.yaml.tmpl" \
              > "${scratch}/rules-kde.yaml"
          grep -q '^- Execute: \[qdbus-qt6, org.kde.kglobalaccel' "${scratch}/rules-kde.yaml"
          grep -q '^- Execute: \[qdbus-qt6, org.kde.krunner' "${scratch}/rules-kde.yaml"
          ! grep -q '^- Execute: \[gdbus' "${scratch}/rules-kde.yaml"

          # GNOME-only host (gnome-shell on PATH, no plasmashell).
          env PATH="${scratch}/gnome-bin:${PATH}" \
            chezmoi --config "${scratch}/empty.toml" \
              --source "${GITHUB_WORKSPACE}" \
              --destination "${scratch}/target" \
              execute-template < "${GITHUB_WORKSPACE}/dot_config/solaar/rules.yaml.tmpl" \
              > "${scratch}/rules-gnome.yaml"
          grep -q 'OverviewActive, "<true>"\]$' "${scratch}/rules-gnome.yaml"
          grep -q 'OverviewActive, "<false>"\]$' "${scratch}/rules-gnome.yaml"
          grep -q '^- Execute: \[gdbus, .*org.gnome.Shell.FocusSearch\]$' "${scratch}/rules-gnome.yaml"
          ! grep -q '^- Execute: \[qdbus-qt6' "${scratch}/rules-gnome.yaml"
          # The desktop-agnostic haptic confirm must survive in both variants.
          grep -q '^- Execute: \[".*/mxm4-haptic", "SUBTLE COLLISION"\]$' "${scratch}/rules-kde.yaml"
          grep -q '^- Execute: \[".*/mxm4-haptic", "SUBTLE COLLISION"\]$' "${scratch}/rules-gnome.yaml"

          echo "- solaar gesture rules (${{ matrix.os }}) rendered both per-desktop variants" \
            >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Task 2: render .chezmoiscripts/** and .chezmoiexternals/** -> internals artifact.
  # ---------------------------------------------------------------------------
  render-internals:
    name: render internals (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: fedora, image: "fedora:44" }
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Assert runtime architecture
        run: |
          set -euxo pipefail
          [ "$(uname -m)" = "x86_64" ]
          . /etc/os-release
          [ "${ID}" = "fedora" ]

      - name: Install base tooling (${{ matrix.os }})
        run: |
          set -euxo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y --setopt=install_weak_deps=False curl git jq tar gzip >/dev/null
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl git jq tar gzip >/dev/null
          fi

      - uses: actions/checkout@v7


      - name: Install chezmoi + dummy op
        run: |
          set -euxo pipefail
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin
          chezmoi --version
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -eu'
            printf '%s\n' 'case "${1-}" in'
            printf '%s\n' '  whoami)    printf "dummy@example.invalid\n" ;;'
            printf '%s\n' '  --version) printf "2.0.0\n" ;;'
            printf '%s\n' '  signin)    : ;;'
            printf '%s\n' '  account)   printf "[]\n" ;;'
            printf '%s\n' '  item)      printf "%s\n" "{\"fields\":[{\"id\":\"username\",\"label\":\"username\",\"value\":\"dummy-user\"},{\"id\":\"API\",\"label\":\"API\",\"value\":\"dummy-secret\"},{\"id\":\"password\",\"label\":\"password\",\"value\":\"dummy-secret\"},{\"id\":\"credential\",\"label\":\"credential\",\"value\":\"dummy-secret\"}]}" ;;'
            printf '%s\n' '  *)         printf "dummy-secret\n" ;;'
            printf '%s\n' 'esac'
          } > /usr/local/bin/op
          chmod 0755 /usr/local/bin/op

      - name: Render .chezmoiscripts and .chezmoiexternals
        run: |
          set -euo pipefail
          # Isolated, empty scratch config so chezmoi does NOT read
          # .chezmoi.toml.tmpl (and therefore never runs the read-source-state.pre
          # hook). execute-template renders one template in isolation using the
          # container's OS + .chezmoidata; the dummy `op` on PATH covers the
          # onepassword* calls, and GITHUB_TOKEN covers gitHubLatest* / release
          # asset lookups.
          scratch="${RUNNER_TEMP}/scratch"
          mkdir -p "${scratch}/target"
          : > "${scratch}/empty.toml"
          out="${GITHUB_WORKSPACE}/_artifacts/rendered-internals"
          mkdir -p "${out}"

          render_one() {
            chezmoi --config "${scratch}/empty.toml" \
              --source "${GITHUB_WORKSPACE}" \
              --destination "${scratch}/target" \
              execute-template
          }

          total=0; failed=0
          # Both trees hold only template files: every .chezmoiscripts file is a
          # *.tmpl, and every .chezmoiexternals file is an implicit template.
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            dest="${out}/${rel%.tmpl}"   # foo.sh.tmpl -> foo.sh; externals keep .toml
            mkdir -p "$(dirname "${dest}")"
            total=$((total + 1))
            if render_one < "${f}" > "${dest}" 2> "${dest}.stderr"; then
              rm -f "${dest}.stderr"
            else
              mv "${dest}.stderr" "${dest}.render-error.txt"
              failed=$((failed + 1))
              echo "::warning file=${rel}::failed to render ${rel}"
            fi
          done < <(find .chezmoiscripts .chezmoiexternals -type f -print0)

          echo "rendered ${total} template(s), ${failed} error(s)"
          {
            echo "### rendered internals (${{ matrix.os }})"
            echo ""
            echo "- rendered ${total} template(s), ${failed} error(s)"
          } >> "${GITHUB_STEP_SUMMARY}"
          # Never hard-fail on a single template: a cross-arch external asset
          # lookup can legitimately return nothing on the runner's arch. Failures
          # are kept as *.render-error.txt inside the artifact for inspection.

      - name: Assert Figma collection external and paired reconcilers
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/_artifacts/rendered-internals"
          external="${out}/.chezmoiexternals/ai-agents.toml"
          posix="${out}/.chezmoiscripts/70-agents/run_after_install-figma-skills.sh"
          native_windows="${out}/.chezmoiscripts/70-agents/run_after_install-figma-skills.ps1"
          windows="${RUNNER_TEMP}/figma-skills-reconcile.ps1"
          for rendered in "${external}" "${posix}" "${native_windows}"; do
            test -f "${rendered}"
            test ! -e "${rendered}.render-error.txt"
          done

          chezmoi --config "${RUNNER_TEMP}/scratch/empty.toml" \
            --source "${GITHUB_WORKSPACE}" \
            --destination "${RUNNER_TEMP}/scratch/target" \
            --override-data '{"chezmoi":{"os":"windows"}}' \
            execute-template \
            < "${GITHUB_WORKSPACE}/.chezmoiscripts/70-agents/run_after_install-figma-skills.ps1.tmpl" \
            > "${windows}"

          revision=$(jq -er '.releases.tools["figma/mcp-server-guide"].revision' \
            "${GITHUB_WORKSPACE}/.chezmoidata/releases.json")
          skills=$(jq -cer '.releases.tools["figma/mcp-server-guide"].skills' \
            "${GITHUB_WORKSPACE}/.chezmoidata/releases.json")
          grep -F "archive/${revision}.tar.gz" "${external}"
          grep -F "readonly DESIRED_SKILLS_JSON='${skills}'" "${posix}"
          grep -F "\$desiredSkillsJson = '${skills}'" "${windows}"
          bash -n "${posix}"
          echo "- Figma external and paired reconcilers (${{ matrix.os }}) use the locked revision and inventory" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Assert fact-registry failure contracts
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/registry-contracts"
          empty="${RUNNER_TEMP}/scratch/empty.toml"
          target="${RUNNER_TEMP}/scratch/target"
          installer=".chezmoiscripts/30-linux/run_onchange_after_install-system-10-files.sh.tmpl"

          render_from() {
            local source=$1 template=$2
            chezmoi --config "${empty}" --source "${source}" \
              --destination "${target}" execute-template < "${source}/${template}"
          }

          # Each negative assertion gets a full disposable source copy. Never
          # mutate the checkout: later artifact/lint jobs must see exactly HEAD.
          mkdir -p "${scratch}/unknown" "${scratch}/missing"
          cp -a "${GITHUB_WORKSPACE}/." "${scratch}/unknown/"
          cp -a "${GITHUB_WORKSPACE}/." "${scratch}/missing/"

          sed -i 's/nvidiaPackages: nvidia/nvidiaPackages: ciUndeclaredFact/' \
            "${scratch}/unknown/.chezmoidata/packages.yaml"
          if render_from "${scratch}/unknown" \
              ".chezmoiscripts/20-linux-fedora/run_onchange_before_fedora.sh.tmpl" \
              > "${scratch}/unknown.out" 2> "${scratch}/unknown.err"; then
            echo "unknown fact unexpectedly rendered" >&2
            exit 1
          fi
          grep -F 'unknown fact "ciUndeclaredFact"' "${scratch}/unknown.err"

          sed -i '/^# FORCE_[*] overrides/i\  ciMissingProbe:\n    type: bool\n    probe: template\n    gates: CI-only registry parity assertion.\n    whenFalse: Test fixture only.' \
            "${scratch}/missing/.chezmoidata/facts.yaml"
          if render_from "${scratch}/missing" "${installer}" \
              > "${scratch}/missing.out" 2> "${scratch}/missing.err"; then
            echo "declared fact without a probe unexpectedly rendered" >&2
            exit 1
          fi
          grep -F 'fact "ciMissingProbe" is declared' "${scratch}/missing.err"
          grep -F 'but NO PROBE implements it' "${scratch}/missing.err"

          # Privilege isolation: the /etc installer shares facts-sh.tmpl with
          # package installers but must never inherit their FORCE_* escape hatches.
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/${installer%.tmpl}"
          if grep -n 'FORCE_' "${rendered}"; then
            echo "FORCE_* leaked into rendered install-system-10-files" >&2
            exit 1
          fi

      - name: Assert surviving compound-engineering plugin contract
        run: |
          set -euo pipefail
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins.sh"
          test -f "${rendered}"
          test ! -e "${rendered}.render-error.txt"
          grep -E '"claude:compound-engineering:compound-engineering-plugin:localArchive:.*/\.local/share/compound-engineering/v[0-9]+\.[0-9]+\.[0-9]+"' "${rendered}"
          grep -E '"codex:compound-engineering:compound-engineering-plugin:localArchive:.*/\.local/share/compound-engineering/v[0-9]+\.[0-9]+\.[0-9]+"' "${rendered}"
          ! grep -qE '"(agy|pi|opencode|kimi|omo):compound-engineering:' "${rendered}"
          bash -n "${rendered}"
          "${GITHUB_WORKSPACE}/.ci/smoke-agent-plugin-installer.sh" \
            "${rendered}" "${RUNNER_TEMP}/agent-plugin-smoke"

      - name: Assert mxm4-haptic plugin rows are container-filtered
        run: |
          set -euo pipefail
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins.sh"
          test -f "${rendered}"
          # These jobs render inside a real container (/.dockerenv present -> `container`
          # fact true), and the mxm4-haptic marketplaces are container: skip -> their rows
          # MUST be filtered out here (no MX Master 4 in a container). This proves the
          # container gate; the compound-engineering row above (container: keep) proves
          # rows still render. The Linux-host positive path runs in ci.yml's
          # native omp-agent-integration job.
          if grep -qE '"(claude|codex):mxm4-haptic:' "${rendered}"; then
            echo "mxm4-haptic plugin row rendered in a container (marketplace is container: skip)" >&2
            exit 1
          fi

      - name: Assert Fedora NVIDIA repository ownership
        if: matrix.os == 'fedora'
        run: |
          set -euo pipefail
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/20-linux-fedora/run_onchange_before_fedora.sh"
          test -f "${rendered}"
          test ! -e "${rendered}.render-error.txt"
          bash -n "${rendered}"
          "${GITHUB_WORKSPACE}/.ci/smoke-fedora-nvidia-repo-policy.sh" "${rendered}"

      - name: Assert Fedora VirtualBox Secure Boot signing
        if: matrix.os == 'fedora'
        run: |
          set -euo pipefail
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/20-linux-fedora/run_onchange_before_fedora.sh"
          rendered_etc="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/30-linux/run_onchange_after_install-system-10-files.sh"
          for f in "${rendered}" "${rendered_etc}"; do
            test -f "${f}"
            test ! -e "${f}.render-error.txt"
            bash -n "${f}"
          done
          "${GITHUB_WORKSPACE}/.ci/smoke-fedora-virtualbox-signing.sh" "${rendered}" "${rendered_etc}"

      - name: Upload rendered internals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-internals-${{ matrix.os }}
          path: _artifacts/rendered-internals
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Task 4: macOS — real `chezmoi apply --init` + internals render on a native
  # runner. A container image can't carry a darwin chezmoi, and the darwin
  # `.chezmoiignore` branch (keep `./Library`, drop `./system`) plus every
  # darwin-only template (e.g. the mxm4-haptic build) only render here. Produces
  # the same rendered-files-macos / rendered-internals-macos pair as the Linux
  # matrix so the shellcheck job also lints the darwin variant of each script.
  #
  # No real 1Password: a PATH-local dummy `op` (identical behaviour to the Linux
  # stub) satisfies op_ready() and onepassword*; a dummy `mise` on PATH makes the
  # .install-prerequisites.sh read-source hook take its `mise present && op_ready`
  # fast path (exit 0) instead of trying to brew-install anything.
  # ---------------------------------------------------------------------------
  apply-macos:
    name: apply --init + internals (macos)
    runs-on: macos-26
    steps:
      - name: Assert runtime architecture
        run: |
          set -euxo pipefail
          # Canonical matrix: the macOS leg is arm64-only on the exact macos-26
          # hosted label (never a moving alias). Fail closed on arch drift.
          [ "$(uname -m)" = "arm64" ]
          [ "$(uname -s)" = "Darwin" ]

      - uses: actions/checkout@v7

      - name: Install chezmoi + dummy op/mise
        run: |
          set -euxo pipefail
          # Install into a throwaway bindir on PATH — avoids sudo writes to
          # /usr/local/bin on Apple-silicon runners. GITHUB_PATH persists it to
          # every later step (so chezmoi's own hook run sees the dummy op/mise).
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "${bindir}"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "${bindir}"
          "${bindir}/chezmoi" --version

          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -eu'
            printf '%s\n' 'case "${1-}" in'
            printf '%s\n' '  whoami)    printf "dummy@example.invalid\n" ;;'
            printf '%s\n' '  --version) printf "2.0.0\n" ;;'
            printf '%s\n' '  signin)    : ;;'
            printf '%s\n' '  account)   printf "[]\n" ;;'
            printf '%s\n' '  item)      printf "%s\n" "{\"fields\":[{\"id\":\"username\",\"label\":\"username\",\"value\":\"dummy-user\"},{\"id\":\"API\",\"label\":\"API\",\"value\":\"dummy-secret\"},{\"id\":\"password\",\"label\":\"password\",\"value\":\"dummy-secret\"},{\"id\":\"credential\",\"label\":\"credential\",\"value\":\"dummy-secret\"}]}" ;;'
            printf '%s\n' '  *)         printf "dummy-secret\n" ;;'
            printf '%s\n' 'esac'
          } > "${bindir}/op"
          chmod 0755 "${bindir}/op"

          printf '%s\n' '#!/usr/bin/env bash' 'exit 0' > "${bindir}/mise"
          chmod 0755 "${bindir}/mise"

          echo "${bindir}" >> "${GITHUB_PATH}"

      - name: chezmoi apply --init into an isolated HOME
        run: |
          set -euxo pipefail
          export HOME="${RUNNER_TEMP}/fakehome"
          SRC="${HOME}/.local/share/chezmoi"
          mkdir -p "${SRC}"
          cp -a "${GITHUB_WORKSPACE}/." "${SRC}/"
          rm -rf "${SRC}/.git" "${SRC}/.chezmoiexternals"
          cd "${HOME}"

          set +e
          chezmoi apply --init \
            --exclude=scripts,externals \
            --keep-going \
            --verbose
          rc=$?
          set -e
          echo "chezmoi apply --init exit code: ${rc}"
          echo "- \`chezmoi apply --init\` (macos) exit code: ${rc}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Stage rendered files
        if: always()
        run: |
          set -euxo pipefail
          src="${RUNNER_TEMP}/fakehome"
          out="${GITHUB_WORKSPACE}/_artifacts/rendered-files"
          mkdir -p "${out}"
          [ -d "${src}" ] || exit 0
          cp -a "${src}/." "${out}/"
          rm -rf "${out}/.local/share/chezmoi" "${out}/.config/chezmoi" "${out}/.cache"

      - name: Upload rendered files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-files-macos
          path: _artifacts/rendered-files
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error


      - name: Render .chezmoiscripts and .chezmoiexternals
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/scratch"
          mkdir -p "${scratch}/target"
          : > "${scratch}/empty.toml"
          out="${GITHUB_WORKSPACE}/_artifacts/rendered-internals"
          mkdir -p "${out}"

          render_one() {
            chezmoi --config "${scratch}/empty.toml" \
              --source "${GITHUB_WORKSPACE}" \
              --destination "${scratch}/target" \
              execute-template
          }

          total=0; failed=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            dest="${out}/${rel%.tmpl}"
            mkdir -p "$(dirname "${dest}")"
            total=$((total + 1))
            if render_one < "${f}" > "${dest}" 2> "${dest}.stderr"; then
              rm -f "${dest}.stderr"
            else
              mv "${dest}.stderr" "${dest}.render-error.txt"
              failed=$((failed + 1))
              echo "::warning file=${rel}::failed to render ${rel}"
            fi
          done < <(find .chezmoiscripts .chezmoiexternals -type f -print0)

          echo "rendered ${total} template(s), ${failed} error(s)"
          {
            echo "### rendered internals (macos)"
            echo ""
            echo "- rendered ${total} template(s), ${failed} error(s)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Assert Figma collection external and paired reconcilers
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/_artifacts/rendered-internals"
          external="${out}/.chezmoiexternals/ai-agents.toml"
          posix="${out}/.chezmoiscripts/70-agents/run_after_install-figma-skills.sh"
          native_windows="${out}/.chezmoiscripts/70-agents/run_after_install-figma-skills.ps1"
          windows="${RUNNER_TEMP}/figma-skills-reconcile.ps1"
          for rendered in "${external}" "${posix}" "${native_windows}"; do
            test -f "${rendered}"
            test ! -e "${rendered}.render-error.txt"
          done

          chezmoi --config "${RUNNER_TEMP}/scratch/empty.toml" \
            --source "${GITHUB_WORKSPACE}" \
            --destination "${RUNNER_TEMP}/scratch/target" \
            --override-data '{"chezmoi":{"os":"windows"}}' \
            execute-template \
            < "${GITHUB_WORKSPACE}/.chezmoiscripts/70-agents/run_after_install-figma-skills.ps1.tmpl" \
            > "${windows}"

          revision=$(jq -er '.releases.tools["figma/mcp-server-guide"].revision' \
            "${GITHUB_WORKSPACE}/.chezmoidata/releases.json")
          skills=$(jq -cer '.releases.tools["figma/mcp-server-guide"].skills' \
            "${GITHUB_WORKSPACE}/.chezmoidata/releases.json")
          grep -F "archive/${revision}.tar.gz" "${external}"
          grep -F "readonly DESIRED_SKILLS_JSON='${skills}'" "${posix}"
          grep -F "\$desiredSkillsJson = '${skills}'" "${windows}"
          bash -n "${posix}"
          echo "- Figma external and paired reconcilers (macos) use the locked revision and inventory" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Assert surviving compound-engineering plugin contract
        run: |
          set -euo pipefail
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins.sh"
          test -f "${rendered}"
          test ! -e "${rendered}.render-error.txt"
          grep -E '"claude:compound-engineering:compound-engineering-plugin:localArchive:.*/\.local/share/compound-engineering/v[0-9]+\.[0-9]+\.[0-9]+"' "${rendered}"
          grep -E '"codex:compound-engineering:compound-engineering-plugin:localArchive:.*/\.local/share/compound-engineering/v[0-9]+\.[0-9]+\.[0-9]+"' "${rendered}"
          ! grep -qE '"(agy|pi|opencode|kimi|omo):compound-engineering:' "${rendered}"
          bash -n "${rendered}"
          "${GITHUB_WORKSPACE}/.ci/smoke-agent-plugin-installer.sh" \
            "${rendered}" "${RUNNER_TEMP}/agent-plugin-smoke"

      - name: Assert mxm4-haptic rows are linux-only (absent on macos)
        run: |
          set -euo pipefail
          rendered="${GITHUB_WORKSPACE}/_artifacts/rendered-internals/.chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins.sh"
          test -f "${rendered}"
          # The mxm4-haptic marketplaces are os:[linux]; their rows must NOT render on macos.
          if grep -qE '"(claude|codex):mxm4-haptic:' "${rendered}"; then
            echo "mxm4-haptic plugin row leaked into the macos render (marketplace is os:[linux])" >&2
            exit 1
          fi

      - name: Upload rendered internals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-internals-macos
          path: _artifacts/rendered-internals
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Task 5: Windows — real `chezmoi apply --init` + internals render on a native
  # runner. Only here does `.chezmoi.os == "windows"` hold, so the Windows
  # `.chezmoiignore` branch (keep `./AppData`, deploy `dot_local/bin/*.ps1` only)
  # and the `.ps1` read-source-state.pre hook path in `.chezmoi.toml.tmpl` are
  # actually exercised. The rendered Windows `.ps1` output feeds the
  # `lint-powershell` gate below.
  #
  # A dummy `op.cmd` / `mise.cmd` on PATH makes the `.install-prerequisites.ps1`
  # hook take its `mise present && Test-OpReady` fast path (exit 0) — no winget,
  # no real 1Password. The apply itself is non-fatal (mirrors the Linux jobs);
  # PSScriptAnalyzer is the authoritative Windows gate.
  # ---------------------------------------------------------------------------
  apply-windows:
    name: apply --init + internals (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Assert runtime architecture
        run: |
          $ErrorActionPreference = 'Stop'
          # Canonical matrix: the hosted Windows leg is x64. Fail closed on arch drift.
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "runtime architecture $env:PROCESSOR_ARCHITECTURE != AMD64 (canonical hosted Windows leg is x64)"
          }

      - uses: actions/checkout@v7

      - name: Install chezmoi + dummy op/mise
        run: |
          $ErrorActionPreference = 'Stop'
          $bindir = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Force -Path $bindir | Out-Null

          # Use the current chezmoi release to exercise current render behavior.
          # browser_download_url is public, so authentication is optional.
          $hdr = @{ 'User-Agent' = 'gh-actions' }
          if ($env:GITHUB_TOKEN) { $hdr['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/twpayne/chezmoi/releases/latest' -Headers $hdr
          $asset = $rel.assets | Where-Object { $_.name -match 'windows_amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'no chezmoi windows_amd64 release asset found' }
          $zip = Join-Path $env:RUNNER_TEMP 'chezmoi.zip'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -Headers @{ 'User-Agent' = 'gh-actions' }
          Expand-Archive -Path $zip -DestinationPath $bindir -Force
          & (Join-Path $bindir 'chezmoi.exe') --version

          # Dummy `op.cmd`: `whoami` exits 0 (Test-OpReady), `read op://...` and any
          # other verb print a placeholder secret so onepasswordRead resolves. A
          # .cmd is resolved by both Get-Command (PATHEXT) and chezmoi's exec.
          # (An array joined by CRLF, not a here-string — a here-string's closing
          # "@ must sit in column 1, which would break this YAML block scalar.)
          $op = @(
            '@echo off',
            'if /I "%~1"=="whoami" (echo dummy@example.invalid & exit /b 0)',
            'if /I "%~1"=="--version" (echo 2.0.0 & exit /b 0)',
            '<nul set /p "=dummy-secret"',
            'exit /b 0'
          ) -join "`r`n"
          Set-Content -Path (Join-Path $bindir 'op.cmd') -Value $op -Encoding Ascii

          # Dummy `mise.cmd`: only needs to exist on PATH for the hook fast path.
          $mise = @('@echo off', 'exit /b 0') -join "`r`n"
          Set-Content -Path (Join-Path $bindir 'mise.cmd') -Value $mise -Encoding Ascii

          Add-Content -Path $env:GITHUB_PATH -Value $bindir

      - name: chezmoi apply --init into an isolated HOME
        run: |
          $ErrorActionPreference = 'Stop'
          # robocopy exits 1 on a *successful* copy and chezmoi --keep-going may
          # exit non-zero by design; without this, pwsh 7.4+ turns any native
          # non-zero exit into a throw (killing the step before the rc checks).
          $PSNativeCommandUseErrorActionPreference = $false
          $fakehome = Join-Path $env:RUNNER_TEMP 'fakehome'
          $src = Join-Path $fakehome '.local\share\chezmoi'
          New-Item -ItemType Directory -Force -Path $src | Out-Null

          # robocopy (not Copy-Item */-Recurse, which skips dot-prefixed dirs like
          # .chezmoidata/.chezmoiscripts) mirrors the checkout, hidden files and
          # all. Exit codes 0-7 are success; >=8 is a real failure.
          $null = robocopy $env:GITHUB_WORKSPACE $src /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          Remove-Item -Recurse -Force (Join-Path $src '.git') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $src '.chezmoiexternals') -ErrorAction SilentlyContinue

          # chezmoi derives the home (and thus the default source dir + the
          # home-relative hook path) from USERPROFILE on Windows; point both it and
          # HOME at the throwaway profile and run from there.
          $env:USERPROFILE = $fakehome
          $env:HOME = $fakehome
          Set-Location $fakehome

          chezmoi apply --init --exclude=scripts,externals --keep-going --verbose
          $rc = $LASTEXITCODE
          Write-Host "chezmoi apply --init exit code: $rc"
          "- ``chezmoi apply --init`` (windows) exit code: $rc" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # Non-fatal like the Linux jobs: a tolerated non-zero chezmoi rc (or the
          # robocopy exit 1 above) must not become this step's exit code. Reset to
          # 0 explicitly — a real failure already threw above.
          exit 0

      - name: Stage rendered files
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          # robocopy exits 1 on a successful copy — keep that from throwing.
          $PSNativeCommandUseErrorActionPreference = $false
          $src = Join-Path $env:RUNNER_TEMP 'fakehome'
          $out = Join-Path $env:GITHUB_WORKSPACE '_artifacts\rendered-files'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (-not (Test-Path $src)) { exit 0 }
          $null = robocopy $src $out /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          # Drop the source copy + chezmoi's own state so only rendered targets remain.
          Remove-Item -Recurse -Force (Join-Path $out '.local\share\chezmoi') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $out '.config\chezmoi') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $out '.cache') -ErrorAction SilentlyContinue
          # robocopy's exit 1 (success) must not fail the step.
          exit 0

      - name: Upload rendered files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-files-windows
          path: _artifacts/rendered-files
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

      - name: Render .chezmoiscripts and .chezmoiexternals
        run: |
          $ErrorActionPreference = 'Stop'
          # A template that fails to render must set $LASTEXITCODE, not throw.
          $PSNativeCommandUseErrorActionPreference = $false
          $scratch = Join-Path $env:RUNNER_TEMP 'scratch'
          New-Item -ItemType Directory -Force -Path (Join-Path $scratch 'target') | Out-Null
          $empty = Join-Path $scratch 'empty.toml'
          New-Item -ItemType File -Force -Path $empty | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE '_artifacts\rendered-internals'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $roots = @('.chezmoiscripts', '.chezmoiexternals') |
            ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_ } |
            Where-Object { Test-Path $_ }
          $files = Get-ChildItem -Path $roots -Recurse -File -Force
          $prefix = $env:GITHUB_WORKSPACE.TrimEnd('\') + '\'
          $total = 0; $failed = 0
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($prefix.Length)
            $dest = Join-Path $out ($rel -replace '\.tmpl$', '')
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            $total++
            $err = "$dest.render-error.txt"
            Get-Content -Raw -LiteralPath $f.FullName |
              & chezmoi --config $empty --source $env:GITHUB_WORKSPACE --destination (Join-Path $scratch 'target') execute-template `
              1> $dest 2> $err
            if ($LASTEXITCODE -eq 0) {
              Remove-Item -Force $err -ErrorAction SilentlyContinue
            } else {
              $failed++
              Write-Host "::warning file=$rel::failed to render $rel"
            }
          }
          Write-Host "rendered $total template(s), $failed error(s)"
          "### rendered internals (windows)`n`n- rendered $total template(s), $failed error(s)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # Per-template render failures are captured as *.render-error.txt inside
          # the artifact (never hard-fail); chezmoi's non-zero rc must not fail here.
          exit 0

      - name: Assert Figma collection external and paired reconcilers
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE '_artifacts\rendered-internals'
          $external = Join-Path $out '.chezmoiexternals\ai-agents.toml'
          $nativePosix = Join-Path $out '.chezmoiscripts\70-agents\run_after_install-figma-skills.sh'
          $windows = Join-Path $out '.chezmoiscripts\70-agents\run_after_install-figma-skills.ps1'
          foreach ($rendered in @($external, $nativePosix, $windows)) {
            if (-not (Test-Path -LiteralPath $rendered -PathType Leaf)) {
              throw "missing rendered Figma path: $rendered"
            }
            if (Test-Path -LiteralPath "$rendered.render-error.txt") {
              throw "Figma render failed: $rendered"
            }
          }

          $scratch = Join-Path $env:RUNNER_TEMP 'scratch'
          $posix = Join-Path $env:RUNNER_TEMP 'figma-skills-reconcile.sh'
          Get-Content -Raw -LiteralPath (
            Join-Path $env:GITHUB_WORKSPACE '.chezmoiscripts\70-agents\run_after_install-figma-skills.sh.tmpl'
          ) | & chezmoi --config (Join-Path $scratch 'empty.toml') `
            --source $env:GITHUB_WORKSPACE `
            --destination (Join-Path $scratch 'target') `
            --override-data '{"chezmoi":{"os":"linux"}}' `
            execute-template | Set-Content -LiteralPath $posix -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw "POSIX Figma reconciler render exited with code $LASTEXITCODE" }

          $entry = (
            Get-Content -Raw -LiteralPath '.chezmoidata/releases.json' | ConvertFrom-Json
          ).releases.tools.'figma/mcp-server-guide'
          [string]$revision = $entry.revision
          [string]$skills = ConvertTo-Json -InputObject @($entry.skills) -Compress
          $externalContent = Get-Content -Raw -LiteralPath $external
          $posixContent = Get-Content -Raw -LiteralPath $posix
          $windowsContent = Get-Content -Raw -LiteralPath $windows
          if (-not $externalContent.Contains("archive/$revision.tar.gz")) {
            throw "Figma external does not use locked revision $revision"
          }
          if (-not $posixContent.Contains("readonly DESIRED_SKILLS_JSON='$skills'")) {
            throw 'POSIX Figma reconciler inventory differs from the lock'
          }
          if (-not $windowsContent.Contains("`$desiredSkillsJson = '$skills'")) {
            throw 'Windows Figma reconciler inventory differs from the lock'
          }
          [void][ScriptBlock]::Create($windowsContent)
          "- Figma external and paired reconcilers (windows) use the locked revision and inventory" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Assert Windows compound-engineering and omp integration
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $env:GITHUB_WORKSPACE '_artifacts\rendered-internals'
          $externals = Join-Path $out '.chezmoiexternals\ai-agents.toml'
          $updater = Join-Path $out '.chezmoiscripts\70-agents\run_onchange_after_update-omp-plugins.ps1'
          $settings = Join-Path $out '.chezmoiscripts\70-agents\run_after_config-omp-settings.ps1'
          $auth = Join-Path $out '.chezmoiscripts\70-agents\run_after_config-omp-auth.ps1'
          foreach ($path in @($externals, $updater, $settings, $auth)) {
            if (-not (Test-Path $path)) { throw "missing rendered survivor path: $path" }
            if (Test-Path "$path.render-error.txt") { throw "render failed: $path" }
          }

          $match = [regex]::Match(
            (Get-Content -Raw $externals),
            '\["(?<relative>\.local/share/compound-engineering/v[0-9]+\.[0-9]+\.[0-9]+)"\]'
          )
          if (-not $match.Success) { throw 'compound-engineering external missing on Windows' }

          $rendered = Get-Content -Raw -LiteralPath $updater
          [void][ScriptBlock]::Create($rendered)
          $expectedVersion = (
            (Get-Content -Raw -LiteralPath '.chezmoidata/releases.json' | ConvertFrom-Json).
              releases.tools.omp.version -replace '^v', ''
          )
          if ($rendered -notmatch "(?m)^\`$expectedOmpVersion = '$([regex]::Escape($expectedVersion))'\r?$") {
            throw "rendered OMP updater does not use locked version $expectedVersion"
          }
          if ($rendered -notmatch "Name = 'mxm4-haptic'; Market = 'h82-dotfiles'; Kind = 'localDir'") {
            throw 'rendered OMP updater is missing the Windows haptic plugin row'
          }
          if ($rendered -notmatch "Name = 'compound-engineering'; Market = 'compound-engineering-plugin'; Kind = 'localArchive'") {
            throw 'rendered OMP updater is missing the Windows compound-engineering row'
          }
          $authHome = Join-Path $env:RUNNER_TEMP 'omp-auth-home'
          $authEnv = Join-Path $authHome '.omp\agent\.env'
          New-Item -ItemType Directory -Force -Path (Split-Path $authEnv) | Out-Null
          @(
            '# user-owned values stay byte-identical'
            "OTHER_TOKEN='keep me'"
            'ZAI_API_KEY=stale'
            'ZAI_API_KEY="duplicate"'
            'OPENROUTER_API_KEY=stale'
            'OPENCODE_API_KEY="duplicate"'
          ) | Set-Content -LiteralPath $authEnv -Encoding utf8NoBOM
          $env:OMP_AGENT_ENV = $authEnv
          & pwsh -NoProfile -File $auth
          if ($LASTEXITCODE -ne 0) { throw "omp auth reconcile failed ($LASTEXITCODE)" }
          $authLines = @(Get-Content -LiteralPath $authEnv)
          foreach ($name in @('ZAI_API_KEY', 'EXA_API_KEY', 'OPENROUTER_API_KEY', 'OPENCODE_API_KEY')) {
            $assignments = @($authLines | Where-Object { $_ -match "^$name=" })
            if ($assignments.Count -ne 1) { throw "expected one $name assignment, got $($assignments.Count)" }
            if ($assignments[0] -ne "$name=`"dummy-secret`"") { throw "unexpected $name value: $($assignments[0])" }
          }
          if (-not ($authLines -contains "OTHER_TOKEN='keep me'")) { throw 'unmanaged dotenv line was not preserved' }
          Set-Content -LiteralPath $authEnv -Value 'NOT A DOTENV ASSIGNMENT' -NoNewline -Encoding utf8NoBOM
          & pwsh -NoProfile -File $auth *> (Join-Path $env:RUNNER_TEMP 'omp-auth-malformed.log')
          if ($LASTEXITCODE -eq 0) { throw 'omp auth accepted malformed dotenv input' }
          if ((Get-Content -Raw -LiteralPath $authEnv) -ne 'NOT A DOTENV ASSIGNMENT') {
            throw 'omp auth changed malformed dotenv input'
          }
          exit 0

      - name: Upload rendered internals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-internals-windows
          path: _artifacts/rendered-internals
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Task 6: shellcheck the RENDERED scripts (not the raw *.tmpl, which shellcheck
  # cannot parse). Runs only after the Fedora and macOS render jobs so it
  # lints the real output of every provisioning script on every POSIX target —
  # the `.chezmoiscripts/**` templates that the source-level lint could never
  # reach, including darwin-only scripts that render on macOS alone. OS-gated
  # templates render to an empty file on the non-matching OS, so the shell-shebang
  # filter below skips them automatically; templates active on several OSes are
  # linted in each variant (their rendered bodies can differ per OS). The two
  # repo-meta scripts that are never deployed/rendered (.install-prerequisites.sh
  # and the .ci smoke test) are linted from the checkout so their coverage is not
  # lost. Findings are also uploaded as a `shellcheck-report` artifact.
  shellcheck:
    name: Shellcheck (rendered scripts + repo-meta)
    needs: [apply, render-internals, apply-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download rendered artifacts
        uses: actions/download-artifact@v8
        with:
          path: _rendered
          pattern: rendered-*

      - name: shellcheck
        run: |
          set -uo pipefail
          targets=()

          # Repo-meta scripts that chezmoi never deploys/renders (dot-prefixed /
          # .ci), so they are absent from the rendered artifacts — lint the source.
          [ -f .install-prerequisites.sh ] && targets+=(.install-prerequisites.sh)
          while IFS= read -r -d '' s; do
            targets+=("$s")
          done < <(find .ci -maxdepth 1 -type f -name '*.sh' -print0)

          # Every rendered file carrying a bash/sh shebang. The shebang test skips
          # empty renders (OS-gated-out templates) and non-shell files alike.
          while IFS= read -r -d '' f; do
            if head -n1 "$f" | grep -qE '^#!.*(/(ba)?sh|env[[:space:]]+(ba)?sh)([[:space:]]|$)'; then
              targets+=("$f")
            fi
          done < <(find _rendered -type f -print0)

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no shell scripts found to lint" >&2
            exit 1
          fi

          printf 'shellcheck targets (%d):\n' "${#targets[@]}"
          printf '  %s\n' "${targets[@]}"

          # tee the human-readable report into an artifact; preserve shellcheck's
          # own exit code (PIPESTATUS[0]) so findings fail the job.
          shellcheck --format=tty --external-sources "${targets[@]}" \
            | tee shellcheck-report.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### shellcheck (rendered scripts + repo-meta)"
            echo ""
            echo "- linted ${#targets[@]} script(s); shellcheck exit code: ${rc}"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

      - name: Upload shellcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shellcheck-report
          path: shellcheck-report.txt
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Task 7: PSScriptAnalyzer over the Windows PowerShell scripts — the `.ps1`
  # analogue of the shellcheck gate. Runs after apply-windows so it lints the
  # REAL rendered `.ps1` output chezmoi wrote into $HOME (today only
  # dot_local/bin/executable_code.ps1 -> code.ps1, which is a verbatim copy, but
  # a future templated `.ps1` would be caught here in its rendered form). The
  # repo-meta `.install-prerequisites.ps1` hook is never deployed/rendered, so it
  # is linted from the checkout — mirroring how shellcheck lints
  # .install-prerequisites.sh. PSScriptAnalyzer is cross-platform (pwsh ships on
  # the ubuntu runner), so this needs no Windows runner.
  #
  # The gate FAILS on Error-severity findings (parse errors, genuine defects) and
  # REPORTS Warning-severity ones without failing: PSSA's default rule set flags
  # stylistic conventions this repo's scripts deliberately don't follow (e.g.
  # PSUseSingularNouns on `Install-Prerequisites`, PSUseShouldProcessForStateChanging
  # Functions on the internal `Update-SessionPath`/`Install-*` helpers), and those
  # should not block a PR. Every Warning + Error is still captured in the
  # `psscriptanalyzer-report` artifact and the step summary for review.
  lint-powershell:
    name: PSScriptAnalyzer (rendered .ps1 + repo-meta)
    needs: [apply-windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Download rendered Windows artifacts
        uses: actions/download-artifact@v8
        with:
          path: _rendered
          pattern: rendered-*-windows

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Invoke-ScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = [System.Collections.Generic.List[string]]::new()

          # Repo-meta hook that chezmoi never deploys/renders — lint the source.
          if (Test-Path '.install-prerequisites.ps1') {
            $targets.Add((Resolve-Path '.install-prerequisites.ps1').Path)
          }

          # Every rendered .ps1 from the Windows apply/internals artifacts.
          if (Test-Path '_rendered') {
            Get-ChildItem -Path '_rendered' -Recurse -File -Filter '*.ps1' |
              ForEach-Object { $targets.Add($_.FullName) }
          }

          if ($targets.Count -eq 0) {
            Write-Error 'no PowerShell scripts found to lint'
            exit 1
          }

          Write-Host "PSScriptAnalyzer targets ($($targets.Count)):"
          $targets | ForEach-Object { Write-Host "  $_" }

          # Collect Warning + Error findings for reporting; only Error fails the job.
          $results = foreach ($t in $targets) {
            Invoke-ScriptAnalyzer -Path $t -Severity @('Warning', 'Error')
          }

          if ($results) {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message |
              Out-String -Width 200 | Tee-Object -FilePath psscriptanalyzer-report.txt
          } else {
            'PSScriptAnalyzer: no Warning/Error findings.' |
              Tee-Object -FilePath psscriptanalyzer-report.txt
          }

          $errors   = @($results | Where-Object { $_.Severity -eq 'Error' }).Count
          $warnings = @($results | Where-Object { $_.Severity -eq 'Warning' }).Count
          "### PSScriptAnalyzer (rendered .ps1 + repo-meta)`n`n- linted $($targets.Count) script(s); $errors error(s), $warnings warning(s) (errors fail the job; warnings are advisory)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($errors -gt 0) {
            Write-Error "PSScriptAnalyzer found $errors error-severity finding(s)."
            exit 1
          }

      - name: Upload PSScriptAnalyzer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psscriptanalyzer-report
          path: psscriptanalyzer-report.txt
          retention-days: 3
          if-no-files-found: ignore

  # Every quality gate above must actually RUN. GitHub skips a job whose `needs:`
  # dependency fails, so checking only the named lint job can mistake grey for
  # green. This always-running aggregate turns failure, cancellation, and skip in
  # any guarded job into one stable red required check.
  gate:
    name: Required checks
    if: always()
    needs:
      [
        apply,
        render-internals,
        apply-macos,
        apply-windows,
        shellcheck,
        lint-powershell,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          APPLY_RESULT: ${{ needs.apply.result }}
          RENDER_INTERNALS_RESULT: ${{ needs.render-internals.result }}
          APPLY_MACOS_RESULT: ${{ needs.apply-macos.result }}
          APPLY_WINDOWS_RESULT: ${{ needs.apply-windows.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          LINT_POWERSHELL_RESULT: ${{ needs.lint-powershell.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "apply=${APPLY_RESULT}" \
            "render-internals=${RENDER_INTERNALS_RESULT}" \
            "apply-macos=${APPLY_MACOS_RESULT}" \
            "apply-windows=${APPLY_WINDOWS_RESULT}" \
            "shellcheck=${SHELLCHECK_RESULT}" \
            "lint-powershell=${LINT_POWERSHELL_RESULT}"; do
            echo "${result}"
            if [[ "${result#*=}" != success ]]; then
              failed=1
            fi
          done
          exit "${failed}"
