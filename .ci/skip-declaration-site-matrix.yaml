divergence:
  - bucket: 'harmless'
    plan: 41
    audited: 28
    reason: 'The plan estimate counted the pre-U4 inventory, whose harmless mass sat in the three extension jobs (no-compatible-build, gnome-extensions/curl/python3 absent, already-installed). U4 converted those to run_after_ signature lifecycles, so they left this surface; re-reading the remaining owners against skip.sh.tmpl, a tool this repository installs later is transient-blocking, not harmless. Two later additions land here: the authd schema opt-out (an authd build with no users.shell column will never accept a shell change) and the shared-host guard (a machine with other users does not stop having them).'
  - bucket: 'transient_blocking'
    plan: 47
    audited: 59
    reason: 'Every session-bus, gsettings, kconfig-tools, sudo and repo-installed-tool precondition on an otherwise eligible host is transient-blocking by definition, and the fan-out of those preconditions across the GNOME/KDE config scripts is larger than the pre-U4 estimate. The post-inventory WakaTime keyring site adds one session-bus precondition, and the authd fallback adds one sqlite3 precondition; each such row names a registry probe, so U6/U7 wiring stays mechanical.'
  - bucket: 'done_here'
    plan: 10
    audited: 14
    reason: 'The six GNOME/KDE completion stamps plus eight already-current fast paths (fedora packages/MOK, an enrolled or queued certificate, an already-zsh login shell, a converged authd login shell, an already-registered keybinding, an ibus-free source list, an authenticated tailnet) are recorded as done_here because each reads a completion marker or a converged state. The pre-U4 estimate split several of those into its not_applicable all-work-done bucket instead; skip.sh.tmpl reserves not_applicable for a data opt-out, so they are recorded here.'
  - bucket: 'not_applicable'
    plan: 22
    audited: 24
    reason: 'Two additional permanent host-shape opt-outs (no TPM2 device, no LUKS device) are recorded alongside the fact-gated and data-declared ones. No row was relabelled to reach a count: every direction here follows skip.sh.tmpl verbatim, and the residual deltas in this block are the arithmetic of the U4 rename plus per-step rather than per-script enumeration.'
  - bucket: 'scope:00-tools+10-auth'
    plan: 8
    audited: 9
    reason: 'The auth phase carries a fifth step owner — auth-tailscale/already-authenticated — that the pre-U4 estimate folded into its four blocking rows.'
  - bucket: 'scope:20-linux-fedora'
    plan: 14
    audited: 17
    reason: 'The MOK generate/enroll guards, the kr-mirrorlist chassis guard, the empty-set opt-outs and enable_unit’s own unit-file guard are separate step owners, which the scope estimate collapsed into whole scripts.'
  - bucket: 'scope:30-linux'
    plan: 19
    audited: 30
    reason: 'setup-podman-cluster contributes five substep owners and install-system-* two service-level owners; the estimate counted this phase at the granularity of whole scripts. The post-inventory WakaTime keyring site adds one transient-blocking owner, and the authd login-shell branch adds five: an sqlite3 precondition, a harmless schema opt-out, a converged-state completion, and the two transient-tolerable deferrals that keep a locked authd database retryable instead of aborting the apply.'
  - bucket: 'scope:50-linux-gnome'
    plan: 40
    audited: 29
    reason: 'The estimate of 40 included the roughly sixteen skip sites in the two GNOME extension jobs U4 renamed to run_after_, which are no longer on this surface; the six remaining config scripts hold 29 owners plus the four named hard errors.'
  - bucket: 'scope:50-linux-kde'
    plan: 28
    audited: 29
    reason: 'One extra step owner beyond the estimate (config-kde-fonts/fc-cache-absent); the akonadi SQL-read failure in the same phase is recorded as the eleventh hard error rather than a classified owner.'
  - bucket: 'scope:60-build'
    plan: 4
    audited: 5
    reason: 'The two build scripts hold five classified owners (two mise preconditions and three unsafe-target guards) beside their six hard errors; the estimate counted four.'
  - bucket: 'scope:guard-partials'
    plan: 4
    audited: 5
    reason: 'The shared-host guard is the fifth guard partial. It postdates the plan inventory: the /etc manifest, hostname, lingering, zram, resolver and firewall writes needed one gate that three installers share, and a shared partial is how this repository fans a single classified owner across its consumers.'

