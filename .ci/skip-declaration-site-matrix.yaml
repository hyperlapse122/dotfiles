# skip-declaration-site-matrix.yaml — CI-ONLY audit oracle for the R5 classified-site
# boundary. NOT a chezmoi runtime input: it lives under .ci/, no template or script
# reads it, and chezmoi never parses it. The runtime policy stays where it already
# is — .chezmoitemplates/skip.sh.tmpl (the declaration contract), its call sites, and
# .chezmoidata/.capability-registry.tsv (the versioned probe registry).
#
# WHAT IT FREEZES. The 130-site inventory of docs/plans/2026-08-13-001-feat-skip-
# declaration-contract-plan.md, plus the post-inventory WakaTime keyring site
# present in the current source, is re-audited here: 121 classified source
# owners plus the eleven settled hard-error owners. Every field below was read
# out of the named template at the named line; anchors are PRE-CONVERSION snapshots,
# so U6/U7 edits move the code without invalidating the freeze (CI checks the
# template path, never that the line still reads the same).
#
# AUDIT BOUNDARY (what counts as one owner).
#   * Scope: run_onchange_* / run_once_* templates plus the four shared guard
#     partials — exactly the surface U8's rendered guard scans. run_after_*
#     lifecycles are U4 territory and are never owners here; the two renamed GNOME
#     extension jobs appear only as gnome-guard CONSUMER instances, which is what
#     keeps that guard's fan-out at eight.
#   * One owner per skip decision that abandons a declared step or the whole script.
#     Per-item notices inside an iteration over discovered items (per touchpad
#     feature, per MOK certificate, per direct RPM, per gated system file, per
#     credential server) are recorded under their step owner, not as owners.
#   * A helper reached from several call sites is one owner per call site, matching
#     the legacy inventory rule.
#   * Each shared guard owner declares its complete consumer fan-out (8 GNOME, 9
#     KDE, 3 headless, 4 sudo), so the rendered total is 117 + 24 = 141 sentinels,
#     never 121.
#
# FIELDS. `predicate` is the anchor line normalized (leading if/elif, trailing
# `; then` and line continuations removed, whitespace collapsed); `*_digest` is
# `sha256:` + SHA-256 of that exact normalized string, so CI recomputes both digests
# from the recorded text instead of trusting them. `continuation` is the control flow
# the conversion must preserve. `form`/`direction` are exactly skip.sh.tmpl's
# vocabularies, with its definitions unchanged: `harmless` is a condition THIS host
# will never satisfy, `transient-blocking` is an eligible host missing a precondition
# that can appear later. A `transient-blocking` row additionally names the registry
# probe its rendered fingerprint must hash and where that fingerprint block lives.
#
# THE FATAL SUBSET IS ELEVEN, AND THE PLAN NOW FIXES ELEVEN. Ten are the plan's
# GNOME parser and Figma/Kimi build causes; the eleventh,
# `config-kde-calendar/akonadi-query-failed`, is a conditional `return 0` on a path
# where mariadb is present and the akonadi socket check has already passed, so the
# SQL read itself failed on an ELIGIBLE host. No declaration form fits it —
# `harmless` would assert the host can never satisfy it, and no two-valued
# capability token can represent "the query failed" — and the plan's session-settled
# R5 Key Decision authorizes it as a hard error.
#
# CATEGORY RECONCILIATION IS EXPLICIT, NOT SILENT. `plan_contract` records the
# feedback-sweep plan Appendix numbers verbatim; `audited_*` records what this
# re-audit found; `divergence` names every bucket where they differ and why, and CI
# fails if a bucket differs without a divergence entry (or carries a stale one). The
# plan's per-direction split was estimated from the PRE-U4 130-site inventory, whose
# harmless/done_here mass included the three extension jobs U4 has since converted to
# run_after_ signature lifecycles; those sites left this surface, so the same 120
# in-scope owners cannot carry that split without re-labelling rows against
# skip.sh.tmpl's own definitions. The current source adds one transient-blocking
# WakaTime keyring site after that inventory. The frozen totals — 121 owners, 11
# hard errors, 141 instances, 117 + 24 — are CI-enforced.

