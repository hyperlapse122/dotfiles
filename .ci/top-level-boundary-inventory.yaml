# top-level-boundary-inventory.yaml — CI-ONLY audit oracle for the repository's
# source-root deployment boundary. NOT a chezmoi runtime input: it lives under
# .ci/, no template or script reads it, and chezmoi never parses it. The runtime
# policy stays where it already is — home/.chezmoiignore.
#
# WHAT IT DECLARES. Every git-tracked entry at the chezmoi source root (home/),
# classified by what chezmoi does with it. .ci/test-top-level-deployment-boundary.sh
# compares this declaration against what chezmoi actually renders, in both directions:
# an entry missing here fails, and an entry whose declared class disagrees with the
# rendered .chezmoiignore fails. The declaration is therefore never a second
# hand-maintained list that can drift quietly — drift is what the gate reports.
#
# WHAT IT DOES NOT HAVE TO DECLARE. Safety does not depend on this file being
# complete. The gate also enumerates the source root on disk and requires every
# non-dot name it finds there to be ignored unless this file declares it
# deployed. A generated directory nobody thought to list is caught because it is
# present, not because someone remembered it. That is the one check that needs no
# list, and it is why forgetting to update this file is loud rather than silent.
#
# CLASSES.
#   source-internal — the name starts with `.`, so chezmoi ignores it outright
#                     (`.chezmoi*` excepted, which are chezmoi's own inputs).
#                     These never need a .chezmoiignore line and never get one.
#   repo-only       — a non-dot entry chezmoi must be told to ignore. Valid
#                     class, currently empty at the source root since repository
#                     infrastructure sits at the repository root outside home/.
#   deployed        — chezmoi manages a target from it. `only_on` narrows that to
#                     a subset of the profiles below; in every other profile the
#                     entry must be ignored. Source-name prefixes carry the
#                     semantics (dot_ -> ., private_ -> 0600, symlink_ -> link,
#                     remove_ -> delete the target), so `deployed` means chezmoi
#                     acts on the target, not that a file is copied there.
#
# The gate derives each entry's target path from its source name rather than
# reading it here: the transform is the one AGENTS.md documents, and a second
# declaration of it would be one more thing to keep in sync.
#
# preemptive_denials sits outside `entries` and carries no safety duty. With the
# source root moved under home/, tools generating outputs at the repository root
# (agents.lock, _artifacts) write outside the source root, so no preemptive
# denials are needed at the source root. Kept empty to satisfy the inventory schema.

# The profile set .ci/test-chezmoiignore-script-paths.sh already renders
# .chezmoiignore across. Kept identical so the two gates cannot disagree about
# what "every profile" means.
profiles:
  - id: linux-gnome
    os: linux
    desktop: gnome
    container: false
    jetson: false
  - id: linux-kde
    os: linux
    desktop: kde
    container: false
    jetson: false
  - id: linux-headless
    os: linux
    desktop: none
    container: false
    jetson: false
  - id: linux-jetson
    os: linux
    desktop: none
    container: false
    jetson: true
  - id: linux-container
    os: linux
    desktop: none
    container: true
    jetson: false
  - id: macos
    os: darwin
    desktop: none
    container: false
    jetson: false

entries:
  .chezmoi.toml.tmpl: { class: source-internal }
  .chezmoidata: { class: source-internal }
  .chezmoiexternals: { class: source-internal }
  .chezmoiignore: { class: source-internal }
  .chezmoiremove: { class: source-internal }
  .chezmoiscripts: { class: source-internal }
  .chezmoitemplates: { class: source-internal }
  .keys: { class: source-internal }

  # ~/Library/Application Support is the native macOS location for the state
  # dot_config carries on Linux, so this tree deploys there and nowhere else.
  Library: { class: deployed, only_on: [macos] }

  dot_agents: { class: deployed }
  dot_androidrc.tmpl: { class: deployed }
  dot_bunfig.toml: { class: deployed }
  dot_claude: { class: deployed }
  dot_codex: { class: deployed }
  dot_config: { class: deployed }
  dot_default-gems.tmpl: { class: deployed }
  dot_default-python-packages.tmpl: { class: deployed }
  dot_face: { class: deployed }
  dot_local: { class: deployed }
  dot_npmrc: { class: deployed }
  dot_omp: { class: deployed }
  dot_ssh: { class: deployed }
  dot_wakatime.cfg.tmpl: { class: deployed }
  dot_yarnrc.yml: { class: deployed }
  dot_zshenv: { class: deployed }
  private_dot_gnupg: { class: deployed }
  private_readonly_dot_mcp.json.tmpl: { class: deployed }
  remove_dot_gitconfig: { class: deployed }
  symlink_dot_face.icon: { class: deployed }

# Denials for paths a clean checkout does not have. Generated outputs like
# agents.lock and _artifacts sit at the repository root outside the source root,
# so preemptive denials are empty.
preemptive_denials: []
