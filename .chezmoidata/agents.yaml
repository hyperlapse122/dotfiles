        quick:
          model: kimi-for-coding/kimi-for-coding-highspeed
          fallback_models:
            - openai/gpt-5.4-mini-fast
            - anthropic/claude-haiku-4-5
            - google-agy/gemini-3-flash
        unspecified-low:
          model: openai/gpt-5.6-luna
          variant: xhigh
          fallback_models:
            - model: openai/gpt-5.6-luna
              variant: high
            - anthropic/claude-sonnet-4-6
            - model: openai/gpt-5.6-sol
              variant: medium
