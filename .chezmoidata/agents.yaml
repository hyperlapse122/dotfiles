
agents:
  validOS: [linux, darwin]
  mcp:
    servers:
    - name: codegraph
      transport: stdio
      command: codegraph
      args:
      - serve
      - "--mcp"
    - name: glab
      transport: stdio
      command: glab
      args:
      - mcp
      - serve
    - name: agent-browser
      transport: stdio
      command: agent-browser
      args:
      - mcp
      - "--tools"
      - all
    # --no-update-check is load-bearing, not tidiness: started bare the server
    # calls the GitHub API on every launch and appends a
    # `curl … install-mcp.sh | bash` notice to its own MCP instructions, which
    # would advertise an install path around .chezmoidata/releases.json. Same
    # reason Claude Code carries DISABLE_AUTOUPDATER.
    - name: fff
      transport: stdio
      command: fff-mcp
      args:
      - "--no-update-check"
    - name: context7
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: op://tum6wsa7azjvbkgwnp6fgamcvm/Context7/API Key
    - name: mdn
      transport: http
      url: https://mcp.mdn.mozilla.net/
      headers:
        X-Moz-1st-Party-Data-Opt-Out: "1"
    - name: websearch
      transport: http
      url: https://mcp.exa.ai/mcp
      headers:
        x-api-key: op://tum6wsa7azjvbkgwnp6fgamcvm/Exa/API Key
  skills:
    external:
    - name: agent-browser
      source: vercel-labs/agent-browser
    # Google's official android-cli skill. `android init` installs this same
    # skill by writing it into every agent's global skills directory, all of
    # which are the chezmoi-managed ~/.agents/skills tree behind a symlink, and
    # it overwrites what is there without asking -- so the SDK script no longer
    # runs it and the skill is pinned here instead. android/skills files it under
    # devtools/, not the skills/<name> the github branch assumes, hence skillPath.
    - name: android-cli
      source: android/skills
      skillPath: devtools/android-cli
    - name: improve
      source: shadcn/improve
      ref: main
    - name: i-have-adhd
      source: ayghri/i-have-adhd
    - name: composition-patterns
      source: vercel-labs/agent-skills
      ref: main
    - name: react-best-practices
      source: vercel-labs/agent-skills
      ref: main
    - name: react-view-transitions
      source: vercel-labs/agent-skills
      ref: main
    - name: web-design-guidelines
      source: vercel-labs/agent-skills
      ref: main
    - name: writing-guidelines
      source: vercel-labs/agent-skills
      ref: main
    - name: computer-use
      source: stablyai/orca
    - name: linear-tickets
      source: stablyai/orca
    - name: orca-cli
      source: stablyai/orca
    - name: orca-emulator
      source: stablyai/orca
    - name: orca-emulator-android
      source: stablyai/orca
    - name: orca-linear
      source: stablyai/orca
    - name: orca-per-workspace-env
      source: stablyai/orca
    - name: orchestration
      source: stablyai/orca
    - name: glab
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab
    - name: glab-stack
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab-stack
    # cursor/plugins is a monorepo publishing no releases and no tags, so each
    # skill needs both a skillPath for its subtree and a branch ref -- the
    # no-ref branch of .chezmoiexternals/ai-agents.toml expects a release tag.
    # The branch head is unreviewed upstream: the hourly release-lock refresh
    # advances both pins with no human in the loop, the same posture the
    # vercel-labs and shadcn entries above already carry.
    - name: unslop
      source: cursor/plugins
      ref: main
      skillPath: pstack/skills/unslop
    - name: deslop
      source: cursor/plugins
      ref: main
      skillPath: cursor-team-kit/skills/deslop
  marketplaces:
    compound-engineering-plugin:
      kind: localArchive
      source: EveryInc/compound-engineering-plugin
      externalPath: .local/share/compound-engineering
      versionSource: compoundEngineeringRelease
      exclude:
      - "*/skills/ce-sweep/references/interview.md"
      os: [linux, darwin]
      container: keep
    # omp's own copy of the same archive, differing in one file: the ROOT
    # plugin.json is excluded. That file is what makes omp classify the tree as
    # an agent-plugins package and reject every SKILL.md carrying Claude Code or
    # Codex frontmatter keys, dropping 30 of 33 skills (cb30ed4). agy needs the
    # same file present as its bundle manifest, and .ci/test-compound-engineering-overlays.sh
    # asserts it survives, so the two requirements cannot share one copy. The
    # `*/` prefix matches only the archive's own top directory, so nested
    # plugin.json files inside skills are untouched. versionSource is shared, so
    # both copies always resolve the same version segment.
    compound-engineering-omp:
      kind: localArchive
      source: EveryInc/compound-engineering-plugin
      externalPath: .local/share/compound-engineering-omp
      versionSource: compoundEngineeringRelease
      exclude:
      - "*/skills/ce-sweep/references/interview.md"
      - "*/plugin.json"
      os: [linux, darwin]
      container: keep
    # This checkout's own Claude Code plugin. It and dotfiles-codex-plugin below
    # are the two localDir marketplaces:
    # the tree is deployed by chezmoi rather than downloaded, so it needs no
    # source, externalPath or version selector. It exists because a Claude Code
    # hook cannot be declared through agents.claude.settings — hooks belongs to
    # aoe and claude-settings-validate.tmpl rejects any declared path under it at
    # render time. A plugin carries hooks without touching that key.
    #
    # The plugin's own version is derived from its hook tree's content
    # (dot_local/share/dotfiles-claude-plugin/dot_claude-plugin/plugin.json.tmpl),
    # because `plugin install` is a no-op once the plugin is present at ANY
    # version and Claude Code serves the copy under
    # ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>, never the source
    # tree. The same tree is a fingerprint input of the Claude plugin reconciler
    # so the script re-runs at all; both halves are required for an edit to land.
    dotfiles-claude-plugin:
      kind: localDir
      path: .local/share/dotfiles-claude-plugin
      os: [linux, darwin]
      container: keep
    # This checkout's own Codex plugin. Same shape and same reason as the Claude
    # one above: Codex's hooks.json at ~/.codex/hooks.json is written by Orca, so
    # dotfiles composes beside it through a plugin rather than rewriting it.
    # Codex has no local-directory plugin install — a local path enters only as a
    # marketplace — so this row needs the matching
    # dot_agents/plugins/symlink_dotfiles-codex-plugin.tmpl source in the same
    # commit, or the reconciler preflight dies after the instruction targets have
    # already been written.
    #
    # The os/container gates match the Claude entry deliberately: a host that
    # declares the row but has no `codex` on PATH makes the reconciler die.
    dotfiles-codex-plugin:
      kind: localDir
      path: .local/share/dotfiles-codex-plugin
      os: [linux, darwin]
      container: keep
  claude:
    # Claude Code setting VALUES asserted into the live ~/.claude/settings.json by
    # .chezmoiscripts/70-agents/run_after_config-claude-settings.sh.tmpl, validated at
    # render time by .chezmoitemplates/claude-settings-validate.tmpl.
    #
    # Each key is a dot-separated path to a LEAF in settings.json. The reconciler
    # asserts that leaf alone, so sibling keys and the other members of the records
    # above it survive. settings.json is NOT a chezmoi target: Claude Code, aoe, and
    # install-claude-plugins all write it during normal use.
    #
    # Declaring a path makes it authoritative — a UI change to it is reverted on the
    # next apply. Leave a value undeclared to keep it adjustable; theme, editorMode
    # and verbose are deliberately absent for that reason. hooks, enabledPlugins and
    # extraKnownMarketplaces belong to other writers and are rejected at render time.
    #
    # model is declared on purpose. The claude-opus-5 effort stays declared because
    # fast mode runs on Opus.
    #
    # env.DISABLE_AUTOUPDATER is what pins the updater off on macOS, where
    # dot_config/environment.d/ is not deployed; that file carries the same value for
    # Linux. The binary is pinned in .chezmoidata/releases.json and a version bump
    # belongs there. Claude Code writes this same key itself when it migrates the
    # legacy autoUpdates preference, with the same value, so the two converge.
    settings:
      language: Korean
      skipDangerousModePermissionPrompt: true
      model: opus[1m]
      modelSettings.claude-fable-5-1.effortLevel: medium
      modelSettings.claude-opus-5.effortLevel: medium
      inputNeededNotifEnabled: true
      agentPushNotifEnabled: true
      remoteControlAtStartup: false
      # Retention is pinned off so Tokscale keeps aggregating past the 30-day
      # default: this value drives the sweep that deletes ~/.claude/projects
      # transcripts, and a deleted transcript can never be re-aggregated.
      #
      # Unlike the env leaves below, this one MUST render as a JSON number. Quote
      # it and Claude Code rejects the settings file on z.int() and falls back to
      # 30 days; .ci/test-claude-settings-reconcile.sh is what catches that.
      #
      # The cost is unbounded growth. The same cutoff also sweeps ~/.claude's
      # tasks/, shell-snapshots/, backups/ and tool-result files, so none of them
      # shrink again.
      #
      # 9999999999 days is 8.64e17 ms, past the JS Date range, so the cutoff is an
      # Invalid Date and every mtime comparison against it is false. That NaN
      # comparison is what actually stops the deletion, so a Claude Code bump in
      # .chezmoidata/releases.json must be checked for a cutoff-validity guard
      # that would resume it.
      cleanupPeriodDays: 9999999999
      # Values under env reach the tool as strings; an unquoted scalar renders as a
      # JSON number and is ignored. .ci/test-claude-settings-reconcile.sh asserts the
      # type, because the leaf-equality assertion alone cannot see it.
      env.DISABLE_AUTOUPDATER: "1"
    plugins:
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    - { name: dotfiles-claude, marketplace: dotfiles-claude-plugin }
    pluginsRemoved: []
  agy:
    settings: {}
    plugins:
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    pluginsRemoved: []
  omp:
    # The omp-only archive copy, never the shared one: installing the copy that
    # still carries a root plugin.json makes omp drop 30 of 33 skills.
    plugins:
    - { name: compound-engineering, marketplace: compound-engineering-omp }
    pluginsRemoved: []
    # omp config.yml VALUES asserted into the live ~/.omp/agent/config.yml by
    # .chezmoiscripts/70-agents/run_after_config-omp-settings.sh.tmpl.
    #
    # config.yml is NOT a chezmoi target: omp rewrites it through /model,
    # /settings, and first-run setup, so a managed-readonly target produced
    # permanent drift.
    #
    # The declaration is deliberately narrow. Every role runs one model, so a
    # seat's model is predictable without reading a tier table; `tiny` is the
    # single exception, because a background seat on the main model wastes
    # quota that is the scarce resource here. The role NAMES are omp's own
    # schema, so the set is kept whole rather than trimmed.
    #
    # enabledModels and disabledProviders are what actually close the
    # selectable set: pinning role values alone leaves /model free to pick an
    # unapproved provider, and an undeclared key survives the next apply.
    #
    # startup.setupWizard, setupVersion, symbolPreset and the three notification
    # leaves are the non-model exceptions. A first-run wizard blocks
    # non-interactive use and writes
    # config that competes with these assertions. symbolPreset is a glyph-set
    # enum, not a family: `nerd` is safe because .chezmoidata/fonts.yaml
    # installs the Nerd Font archives on every managed host and families.mono
    # is JetBrainsMono Nerd Font, so omp's icons render instead of falling
    # back to boxes.
    settings:
      startup.setupWizard: false
      setupVersion: 1
      symbolPreset: nerd
      # Two presentation keys carried over from the pre-retirement declaration.
      # Both are terminal-side only; neither touches the model or tool surface.
      #
      # tui.resizeScrollback: rebuild redraws the scrollback on a terminal
      # resize instead of leaving reflowed lines broken, which is what a
      # dispatched worker's transcript needs to stay readable after the pane
      # changes width.
      #
      # display.showTokenUsage: true keeps per-turn token usage on screen, the
      # one signal that says a worker is burning quota before its turn ends.
      tui.resizeScrollback: rebuild
      display.showTokenUsage: true
      # Desktop notifications are pinned off. omp runs here only as an
      # orchestration subagent, so a turn-completion popup per worker is noise
      # nobody is watching for.
      #
      # These three are the whole desktop-notification surface of the pinned omp
      # in .chezmoidata/releases.json: its settings schema emits a notification
      # only from a key named `*.notify`, delivered through notify-send/gdbus on
      # Linux and osascript on macOS. The rest of omp's own "Notifications" UI
      # group -- ask.timeout, recap.* -- is a timeout and a terminal recap, not a
      # popup. That enumeration is tied to the pinned version, so an omp bump
      # must re-check whether a new `*.notify` key appeared.
      #
      # error.notify already defaults to off. It is declared anyway because this
      # reconciler leaves an UNDECLARED key alone: a value flipped through
      # /settings would otherwise survive the next apply. Declaring is what pins.
      #
      # The values are enum tokens, not booleans. Quoting is the notation that
      # says so; the guard that actually holds them is the JSON type-and-value
      # check in .ci/test-omp-settings-reconcile.sh, because the parser here
      # (go-yaml v3) already reads unquoted off as the string "off" -- so
      # removing the quotes would change nothing and cannot be a failure case.
      completion.notify: "off"
      error.notify: "off"
      ask.notify: "off"
      # astGrep.enabled is pinned on so omp can run the structural AST search
      # named in .chezmoitemplates/agents-instructions.tmpl.
      #
      # The instruction file names both ast_grep and ast_edit as omp file tools.
      # On the pinned build astEdit.enabled already defaults to true, while
      # astGrep.enabled defaults to false. This key gates only ast_grep.
      astGrep.enabled: true
      # Project-scope skill and command discovery is closed, so a SKILL.md or a
      # .claude/commands/*.md committed to a dispatched checkout cannot reach
      # the agent as a skill or a command. It is NOT a claim that the checkout
      # reaches the agent with nothing: omp still loads a project's own
      # instruction files (AGENTS.md, CLAUDE.md), which the shared instruction
      # core names as the binding local supplement, and no omp setting gates
      # them. Project scope is disabled across every harness omp recognizes:
      # skills.enableAgentsProject, skills.enableClaudeProject,
      # skills.enablePiProject, commands.enableClaudeProject, and
      # commands.enableOpencodeProject.
      #
      # The four user-scope twins (skills.enableClaudeUser,
      # skills.enableCodexUser, commands.enableClaudeUser,
      # commands.enableOpencodeUser) already default to false. They are declared
      # anyway because undeclared keys survive the next apply.
      #
      # The three load-bearing user-scope keys are pinned ON for the same
      # reason. ~/.agents/skills is the managed tree this harness exists to
      # use, and leaving its switches undeclared means one /settings toggle
      # blanks it with no apply that restores it.
      #
      # Cost: this repository's own committed .agents/skills and .claude/skills
      # trees become invisible to an omp worker dispatched here, while claude
      # and codex in the same worktree still read them. The asymmetry is
      # accepted deliberately, because no signal distinguishes a first-party
      # checkout from an arbitrary one at settings-assertion time.
      skills.enableAgentsProject: false
      skills.enableClaudeProject: false
      skills.enablePiProject: false
      commands.enableClaudeProject: false
      commands.enableOpencodeProject: false
      skills.enableClaudeUser: false
      skills.enableCodexUser: false
      commands.enableClaudeUser: false
      commands.enableOpencodeUser: false
      skills.enabled: true
      skills.enableAgentsUser: true
      skills.enablePiUser: true
      enabledModels:
      - google-antigravity/gemini-3.8-flash
      - google-antigravity/gemini-3.1-flash-lite
      disabledProviders:
      - anthropic
      - github-copilot
      - kimi-code
      - openai-codex
      - openrouter
      - zai
      modelRoles:
        advisor: "@worker"
        claude: google-antigravity/gemini-3.8-flash:high
        commit: "@worker"
        default: google-antigravity/gemini-3.8-flash:high
        fable: google-antigravity/gemini-3.8-flash:high
        gemini: google-antigravity/gemini-3.8-flash:high
        plan: "@fable"
        reviewer: google-antigravity/gemini-3.8-flash:high
        skim: google-antigravity/gemini-3.8-flash:high
        slow: google-antigravity/gemini-3.8-flash:high
        smol: google-antigravity/gemini-3.8-flash:high
        tiny: google-antigravity/gemini-3.1-flash-lite:minimal
        worker: google-antigravity/gemini-3.8-flash:high
  codex:
    # Codex CLI config.toml VALUES asserted into the live ~/.codex/config.toml by
    # the codex settings reconciler. Each key is a dot-separated path to a LEAF;
    # the reconciler asserts that leaf alone, so undeclared keys and the other
    # members of the tables above it survive. config.toml is NOT a chezmoi
    # target: Codex writes project trust, `codex mcp add` results, and hook
    # state to it during normal use.
    #
    # settings owns scalar leaves only. mcp_servers, projects, hooks, plugins,
    # and marketplaces belong to other writers (the MCP reconciler, Codex itself,
    # and the plugin reconciler) and must not be declared here.
    #
    # Two of those tables are nonetheless asserted by the reconciler SCRIPT, the
    # way mcp_servers already was: it declares each eligible mcp_servers.<name>
    # table, and exactly one leaf under hooks — the trusted_hash for this
    # checkout's own Codex hook. Codex refuses a third-party plugin hook until a
    # trusted_hash for it exists in the USER config, so without that leaf the
    # hook this repository ships never runs and the failure is silent. Codex
    # writes its own records into the same hooks.state table (8 on the authoring
    # host) and the recursive overlay leaves every one of them untouched. The
    # record attests the hook DECLARATION, not the script or payload it reads.
    #
    # The headless posture below runs `codex exec` unattended inside the
    # workspace sandbox with network access. model and model_reasoning_effort are
    # the operator's chosen pair and are asserted on every apply, so a model or
    # effort switched inside Codex is reverted until this declaration is updated.
    # They are a pinned literal with no upstream tracking: a retired model id is
    # cleared by editing this value and the guard-test literal in
    # .ci/test-codex-settings-reconcile.sh together.
    settings:
      approval_policy: never
      sandbox_mode: workspace-write
      sandbox_workspace_write.network_access: true
      model: gpt-5.6-luna
      model_reasoning_effort: max
    personalMarketplace: dotfiles
    plugins:
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    # The install id is dotfiles-codex@dotfiles — the personal marketplace above,
    # not the registry key. That id is also the first segment of the hook trust
    # key the codex settings reconciler asserts, so renaming either half breaks
    # trust silently: a stale trusted_hash disables the hook exactly like no
    # record at all.
    - { name: dotfiles-codex, marketplace: dotfiles-codex-plugin }
    pluginsRemoved: []
