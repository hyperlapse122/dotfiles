# .chezmoidata/agents.yaml — single source of truth for ALL agent configuration.
#
# Consumer map:
#   agents.pi.models
#     -> managed empty Pi models.json baseline on Linux/macOS workstations
#   agents.mcp.servers
#     -> dotagents (Claude Code + Codex), pi mcp.json, opencode.json,
#        gemini mcp_config.json, kimi-code mcp.json
#   agents.skills.external
#     -> .chezmoiexternals/ai-agents.toml (agent skills fetched as externals)
#   agents.marketplaces + agents.{claude,codex,agy}.plugins
#     -> .chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins.sh
#        (the generic Claude Code + Codex + AGY plugin installer)
#   agents.pi.settings / auth.providers
#     -> managed Pi settings plus package-update and live auth merge scripts
#   agents.claude.settings
#     -> read-merge-write of the live ~/.claude/settings.json (config-claude-settings)
#   agents.opencode.plugins / model / smallModel / providers / ohMyOpenagent
#     -> opencode.json and omo.jsonc ("[opencode]" block)
#   agents.aoe
#     -> ~/.config/agent-of-empires/config.toml, deep-merged by
#        run_after_config-aoe.sh.tmpl via the kimi-reconcile binary
#   agents.omp.settings
#     -> run_after_config-omp-settings.{sh,ps1}.tmpl, which asserts each
#        declared omp settings PATH into the omp-owned ~/.omp/agent/config.yml
#   agents.omp.auth.env
#     -> run_after_config-omp-auth.{sh,ps1}.tmpl, which reconciles the
#        declared credentials in the live ~/.omp/agent/.env
#
# Add or change agent configuration HERE, not in the consuming templates. Those
# templates retain only target-specific FORMAT and live-file merge mechanics.
# haptic.pi remains in haptic.yaml because it is haptic event data, not agent
# configuration.
#
# Secrets: .chezmoidata files are static, so secret values are stored as op://
# reference strings. resolve-op-refs-json.tmpl recursively walks maps, slices,
# and scalars: a string starting exactly with op:// is onepasswordRead-resolved
# at render time; every other value and type passes through unchanged. This is
# field-independent and therefore works for provider options, nested headers,
# MCP headers, and pi auth without secret-key-specific template branches.
#
# Naming: keys owned by this repo use camelCase. Keys below
# agents.opencode.ohMyOpenagent.{agents,categories} and provider definitions are
# upstream schema identifiers and are emitted VERBATIM (for example
# multimodal-looker, fallback_models, tool_call). Never normalize them.
#
# install-dotagents-skills hashes only the unresolved agents.mcp data alongside
# the raw agents.toml template, so an MCP edit re-triggers dotagents without
# coupling pi/OpenCode-only changes to it. Rendered secrets are not
# fingerprinted; secret rotation alone follows each consumer's documented
# onchange behavior.

agents:
  # MCP servers consumed by dotagents, Pi, OpenCode, Gemini, Kimi Code, and omp.
  # `transport` is the discriminator: stdio uses command/args; http uses url plus
  # optional headers. Each consumer maps that neutral shape into its native
  # schema; the managed Kimi mcp.json owns the complete server inventory.
  # `auth: oauth` marks an HTTP server whose credentials belong in each harness's
  # native OAuth store; credentials and refresh tokens never enter source data.
  # Optional applicability is shared across every consumer:
  #   os: [linux, darwin, windows]  (omitted means every OS)
  #   container: keep | skip        (omitted means keep)
  #   harnessSkip: [<harness id>]   (omitted means every harness)
  # harnessSkip is an EXCLUSION list, so a new harness inherits every server
  # unless it is named. Valid ids: claude, codex, opencode, agy, pi, omp, kimi;
  # dot_agents renders one file for Claude AND Codex and identifies as claude,
  # so a codex-only exclusion is not expressible.
  # agent-mcp-servers-json.tmpl validates and filters these fields before any
  # target-specific formatter sees the record.
  mcp:
    servers:
    - name: codegraph
      transport: stdio
      command: codegraph
      args:
      - serve
      - "--mcp"
    - name: glab
      transport: stdio
      command: glab
      args:
      - mcp
      - serve
    - name: agent-browser
      transport: stdio
      command: agent-browser
      args:
      - mcp
      - "--tools"
      - all
    - name: open-design
      transport: stdio
      command: od
      args:
      - mcp
      os:
      - linux
      container: skip
    - name: figma
      transport: http
      url: https://mcp.figma.com/mcp
      auth: oauth
    - name: context7
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: op://Private/Context7/API Key
    - name: websearch
      transport: http
      url: https://mcp.exa.ai/mcp
      headers:
        x-api-key: op://Private/Exa/API Key
      # omp has a native Exa search provider fed by EXA_API_KEY from its dotenv,
      # so the MCP path would duplicate the capability and put the key in a
      # second rendered file. Every other harness keeps this server.
      harnessSkip:
      - omp
  # Agent skills fetched as chezmoi externals into ~/.agents/skills/<name> (the
  # former dotagents remote skills). .chezmoiexternals/ai-agents.toml ranges over
  # this list. Keys per entry:
  #   name          -> target dir under ~/.agents/skills/; for host: github it
  #                    is ALSO the skills/<name>/ subdir inside the source repo.
  #   source        -> owner/repo on the host.
  #   host          -> github (default): whole-skill archive external extracted
  #                    from the repo tarball. gitlab: raw single-file external
  #                    fetching <skillPath>/SKILL.md — correct when a skill
  #                    subtree is exactly one SKILL.md (glab's bundled skills);
  #                    a subtree that gains sibling files must switch to an
  #                    archive form.
  #   ref           -> (github only) a branch head resolved to a commit sha in
  #                    the release lock at refresh time (repos with no
  #                    releases/tags); absent -> newest GitHub release tag
  #                    recorded in the release lock.
  #   versionSource -> glabRelease: ref from the shared
  #                    .chezmoitemplates/glab-release-ref.tmpl (the glab CLI's
  #                    latest release, lockstep with the vcs.toml binary).
  #                    Mutually exclusive with ref; unknown values fail.
  #   skillPath     -> (gitlab only) repo-internal directory holding SKILL.md.
  # There are no dotagents `path:` skills any more; `agents.toml` declares MCP
  # servers only. User-scoped skills reach ~/.agents/skills/<name> two ways:
  # (a) these chezmoi externals (GitHub archives, or GitLab raw files for
  # glab's bundled skills), and (b) locally-authored personal skills managed
  # directly as chezmoi source under dot_agents/skills/<name>/ (e.g.
  # daily-report) — not listed here.
  skills:
    external:
    - name: playwright-cli
      source: microsoft/playwright-cli
    - name: agent-browser
      source: vercel-labs/agent-browser
    - name: improve
      source: shadcn/improve
      ref: main
    - name: glab
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab
    - name: glab-stack
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab-stack
  # Claude Code, Codex, and AGY plugins, single-sourced here (the Claude/Codex
  # declarations were previously
  # hardcoded across two install scripts). The generic runner
  # run_onchange_after_install-agent-plugins.sh.tmpl ranges over the per-agent
  # `plugins` lists below and, per entry, registers the marketplace and installs
  # the plugin with the matching CLI (`claude` / `codex` / `agy`). AGY consumes
  # the resolved source directly with its native plugin installer rather than
  # registering a marketplace. MCP is single-sourced
  # separately (agents.mcp.servers -> dotagents); plugins are per-agent because
  # applicability differs (mxm4-haptic ships to Claude, Codex, AND AGY — each as its
  # own plugin with the right hook shape; the official LSP plugins are Claude-only).
  #
  # `marketplaces` is the shared registry keyed by each marketplace's registered
  # name (matching its .claude-plugin/marketplace.json `name`). Gating and kind
  # belong to the MARKETPLACE, not the plugin, so compound-engineering — which
  # appears in both per-agent lists — declares them once here:
  #   - kind: how the installer resolves the marketplace source path.
  #       localDir      -> $HOME/<path> (a directory referenced in place).
  #       localArchive  -> the versioned tree chezmoi extracts from a GitHub
  #                        release; the path is NOT stored here. The installer
  #                        single-sources it from the compound-engineering entry
  #                        in agents.opencode.plugins (externalPath) plus the
  #                        version from compound-engineering-ref.tmpl. No
  #                        version or path literal is copied into a per-agent
  #                        entry (R3/KTD2).
  #       github        -> a remote owner/repo marketplace the CLI fetches (no
  #                        local tree); the `source` (owner/repo) is stored here.
  #                        Constant source, so add + install with no `remove`.
  #   - os: the OSes the marketplace applies to. The runner emits a plugin row
  #     only when .chezmoi.os is in this list (render-time gate, KTD3).
  #   - container: `skip` filters the row out when the `container` fact is true
  #     (mxm4-haptic has nothing to pulse in a container); `keep` leaves it in
  #     (compound-engineering skills are wanted in a devbox too). This replaces
  #     the former whole-script .chezmoiignore container exclusion — same net
  #     behavior, decided per row at render time.
  marketplaces:
    dotfiles:
      kind: localDir
      path: .local/share/claude-plugins   # relative to $HOME
      os: [linux]
      container: skip
    dotfiles-codex:
      kind: localDir
      path: .local/share/codex-plugins    # relative to $HOME; codex reads its .claude-plugin/marketplace.json
      os: [linux]
      container: skip
    dotfiles-agy:
      kind: localDir
      path: .local/share/agy-plugins/mxm4-haptic   # agy installs THIS bundle root directly (no marketplace.json)
      os: [linux]
      container: skip
    compound-engineering-plugin:
      kind: localArchive                   # path from the opencode CE entry + ref
      os: [linux, darwin]
      container: keep
    claude-plugins-official:
      kind: github                         # anthropics' official plugin marketplace
      source: anthropics/claude-plugins-official
      os: [linux, darwin]
      container: keep
  # `agents.claude` carries two independent things: `settings` (Claude Code
  # setting VALUES, read-merge-written into the live settings.json by
  # config-claude-settings) and `plugins` (registered by install-agent-plugins,
  # see the marketplaces comment above). They share no mechanism beyond the key.
  claude:
    # Claude Code settings VALUES (not capabilities) merged into the live
    # ~/.claude/settings.json by
    # .chezmoiscripts/70-agents/run_onchange_after_config-claude-settings.sh.tmpl.
    # settings.json is NOT a chezmoi-managed target — Claude Code live-writes it
    # (theme, effortLevel, tui), aoe injects session-tracking hooks, and `claude
    # plugin install` writes enabledPlugins/extraKnownMarketplaces — so this is a
    # read-merge-WRITE (top-level jq `+`) that (re)asserts ONLY the keys below and
    # preserves every other key byte-identical, the same shape config-pi-auth uses
    # for pi's live-written auth.json. AGENTS.md "Claude Code plugins" carves this
    # out from the "ship a plugin, not settings" rule: a plugin registers
    # hooks/commands but cannot set a settings VALUE like effortLevel.
    #
    # No secrets, so the rendered values are baked straight into the script as its
    # onchange trigger (no resolve-op-refs-json.tmpl, no fingerprint block): editing
    # a value here re-runs the merge on the next apply. Always-assert, no
    # value-signature stamp — a `/effort` or `/model` UI change to an UNCHANGED
    # value is NOT reverted by a routine apply (the standard onchange trade-off),
    # but a data edit or `chezmoi apply --force` re-asserts it. Keys must match
    # Claude Code's settings.json schema; values are seeded from this host today.
    settings:
      # Reasoning effort tier.
      effortLevel: xhigh
      # Quoted so YAML does not read the `[1m]` suffix as a flow sequence.
      model: "opus[1m]"
      # Auto-skip the bypass/dangerous-mode confirmation. Undocumented in Claude's
      # public settings schema but present in the live file; renders on EVERY host
      # — scope per-host if any host should keep the confirmation guardrail.
      skipDangerousModePermissionPrompt: true
      disableClaudeAiConnectors: true
    # Plugins for Claude Code, registered by the generic install-agent-plugins
    # runner (marketplace + kind + gating live in `marketplaces` above).
    plugins:
    - { name: mxm4-haptic, marketplace: dotfiles }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    - { name: frontend-design, marketplace: claude-plugins-official }
    - { name: rust-analyzer-lsp, marketplace: claude-plugins-official }
    - { name: typescript-lsp, marketplace: claude-plugins-official }
    - { name: csharp-lsp, marketplace: claude-plugins-official }
  codex:
    plugins:
    # mxm4-haptic: codex plugin with a hooks/hooks.json (Stop -> settled,
    # PermissionRequest -> question); merges with the aoe-managed ~/.codex/hooks.json.
    - { name: mxm4-haptic, marketplace: dotfiles-codex }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
  agy:
    # AGY installs the native bundle from the same pinned release root consumed
    # by the other localArchive agents; do not replace this with the unpinned
    # GitHub URL or the compatibility-only `.agy/` subdirectory.
    plugins:
    # mxm4-haptic: agy plugin with a ROOT hooks.json (Stop -> settled/failed via
    # terminationReason+fullyIdle; PreToolUse ask_question -> question, always-allow).
    - { name: mxm4-haptic, marketplace: dotfiles-agy }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
  kimi:
    # Apply selectively owns only the declared leaves in these native TOML
    # files. The reconciler preserves every undeclared semantic value; comments
    # and formatting are not an ownership boundary. mcp.json is different: it
    # is rendered wholesale from agents.mcp.servers. Figma OAuth remains an
    # explicit `figma-auth kimi` action and stays in Kimi's native credential
    # store. Apply also owns only compound-engineering's installed record and
    # managed copy, preserving all unrelated plugins.
    settings:
      config.toml:
        default_model: 'kimi-code/k3-256k'
        default_permission_mode: yolo
        thinking:
          enabled: true
          effort: high
      tui.toml:
        upgrade:
          auto_install: false
    plugins:
    - name: compound-engineering
      versionSource: compoundEngineeringRelease
  # aoe (agent-of-empires) launches custom agents declared here. Apply
  # reconciles ONLY these declared leaves into aoe's live global
  # ~/.config/agent-of-empires/config.toml via the existing kimi-reconcile
  # binary (run_after_config-aoe.sh.tmpl), preserving every undeclared key aoe
  # writes there itself. Each custom_agents.<name> value is the command aoe runs
  # for that agent; the invoker replaces `~/` with the home dir in the emitted
  # JSON, so a leading-~/ wrapper path is expanded to absolute while a bare
  # command name (no ~/) passes through verbatim. agent_detect_as.<name> tells
  # aoe which known agent's launch flags to emit; a name absent from that map is
  # launched with no injected flag.
  #   - kimi: the off-PATH wrapper (~/.local/libexec/aoe-bin/kimi), expanded to
  #     an absolute path at render time, that rewrites aoe's
  #     --dangerously-skip-permissions into kimi's --yolo. agent_detect_as.kimi =
  #     claude makes aoe emit that claude-style flag for the wrapper to translate.
  #   - zsh: the bare `zsh` command (resolved on PATH, no wrapper, no ~/ to
  #     expand), with NO agent_detect_as entry, so aoe injects no flag and runs a
  #     plain interactive shell. Registered ahead of use — the intent is to later
  #     point aoe's default sessions (e.g. default-branch worktrees) at this
  #     plain-shell agent instead of a coding agent; that default wiring is not
  #     done here yet.
  aoe:
    config.toml:
      session:
        custom_agents:
          kimi: "~/.local/libexec/aoe-bin/kimi"
          omp: omp
          'claude-glm': "claude-glm"
          # Bare on-PATH shell agent; key is the aoe agent name, value the command.
          zsh: zsh
        agent_detect_as:
          kimi: claude
          omp: pi
          claude-glm: claude
  # pi package sources, managed settings defaults, and static API-key auth.
  # settings.json is a MANAGED READONLY target (private_readonly_ 0400); only
  # auth.json stays live-written (for OAuth refresh). See AGENTS.md "pi —
  # settings.json managed readonly" for the full model.
  pi:
    # Keep Pi on its built-in direct provider catalog. This explicit empty map
    # preserves models.json as a direct-provider baseline. It MUST NOT contain
    # `op://` refs because models.json deploys 0444 without secret resolution.
    models:
      providers: {}
    # Everything under `settings` renders wholesale into the MANAGED, READONLY
    # ~/.pi/agent/settings.json (dot_pi/agent/private_readonly_settings.json.tmpl),
    # so the keys intentionally match pi's settings.json schema. pi can no longer
    # write that file (deployed 0400, owner-read-only — tighter than opencode.json's
    # 0444 since op:// refs may bake secrets here), so every value pi used to
    # live-manage lives HERE instead. The provider/model must already be usable
    # through Pi's built-in catalog and live auth.json. Anthropic OAuth uses the
    # native `/login anthropic` flow plus the compatibility package declared
    # below; the separate models block intentionally adds no provider override.
    settings:
      # `packages` is emitted VERBATIM into the managed settings.json (deepCopy
      # in dot_pi/agent/private_readonly_settings.json.tmpl) AND ranged over by
      # run_onchange_after_update-pi-extensions.sh.tmpl, which reconciles
      # installed extensions via `pi update --extensions` (NOT `pi install` —
      # that would write to the readonly settings). pi loads exactly what is
      # listed here straight from settings.json; the script never passes the
      # list to the command — instead it resolves each entry to its latest
      # version/reference at render time and bakes it into comment lines as the
      # onchange trigger (resolve-and-bake, like compound-engineering-ref.tmpl),
      # so a new upstream release re-runs the update. Unpinned by design (npm:
      # and git: both track latest) — the same unsettled trade-off the agent-skill
      # externals make.
      #   - @gotgenes/pi-anthropic-auth: preserves Pi's built-in Anthropic
      #     provider and native login while shaping Claude Pro/Max OAuth calls.
      #   - pi-mcp-extension: the MCP client (pi ships no MCP support of its
      #     own; without it the servers in ~/.pi/agent/mcp.json are inert).
      #   - pi-subagents: delegates work to builtin/custom subagents.
      #   - pi-ask-user: supplies the ask_user tool.
      #   - @ff-labs/pi-fff + @ff-labs/fff-bun: FFF-backed fuzzy file/content
      #     search and its Bun implementation.
      # compound-engineering is installed for pi as a NATIVE `git:` source, NOT
      # via the versioned local-archive path Claude/Codex/OpenCode/AGY use. That is
      # a deliberate divergence for now: pi tracks the repo's default branch
      # (unpinned) instead of the extracted release tarball, so it does NOT
      # consume compound-engineering-ref.tmpl or the localArchive machinery.
      packages:
      - npm:@gotgenes/pi-anthropic-auth
      - npm:pi-mcp-extension
      - npm:pi-subagents
      - npm:pi-ask-user
      - npm:@ff-labs/pi-fff
      - npm:@ff-labs/fff-bun
      - git:github.com/EveryInc/compound-engineering-plugin
      # `theme` is declared here because pi can no longer persist a theme choice
      # to a readonly settings.json — it is fixed to the default.
      theme: dark
      defaultProvider: zai
      defaultModel: glm-5.2
      # Valid: off | minimal | low | medium | high | xhigh | max.
      defaultThinkingLevel: max
      subagents:
        defaultModel: gpt-5.6-terra
        agentOverrides:
          researcher:
            model: gpt-5.6-luna
          planner:
            model: gpt-5.6-sol
            thinking: xhigh
          worker:
            model: gpt-5.6-luna
          reviewer:
            model: gpt-5.6-sol
            thinking: xhigh
          context-builder:
            model: gpt-5.6-sol
          oracle:
            model: gpt-5.6-sol
            thinking: max
          delegate:
            model: gpt-5.6-luna
      warnings:
        anthropicExtraUsage: false
    auth:
      providers:
      - name: kimi-coding
        type: api_key
        key: op://Private/Kimi/API Key
      - name: zai
        type: api_key
        key: op://Private/Z.ai/API Key
  # oh-my-pi (can1357/oh-my-pi) — a fork of pi (badlogic/pi-mono).
  #
  # config.yml is NOT a chezmoi target. omp rewrites it itself through /model,
  # /settings, and first-run setup, so a managed-readonly target produced
  # permanent drift (a deployed 0600 file holding a modelRoles.default present
  # in no source checkout). Instead `run_after_config-omp-settings` asserts each
  # declared PATH below on every apply and leaves everything else to omp. Unlike
  # pi, omp has NO auth.json — OAuth credentials (anthropic, openai-codex,
  # google-antigravity, kimi-code) live in ~/.omp/agent/agent.db via omp /login,
  # so only static API keys are declared here. omp is batteries-included (built-in
  # MCP runtime, native Anthropic OAuth), so the pi pi-mcp-extension and
  # @gotgenes/pi-anthropic-auth packages are NOT carried; compound-engineering is
  # delivered via omp's marketplace, so this settings block carries no `packages`
  # key. omp is cross-platform (it ships omp-windows-x64.exe), so both the
  # settings and auth provisioners have Windows counterparts.
  omp:
    models:
      providers: {}
    # Every key below is a LITERAL omp settings path as `omp config list` spells
    # it — this is a flat path->value map, NOT a nested config.yml document. The
    # provisioner runs one `omp config set <path> <json>` per entry, because a
    # path inside a record (modelRoles.default) is not settable while a record
    # itself (modelRoles) is, and `theme` is the reverse: only theme.dark and
    # theme.light are real paths. Consequences: a record-typed path is owned
    # WHOLESALE, so an omp-written member inside it does not survive an apply,
    # while any path omp writes BESIDE this set is preserved byte-identical.
    # Values must never contain an op:// reference — the CLI receives them as
    # process arguments, so declared settings are credential-free by contract
    # and secrets reach omp through auth.env below.
    #
    # Model policy: a model selector is named on a role, and a subagent that
    # needs an already-named model points at that role with a "@role" alias
    # (quoted so YAML does not read it as a tag) rather than repeating the id.
    # Retuning a role therefore propagates to its referents. Placement spreads
    # the coding loop, deliberation, vision, and mechanical bulk across four
    # authenticated coding plans so one quota wall is not a full stop. No
    # provider/* chain is declared: a provider wildcard outranks the role chain
    # by specificity, and google-antigravity serves no claude-opus-5 or
    # claude-fable-5 id, so such a chain would preempt these provider-diverse
    # chains with hops that may all be skipped.
    settings:
      modelRoles:
        default: anthropic/claude-opus-5:xhigh      # main coding and editing loop
        slow: openai-codex/gpt-5.6-sol:xhigh        # deliberation ceiling
        plan: anthropic/claude-fable-5:xhigh        # planning against a 1M context
        designer: anthropic/claude-opus-5:high      # UI and visual work
        vision: google-antigravity/gemini-3.1-pro   # image input
        advisor: openai-codex/gpt-5.6-terra:high    # turn review; runtime stays off
        task: anthropic/claude-sonnet-4-6           # default subagent
        smol: openai-codex/gpt-5.4-mini             # cheap floor that still follows tools
        tiny: google-antigravity/gemini-3.1-flash-lite  # titles, memory, background
        commit: "@smol"                             # commit messages
      # Bundled agents only. `task` is absent on purpose: it inherits the task
      # role, and `scout` is absent for the same reason plus a measured one: on
      # this host every compound-engineering persona - code review, doc review,
      # simplification - is dispatched as agent type `scout`, so pinning it to the
      # cheap floor would quietly demote deep-judgment work rather than bill an
      # explorer correctly. `librarian` keeps the floor because its job really is
      # narrow lookup. `designer` binds the agent to the same-named role so the
      # two cannot drift. `sonic` is the one model no role names.
      task.agentModelOverrides:
        librarian: "@smol"
        reviewer: "@advisor"
        designer: "@designer"
        sonic: anthropic/claude-haiku-4-5
      task.showResolvedModelBadge: true
      retry.usageAwareFallback: true
      # Keyed by role only. The default chain covers every role without its own,
      # including the roles the aliased overrides and `sonic` resolve to.
      retry.fallbackChains:
        default:
        - openai-codex/gpt-5.6-sol:high
        - kimi-code/k3
        - zai/glm-5.2
        smol:
        - google-antigravity/gemini-3.6-flash
        - zai/glm-4.7-flash
        tiny:
        - google-antigravity/gemini-3.6-flash
        - zai/glm-4.7-flash
      # Exa first; unlisted providers keep their built-in relative order after
      # it. The deep-research surfaces are pinned off rather than left to a
      # default that could change upstream.
      providers.webSearchOrder:
      - exa
      exa.enabled: true
      exa.enableSearch: true
      exa.enableResearcher: false
      exa.enableWebsets: false
      theme.dark: titanium
      theme.light: light
      symbolPreset: nerd
      setupVersion: 1
      defaultThinkingLevel: xhigh
    # Static API keys omp reads from its dotenv. OAuth credentials (anthropic,
    # openai-codex, google-antigravity, kimi-code) live in ~/.omp/agent/agent.db
    # via omp /login and are never declared here. This is a TOOL/PROVIDER
    # CREDENTIAL map keyed by environment variable, deliberately not the
    # model-provider `auth.providers` shape pi uses — Exa is a search tool, not a
    # model provider. run_after_config-omp-auth requires exactly this closed set:
    # a shape-only check would let a data edit inject an arbitrary variable such
    # as HTTP_PROXY or NODE_OPTIONS into the environment omp loads for every
    # session, and dropping the cardinality check would let an emptied map
    # silently delete a key.
    auth:
      env:
      - variable: ZAI_API_KEY
        key: op://Private/Z.ai/API Key
      - variable: EXA_API_KEY
        key: op://Private/Exa/API Key
  # OpenCode defaults, full provider definitions, and oh-my-openagent mappings.
  # Provider shapes are deliberately heterogeneous and emitted recursively.
  opencode:
    # Plugin versions resolve at render time. `latestTag` strips a leading `v`
    # from the newest GitHub tag before producing an exact npm spec.
    # `npmLatest` reads the latest version straight from the npm registry
    # (registry.npmjs.org/<pkg>/latest) for a package with no public GitHub repo
    # to tag against; `source` is therefore omitted for those entries.
    # compound-engineering uses its filtered release train because that repo
    # interleaves unrelated marketplace/CLI tags.
    #
    # Install forms:
    #   npm          -> `<pkg>@<version>` (opencode-only plugin)
    #   localArchive -> Chezmoi extracts the GitHub release tarball to
    #                   `~/<externalPath>/v<version>/` via
    #                   .chezmoiexternals/ai-agents.toml; every agent then
    #                   references that fully-rendered versioned path.
    #                   OpenCode gets it in its `plugin` array via
    #                   opencode-plugins-json.tmpl; Claude Code / Codex are
    #                   registered by the generic
    #                   .chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins
    #                   which points each agent's plugin marketplace at the same
    #                   versioned path (pi installs CE as a git: source).
    #                   `externalPath`
    #                   is required; the version segment (`v<version>`) is
    #                   appended by each consumer.
    plugins:
    - package: oh-my-openagent
      source: code-yeongyu/oh-my-openagent
      install: npm
      versionSource: latestTag
      targets:
        opencode: [""]
        tui: ["/tui", ""]
    - package: opencode-wakatime
      source: angristan/opencode-wakatime
      install: npm
      versionSource: latestTag
      targets:
        opencode: [""]
    - package: "@ex-machina/opencode-anthropic-auth"
      source: ex-machina-co/opencode-anthropic-auth
      install: npm
      versionSource: latestTag
      targets:
        opencode: [""]
    - package: "@oyng/opencode-agy-auth"
      install: npm
      versionSource: npmLatest
      targets:
        opencode: [""]
    - package: compound-engineering
      source: EveryInc/compound-engineering-plugin
      install: localArchive
      versionSource: compoundEngineeringRelease
      externalPath: .local/share/compound-engineering
      targets:
        opencode: [""]
    model: anthropic/claude-opus-4-7
    smallModel: anthropic/claude-haiku-4-5
    providers:
      opencode:
        options:
          apiKey: op://Private/Opencode/API Key
        whitelist:
        - deepseek-v4-flash-free
        - mimo-v2.5-free
        - nemotron-3-ultra-free
        - north-mini-code-free
        - big-pickle
      zai-coding-plan:
        options:
          apiKey: "op://Private/Z.ai/API Key"
      kimi-for-coding:
        options:
          apiKey: "op://Private/Kimi/API Key"
      openrouter:
        options:
          apiKey: op://Private/OpenRouter/API Key
          headers:
            HTTP-Referer: https://opencode.ai/
            X-OpenRouter-Title: OpenCode
            X-OpenRouter-Categories: cli-agent
        models:
          openrouter/free:
            name: Free Models Router
            cost:
              input: 0
              output: 0
              cache_read: 0
              cache_write: 0
          openrouter/auto: {}
          openrouter/fusion: {}
        whitelist:
        - openrouter/free
        - openrouter/auto
        - openrouter/fusion
    # Upstream oh-my-openagent identifiers below are verbatim schema keys.
    ohMyOpenagent:
      # Per-agent mappings (omo.jsonc "[opencode]" agents).
      # Model Mapping Reference:
      # https://github.com/code-yeongyu/oh-my-openagent/blob/dev/packages/model-core/src/agent-model-requirements.ts
      agents:
        sisyphus:
          model: anthropic/claude-opus-5
          variant: max
          fallback_models:
            - kimi-for-coding/k3
            - model: openai/gpt-5.6-sol
              variant: medium
            - zai-coding-plan/glm-5.1
        hephaestus:
          model: openai/gpt-5.6-sol
          variant: medium
        oracle:
          model: openai/gpt-5.6-sol
          variant: xhigh
          fallback_models:
            - model: openai/gpt-5.6-sol
              variant: high
            - model: google-agy/gemini-pro-agent
              variant: high
            - model: anthropic/claude-opus-5
              variant: max
            - zai-coding-plan/glm-5.2
        librarian:
          model: openai/gpt-5.4-mini-fast
          fallback_models:
            - anthropic/claude-haiku-4-5
        explore:
          model: openai/gpt-5.4-mini-fast
          fallback_models:
            - anthropic/claude-haiku-4-5
        multimodal-looker:
          model: openai/gpt-5.6-sol
          variant: low
          fallback_models:
            - kimi-for-coding/k3
        prometheus:
          model: anthropic/claude-fable-5
          variant: xhigh
          fallback_models:
            - model: kimi-for-coding/k3
              variant: max
        metis:
          model: anthropic/claude-opus-5
          variant: high
          fallback_models:
            - model: kimi-for-coding/k3
              variant: low
        momus:
          model: openai/gpt-5.6-terra
          variant: high
          fallback_models:
            - model: openai/gpt-5.6-sol
              variant: xhigh
            - model: openai/gpt-5.6-sol
              variant: high
            - model: anthropic/claude-opus-5
              variant: max
            - model: google-agy/gemini-pro-agent
              variant: high
            - zai-coding-plan/glm-5.2
        atlas:
          model: anthropic/claude-sonnet-4-6
          fallback_models:
            - kimi-for-coding/k3
            - model: openai/gpt-5.6-sol
              variant: medium
        sisyphus-junior:
          model: anthropic/claude-sonnet-4-6
          fallback_models:
            - kimi-for-coding/k3
            - model: openai/gpt-5.6-sol
              variant: medium
      # Per-category mappings (omo.jsonc "[opencode]" categories).
      # Model Mapping Reference:
      # https://github.com/code-yeongyu/oh-my-openagent/blob/dev/packages/model-core/src/category-model-requirements.ts
      categories:
