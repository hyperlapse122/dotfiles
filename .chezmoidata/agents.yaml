# .chezmoidata/agents.yaml — single source of truth for ALL agent configuration.
#
# Consumer map:
#   agents.mcp.servers
#     -> dotagents (Claude Code + Codex) and omp mcp.json
#   agents.skills.external
#     -> .chezmoiexternals/ai-agents.toml (agent skills fetched as externals)
#   agents.marketplaces + agents.{claude,codex}.plugins
#     -> .chezmoiscripts/70-agents/run_onchange_after_install-agent-plugins.sh
#        (the generic Claude Code + Codex plugin installer)
#   agents.claude.settings
#     -> read-merge-write of the live ~/.claude/settings.json (config-claude-settings)
#   agents.aoe
#     -> ~/.config/agent-of-empires/config.toml, deep-merged by
#        run_after_config-aoe.sh.tmpl via the kimi-reconcile binary
#   agents.omp.settings
#     -> run_after_config-omp-settings.{sh,ps1}.tmpl, which asserts each
#        declared omp settings PATH into the omp-owned ~/.omp/agent/config.yml
#   agents.omp.auth.env
#     -> run_after_config-omp-auth.{sh,ps1}.tmpl, which reconciles the
#        declared credentials in the live ~/.omp/agent/.env
#
# Add or change agent configuration HERE, not in the consuming templates. Those
# templates retain only target-specific FORMAT and live-file merge mechanics.
#
# Secrets: .chezmoidata files are static, so secret values are stored as op://
# reference strings. resolve-op-refs-json.tmpl recursively walks maps, slices,
# and scalars: a string starting exactly with op:// is onepasswordRead-resolved
# at render time; every other value and type passes through unchanged. This is
# field-independent and therefore works for provider options, nested headers,
# and MCP headers without secret-key-specific template branches.
#
# install-dotagents-skills hashes only the unresolved agents.mcp data alongside
# the raw agents.toml template, so an MCP edit re-triggers dotagents without
# coupling other harness-only changes to it. Rendered secrets are not
# fingerprinted; secret rotation alone follows each consumer's documented
# onchange behavior.

agents:
  # MCP servers consumed by dotagents (Claude Code + Codex) and omp.
  # `transport` is the discriminator: stdio uses command/args; http uses url plus
  # optional headers. Each consumer maps that neutral shape into its native
  # schema.
  # `auth: oauth` marks an HTTP server whose credentials belong in each harness's
  # native OAuth store; credentials and refresh tokens never enter source data.
  # Optional applicability is shared across every consumer:
  #   os: [linux, darwin, windows]  (omitted means every OS)
  #   container: keep | skip        (omitted means keep)
  #   harnessSkip: [<harness id>]   (omitted means every harness)
  # harnessSkip is an EXCLUSION list, so a new harness inherits every server
  # unless it is named. Valid ids: claude, codex, omp;
  # dot_agents renders one file for Claude AND Codex and identifies as claude,
  # so a codex-only exclusion is not expressible.
  # agent-mcp-servers-json.tmpl validates and filters these fields before any
  # target-specific formatter sees the record.
  mcp:
    servers:
    - name: codegraph
      transport: stdio
      command: codegraph
      args:
      - serve
      - "--mcp"
    - name: glab
      transport: stdio
      command: glab
      args:
      - mcp
      - serve
    - name: agent-browser
      transport: stdio
      command: agent-browser
      args:
      - mcp
      - "--tools"
      - all
    - name: open-design
      transport: stdio
      command: od
      args:
      - mcp
      os:
      - linux
      container: skip
    - name: figma
      transport: http
      url: https://mcp.figma.com/mcp
      auth: oauth
    - name: context7
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: op://Private/Context7/API Key
    - name: websearch
      transport: http
      url: https://mcp.exa.ai/mcp
      headers:
        x-api-key: op://Private/Exa/API Key
      # omp has a native Exa search provider fed by EXA_API_KEY from its dotenv,
      # so the MCP path would duplicate the capability and put the key in a
      # second rendered file. Every other harness keeps this server.
      harnessSkip:
      - omp
  # Agent skills installed under ~/.agents/skills. `external` carries the
  # existing independently versioned skills. `collections` carries immutable
  # multi-skill sources whose revision and inventory live only in the generated
  # release lock.
  #
  # A collection row is static policy:
  #   source             -> immutable archive repository
  #   lockKey            -> typed githubSkillCollection entry in releases.json
  #   stagingPath        -> exact, Figma-only external tree consumed by reconcilers
  #   ownershipStatePath -> private ledger used to remove only formerly owned skills
  # The hourly refresh updates lock metadata automatically. The generated diff is
  # review-visible audit/reproducibility evidence, not an approval gate.
  skills:
    collections:
      figma:
        source: figma/mcp-server-guide
        lockKey: figma/mcp-server-guide
        stagingPath: .local/share/figma-skills-stage
        ownershipStatePath: .local/state/figma-skills/ownership.json
    # Existing individually versioned externals. For host: github, `name` is
    # also the skills/<name>/ subtree in the source repository. GitLab entries
    # fetch one declared SKILL.md from `skillPath`.
    external:
    - name: agent-browser
      source: vercel-labs/agent-browser
    - name: improve
      source: shadcn/improve
      ref: main
    - name: glab
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab
    - name: glab-stack
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab-stack
  # Claude Code and Codex plugins, single-sourced here (the Claude/Codex
  # declarations were previously
  # hardcoded across two install scripts). The generic runner
  # run_onchange_after_install-agent-plugins.sh.tmpl ranges over the per-agent
  # `plugins` lists below and, per entry, registers the marketplace and installs
  # the plugin with the matching CLI (`claude` / `codex`). MCP is single-sourced
  # separately (agents.mcp.servers -> dotagents); plugins are per-agent because
  # applicability differs (mxm4-haptic ships to Claude AND Codex — each as its
  # own plugin with the right hook shape; the official LSP plugins are Claude-only).
  #
  # `marketplaces` is the shared registry keyed by each marketplace's registered
  # name (matching its .claude-plugin/marketplace.json `name`). Gating and kind
  # belong to the MARKETPLACE, not the plugin, so compound-engineering — which
  # appears in both per-agent lists — declares them once here:
  #   - kind: how the installer resolves the marketplace source path.
  #       localArchive  -> the versioned tree chezmoi extracts from a GitHub
  #                        release. `source`, `externalPath`, and
  #                        `versionSource` live on the marketplace row because
  #                        the archive is shared by Claude, Codex, and omp.
  #                        Per-agent plugin entries name only the marketplace.
  #       github        -> a remote owner/repo marketplace the CLI fetches (no
  #                        local tree); the `source` (owner/repo) is stored here.
  #                        Constant source, so add + install with no `remove`.
  #   - os: the OSes where the generic Claude/Codex installer emits a plugin
  #     row. Platform-neutral archive and omp consumers read the named row
  #     independently, including on Windows.
  #   - container: `skip` filters the row out when the `container` fact is true
  #     (mxm4-haptic has nothing to pulse in a container); `keep` leaves it in
  #     (compound-engineering skills are wanted in a devbox too). This replaces
  #     the former whole-script .chezmoiignore container exclusion — same net
  #     behavior, decided per row at render time.
  marketplaces:
    dotfiles:
      kind: localDir
      path: .local/share/claude-plugins   # relative to $HOME
      os: [linux]
      container: skip
    dotfiles-codex:
      kind: localDir
      path: .local/share/codex-plugins    # relative to $HOME; codex reads its .claude-plugin/marketplace.json
      os: [linux]
      container: skip
    h82-dotfiles:
      kind: localDir
      path: .local/share/omp-plugins     # relative to $HOME; OMP-native catalog
      os: [linux, darwin, windows]
      container: skip
    compound-engineering-plugin:
      kind: localArchive
      source: EveryInc/compound-engineering-plugin
      externalPath: .local/share/compound-engineering
      versionSource: compoundEngineeringRelease
      os: [linux, darwin]
      container: keep
    claude-plugins-official:
      kind: github                         # anthropics' official plugin marketplace
      source: anthropics/claude-plugins-official
      os: [linux, darwin]
      container: keep
  # `agents.claude` carries two independent things: `settings` (Claude Code
  # setting VALUES, read-merge-written into the live settings.json by
  # config-claude-settings) and `plugins` (registered by install-agent-plugins,
  # see the marketplaces comment above). They share no mechanism beyond the key.
  claude:
    # Claude Code settings VALUES (not capabilities) merged into the live
    # ~/.claude/settings.json by
    # .chezmoiscripts/70-agents/run_onchange_after_config-claude-settings.sh.tmpl.
    # settings.json is NOT a chezmoi-managed target — Claude Code live-writes it
    # (theme, effortLevel, tui), aoe injects session-tracking hooks, and `claude
    # plugin install` writes enabledPlugins/extraKnownMarketplaces — so this is a
    # read-merge-WRITE (top-level jq `+`) that (re)asserts ONLY the keys below and
    # preserves every other key byte-identical. AGENTS.md "Claude Code plugins" carves this
    # out from the "ship a plugin, not settings" rule: a plugin registers
    # hooks/commands but cannot set a settings VALUE like effortLevel.
    #
    # No secrets, so the rendered values are baked straight into the script as its
    # onchange trigger (no resolve-op-refs-json.tmpl, no fingerprint block): editing
    # a value here re-runs the merge on the next apply. Always-assert, no
    # value-signature stamp — a `/effort` or `/model` UI change to an UNCHANGED
    # value is NOT reverted by a routine apply (the standard onchange trade-off),
    # but a data edit or `chezmoi apply --force` re-asserts it. Keys must match
    # Claude Code's settings.json schema; values are seeded from this host today.
    settings:
      # Reasoning effort tier.
      effortLevel: xhigh
      # Quoted so YAML does not read the `[1m]` suffix as a flow sequence.
      model: "opus[1m]"
      # Auto-skip the bypass/dangerous-mode confirmation. Undocumented in Claude's
      # public settings schema but present in the live file; renders on EVERY host
      # — scope per-host if any host should keep the confirmation guardrail.
      skipDangerousModePermissionPrompt: true
      disableClaudeAiConnectors: true
    # Plugins for Claude Code, registered by the generic install-agent-plugins
    # runner (marketplace + kind + gating live in `marketplaces` above).
    plugins:
    - { name: mxm4-haptic, marketplace: dotfiles }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    - { name: frontend-design, marketplace: claude-plugins-official }
    - { name: rust-analyzer-lsp, marketplace: claude-plugins-official }
    - { name: typescript-lsp, marketplace: claude-plugins-official }
    - { name: csharp-lsp, marketplace: claude-plugins-official }
  codex:
    plugins:
    # mxm4-haptic: codex plugin with a hooks/hooks.json (Stop -> settled,
    # PermissionRequest -> question); merges with the aoe-managed ~/.codex/hooks.json.
    - { name: mxm4-haptic, marketplace: dotfiles-codex }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
  # aoe (agent-of-empires) launches custom agents declared here. Apply
  # reconciles ONLY these declared leaves into aoe's live global
  # ~/.config/agent-of-empires/config.toml via the existing kimi-reconcile
  # binary (run_after_config-aoe.sh.tmpl), preserving every undeclared key aoe
  # writes there itself. Each custom_agents.<name> value is the command aoe runs
  # for that agent; the invoker replaces `~/` with the home dir in the emitted
  # JSON, so a leading-~/ wrapper path is expanded to absolute while a bare
  # command name (no ~/) passes through verbatim. agent_detect_as.<name> tells
  # aoe which known agent's launch flags to emit; a name absent from that map is
  # launched with no injected flag.
  #   - zsh: the bare `zsh` command (resolved on PATH, no wrapper, no ~/ to
  #     expand), with NO agent_detect_as entry, so aoe injects no flag and runs a
  #     plain interactive shell. Registered ahead of use — the intent is to later
  #     point aoe's default sessions (e.g. default-branch worktrees) at this
  #     plain-shell agent instead of a coding agent; that default wiring is not
  #     done here yet.
  aoe:
    config.toml:
      session:
        custom_agents:
          omp: omp
          'claude-glm': "claude-glm"
          # Bare on-PATH shell agent; key is the aoe agent name, value the command.
          zsh: zsh
        agent_detect_as:
          omp: pi
          claude-glm: claude
  # oh-my-pi (can1357/oh-my-pi) — a fork of pi (badlogic/pi-mono).
  #
  # config.yml is NOT a chezmoi target. omp rewrites it itself through /model,
  # /settings, and first-run setup, so a managed-readonly target produced
  # permanent drift (a deployed 0600 file holding a modelRoles.default present
  # in no source checkout). Instead `run_after_config-omp-settings` asserts each
  # declared PATH below on every apply and leaves everything else to omp. Unlike
  # upstream pi, omp has no auth.json. OAuth credentials (anthropic,
  # openai-codex, google-antigravity, kimi-code) live in ~/.omp/agent/agent.db
  # through omp `/login`, so only static API keys are declared here. omp is
  # batteries-included (built-in MCP runtime and native Anthropic OAuth), so the
  # upstream pi-mcp-extension and pi-anthropic-auth packages are not carried.
  # Compound-engineering is delivered through omp's marketplace, so this
  # settings block carries no `packages` key. omp is cross-platform and ships
  # omp-windows-x64.exe, so both provisioners have Windows counterparts.
  omp:
    plugins:
    - { name: mxm4-haptic, marketplace: h82-dotfiles }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    models:
      providers: {}
    # Every key below is a LITERAL omp settings path as `omp config list` spells
    # it — this is a flat path->value map, NOT a nested config.yml document. The
    # provisioner runs one `omp config set <path> <json>` per entry, because a
    # path inside a record (modelRoles.default) is not settable while a record
    # itself (modelRoles) is, and `theme` is the reverse: only theme.dark and
    # theme.light are real paths. Consequences: a record-typed path is owned
    # WHOLESALE, so an omp-written member inside it does not survive an apply,
    # while any path omp writes BESIDE this set is preserved byte-identical.
    # Values must never contain an op:// reference — the CLI receives them as
    # process arguments, so declared settings are credential-free by contract
    # and secrets reach omp through auth.env below.
    #
    # Model policy: a model selector is named on a role, and a subagent that
    # needs an already-named model points at that role with a "@role" alias
    # (quoted so YAML does not read it as a tag) rather than repeating the id.
    # Retuning a role therefore propagates to its referents.
    #
    # Provider spread, as actually declared: anthropic carries the coding loop,
    # openai-codex deliberation, and google-antigravity BOTH vision and
    # mechanical bulk - three plans for those four job shapes, not four. That
    # sharing is a known trade, not an oversight: Antigravity holds the most
    # headroom of any plan on this host, and each of the two recovers onto a
    # different provider at its FIRST chain hop (bulk -> anthropic, vision ->
    # kimi-code via the inherited `default` chain). Two consequences to keep in
    # view: an Antigravity wall hits vision and bulk together, and vision's
    # inherited chain passes through zai/glm-5.2, which has no image input and
    # therefore cannot serve an image turn. Splitting the two is a provider
    # move, which the sync-omp-models series rule makes a human decision rather
    # than a sync action. No
    # provider/* chain is declared: a provider wildcard outranks the role chain
    # by specificity, and google-antigravity serves no claude-opus-5 or
    # claude-fable-5 id, so such a chain would preempt these provider-diverse
    # chains with hops that may all be skipped.
    #
    # >>> DO NOT HAND-EDIT THE MODEL SECTION <<<
    # `modelRoles`, `task.agentModelOverrides`, and `retry.fallbackChains` below
    # are owned by the repo-scoped skill `.agents/skills/sync-omp-models/SKILL.md`
    # (`skill://sync-omp-models`). Read it BEFORE touching any of those three
    # keys, and follow it - it carries the series/always-latest rules, the
    # subagent-override diff rule, the anchor-provider rule, the capability
    # gates, and a Verify recipe whose checks fail on a violation. Its companion
    # `model-notes.md` records which model family suits which job shape and why.
    # A change made without it will look fine here and break in one of those
    # gates, or worse, silently place deep-judgment work on a light tier.
    # Every other key under `settings:` is ordinary data and needs no skill.
    settings:
      modelRoles:
        default: anthropic/claude-opus-5:xhigh      # main coding and editing loop
        slow: openai-codex/gpt-5.6-sol:medium       # deliberation ceiling
        plan: anthropic/claude-fable-5:xhigh        # planning against a 1M context
        designer: anthropic/claude-opus-5:high      # UI and visual work
        vision: google-antigravity/gemini-3.1-pro   # image input
        advisor: openai-codex/gpt-5.6-terra:high    # turn review; runtime stays off
        task: anthropic/claude-sonnet-5             # default subagent
        smol: openai-codex/gpt-5.6-luna             # light floor that still follows tools
        # `bulk` is the one custom role. It exists because a fallback chain is
        # keyed by ROLE, so mechanical bulk work can only get its own recovery
        # order by owning a role; `tiny` aliases it so the selector is named once.
        bulk: google-antigravity/gemini-3.1-flash-lite  # mechanical bulk, titles, memory
        tiny: "@bulk"                               # background classification
        commit: "@smol"                             # commit messages
      # A DIFF against each bundled agent's own frontmatter, never a restatement
      # of it. Resolution is override -> agent frontmatter -> session fallback
      # (oh-my-pi docs/task-agent-discovery.md), so an omitted agent lands on its
      # OWN declared model, not on the `task` role. `omp agents unpack` reports
      # the v17.2.4 bundled defaults as designer/@designer, librarian/@smol
      # (thinkingLevel minimal), reviewer/@slow, scout/@smol (medium),
      # security-reviewer/<none>, sonic/@smol (medium), task/@task (auto);
      # re-read them after an omp upgrade with the sync-omp-models skill.
      #   - `task` and `librarian` are absent because their frontmatter already
      #     names the wanted role (@task, @smol); an entry would be a no-op that
      #     only drifts. `designer` is absent for the same reason - upstream, not
      #     this data, is what binds that agent to its same-named role.
      #   - `security-reviewer` (new in v17.2.4) is absent on purpose: it ships
      #     NO frontmatter model, so omission lands it on the parent session
      #     model. That is exactly the ceiling tier compound-engineering
      #     reserves for its correctness/security/adversarial personas ("if the
      #     user is on Opus, these get Opus"); pinning a role here would demote
      #     the highest-stakes review seat to a fixed line.
      #   - `scout` IS declared, and must be. compound-engineering dispatches
      #     every persona as a GENERIC subagent (no typed agent names), which
      #     under omp is the `task` agent (@task) for writable work and `scout`
      #     for read-only research - and scout's frontmatter pins @smol. Left
      #     undeclared, the review fleet's read-only dispatches (code review,
      #     doc review, simplification) run deep-judgment work on the light
      #     floor. The override lands both dispatch paths on the same mid tier,
      #     which is the tier compound-engineering's model tiering assigns them.
      #   - `sonic` points at the `bulk` role rather than a literal so it picks
      #     up that role's Haiku-then-GPT recovery order. It doubles as the
      #     compound-engineering EXTRACTION tier: grounding scouts and other
      #     retrieval-and-quoting dispatches can ride `sonic` to Flash-Lite
      #     instead of the persona fleet's Sonnet.
      task.agentModelOverrides:
        scout: "@task"                              # CE fleet read-only path -> mid tier
        reviewer: "@advisor"                        # same critic model as turn review
        sonic: "@bulk"                              # mechanical bulk + CE extraction tier
      task.showResolvedModelBadge: true
      retry.usageAwareFallback: true
      # Keyed by role only. A role with no chain of its own falls to `default`,
      # which is the deliberation chain - so any LIGHT role must declare one.
      # That is doubly true for a role whose value is a `@role` alias: omp does
      # not document whether the active role for chain lookup is the referring
      # role or its target, so an alias without its own chain can silently land
      # on `default`. `commit` and `tiny` each declare one to remove that
      # ambiguity; whichever reading omp uses, they stay on a light chain.
      #
      # ANCHOR RULE: each role's RESOLUTION PATH - its own selector plus its
      # chain - reaches at least one `anthropic` and one `openai-codex` hop.
      # Those two plans hold the most headroom on this host, so a path that
      # reaches neither can strand the role once the plan-served providers are
      # spent. `default` satisfies it through its own Opus selector, so its chain
      # spends every hop on a different provider. The light chains anchor on
      # Haiku and Luna, never on a deliberation line, so anchoring cannot
      # escalate background work.
      #
      # `default` walks the communicator alternatives before the deep
      # specialist: Kimi holds up better than GLM under nested delegation
      # prompts (oh-my-openagent's tested finding), and Sol changes working
      # style rather than degrading gracefully, so it sits last as the
      # different-brain option rather than the first retry.
      #
      # `task` backs the compound-engineering persona fleet - every generic
      # subagent spawn plus the `scout` alias above - so its recovery order is
      # a FLEET order, and it needs one of its own: with no declared chain it
      # inherited `default`, where the zai hop can be quota-dead and the Sol
      # hop escalates mid-tier fleet work to the deliberation line. The first
      # hop keeps the Sonnet FAMILY on the Antigravity plan (a separate daily
      # quota that is typically untouched), so a persona prompt tuned on Sonnet
      # keeps its behavior through an Anthropic wall; Terra is the
      # openai-codex anchor on the worker tier; Kimi then GLM close it in
      # oh-my-openagent's tested Kimi-first order, both kept late because the
      # Kimi membership quota is shared across every client and the zai weekly
      # window spends early.
      #
      # `advisor` is the critic seat (turn review plus the `reviewer` agent).
      # Its inherited path never reached an anthropic hop at all, and its last
      # hop sat on the same openai-codex plan as its primary - a codex wall
      # would have stranded it. The declared chain adds the anthropic anchor on
      # the SONNET line, not Opus: the critic must stay off the doer's own
      # line, or it reviews with the doer's blind spots. Kimi leads because
      # the Anthropic weekly window runs hot on this host.
      retry.fallbackChains:
        default:
        - kimi-code/k3:high
        - zai/glm-5.2:max
        - openai-codex/gpt-5.6-sol:medium
        task:
        - google-antigravity/claude-sonnet-4-6
        - openai-codex/gpt-5.6-terra
        - kimi-code/k3:high
        - zai/glm-5.2:max
        advisor:
        - kimi-code/k3:high
        - anthropic/claude-sonnet-5
        smol:
        - google-antigravity/gemini-3.6-flash
        - anthropic/claude-haiku-4-5
        - zai/glm-4.7-flash
        commit:
        - google-antigravity/gemini-3.6-flash
        - anthropic/claude-haiku-4-5
        tiny:
        - google-antigravity/gemini-3.6-flash
        - anthropic/claude-haiku-4-5
        - openai-codex/gpt-5.6-luna
        - zai/glm-4.7-flash
        bulk:
        - anthropic/claude-haiku-4-5
        - openai-codex/gpt-5.6-luna
      # Exa first; unlisted providers keep their built-in relative order after
      # it. The deep-research surfaces are pinned off rather than left to a
      # default that could change upstream.
      providers.webSearchOrder:
      - exa
      exa.enabled: true
      exa.enableSearch: true
      exa.enableResearcher: false
      exa.enableWebsets: false
      theme.dark: titanium
      theme.light: light
      symbolPreset: nerd
      setupVersion: 1
      defaultThinkingLevel: xhigh
      # Assert the preferred progress display and tmux scrollback behavior.
      display.shimmer: 'kitt'
      display.showTokenUsage: true
      terminal.showProgress: true
      tui.scrollbackRebuild: true
      # Use the native agents skill roots without duplicate compatibility scans.
      skills.enableCodexUser: false
      skills.enableClaudeUser: false
      skills.enableClaudeProject: false
      # Keep structural search and host desktop control available.
      astGrep.enabled: true
      computer.enabled: true
    # Static API keys omp reads from its dotenv. OAuth credentials (anthropic,
    # openai-codex, google-antigravity, kimi-code) live in ~/.omp/agent/agent.db
    # via omp /login and are never declared here. This is a TOOL/PROVIDER
    # credential map keyed by environment variable, not a model-provider auth
    # shape. Exa is a search tool, not a model provider.
    # run_after_config-omp-auth requires exactly this four-variable closed set:
    # ZAI_API_KEY, EXA_API_KEY, OPENROUTER_API_KEY, and OPENCODE_API_KEY.
    # OPENCODE_API_KEY enables both OpenCode providers.
    # A shape-only check would let a data edit inject an arbitrary variable such
    # as HTTP_PROXY or NODE_OPTIONS into the environment omp loads for every
    # session, and dropping the cardinality check would let an emptied map
    # silently delete a key.
    auth:
      env:
      - variable: ZAI_API_KEY
        key: op://Private/Z.ai/API Key
      - variable: EXA_API_KEY
        key: op://Private/Exa/API Key
      - variable: OPENROUTER_API_KEY
        key: op://Private/OpenRouter/API Key
      - variable: OPENCODE_API_KEY
        key: op://Private/Opencode/API Key
