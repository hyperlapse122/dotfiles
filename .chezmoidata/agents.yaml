# .chezmoidata/agents.yaml — single source of truth for ALL agent configuration.
#
# Consumer map:
#   agents.mcp.servers
#     -> omp mcp.json (dot_omp/private_agent/private_readonly_mcp.json.tmpl)
#   agents.skills.external
#     -> .chezmoiexternals/ai-agents.toml (agent skills fetched as externals)
#   agents.marketplaces + agents.omp.plugins
#     -> .chezmoiscripts/70-agents/run_onchange_after_update-omp-plugins.sh.tmpl
#   agents.aoe
#     -> ~/.config/agent-of-empires/config.toml, deep-merged by
#        run_after_config-aoe.sh.tmpl via the kimi-reconcile binary
#   agents.omp.settings
#     -> run_after_config-omp-settings.sh.tmpl, which asserts each declared omp
#        settings PATH into the omp-owned ~/.omp/agent/config.yml. Also READ by
#        the models target below, whose shared validator proves every model
#        override is named by a declared selector here.
#   agents.omp.models
#     -> dot_omp/private_agent/readonly_models.yml.tmpl (~/.omp/agent/models.yml).
#        Override-only providers adjusting metadata on models omp already serves.
#        Also the validator's second caller: it renders the same shared partial,
#        so a model override here is cross-checked against the selectors above.
#   agents.validOS
#     -> shared os: applicability vocabulary for agents.mcp.servers and
#        agents.marketplaces, read by both consuming templates instead of each
#        hand-declaring the same list.
#   agents.omp.auth.env
#     -> run_after_config-omp-auth.sh.tmpl, which reconciles the declared
#        credentials in the live ~/.omp/agent/.env
#
# Add or change agent configuration HERE, not in the consuming templates. Those
# templates retain only target-specific FORMAT and live-file merge mechanics.
#
# Secrets: .chezmoidata files are static, so secret values are stored as op://
# reference strings. resolve-op-refs-json.tmpl recursively walks maps, slices,
# and scalars: a string starting exactly with op:// is onepasswordRead-resolved
# at render time; every other value and type passes through unchanged. This is
# field-independent and therefore works for provider options, nested headers,
# and MCP headers without secret-key-specific template branches.
#
# The omp MCP render hashes the unresolved agents.mcp data, so an MCP edit
# re-triggers it without coupling unrelated changes. Rendered secrets are not
# fingerprinted; secret rotation alone follows the consumer's documented
# onchange behavior.

agents:
  # Shared os: applicability vocabulary — every os: field below (mcp.servers,
  # marketplaces) is validated against this list by its consuming template.
  validOS: [linux, darwin]
  # MCP servers consumed by omp's native MCP runtime.
  # `transport` is the discriminator: stdio uses command/args; http uses url plus
  # optional headers. Each consumer maps that neutral shape into its native
  # schema.
  # `auth: oauth` marks an HTTP server whose credentials belong in each harness's
  # native OAuth store; credentials and refresh tokens never enter source data.
  # Optional applicability is shared across every consumer:
  #   os: [linux, darwin]  (omitted means every OS)
  #   container: keep | skip        (omitted means keep)
  #   harnessSkip: [<harness id>]   (omitted means every harness)
  # harnessSkip is an EXCLUSION list, so a new harness inherits every server
  # unless it is named. omp is the sole managed harness and sole caller; a
  # harnessSkip entry naming any other id fails as unknown.
  # agent-mcp-servers-json.tmpl validates and filters these fields before any
  # target-specific formatter sees the record.
  mcp:
    servers:
    - name: codegraph
      transport: stdio
      command: codegraph
      args:
      - serve
      - "--mcp"
    - name: glab
      transport: stdio
      command: glab
      args:
      - mcp
      - serve
    - name: agent-browser
      transport: stdio
      command: agent-browser
      args:
      - mcp
      - "--tools"
      - all
    - name: figma
      transport: http
      url: https://mcp.figma.com/mcp
      auth: oauth
    - name: context7
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: op://Private/Context7/API Key
    - name: websearch
      transport: http
      url: https://mcp.exa.ai/mcp
      headers:
        x-api-key: op://Private/Exa/API Key
      # omp has a native Exa search provider fed by EXA_API_KEY from its dotenv,
      # so the MCP path would duplicate the capability and put the key in a
      # second rendered file. Every other harness keeps this server.
      harnessSkip:
      - omp
  # Agent skills installed under ~/.agents/skills. `external` carries the
  # existing independently versioned skills. `collections` carries immutable
  # multi-skill sources whose revision and inventory live only in the generated
  # release lock.
  #
  # A collection row is static policy:
  #   source             -> immutable archive repository
  #   lockKey            -> typed githubSkillCollection entry in releases.json
  #   stagingPath        -> exact, Figma-only external tree consumed by reconcilers
  #   ownershipStatePath -> private ledger used to remove only formerly owned skills
  # The hourly refresh updates lock metadata automatically. The generated diff is
  # review-visible audit/reproducibility evidence, not an approval gate.
  skills:
    collections:
      figma:
        source: figma/mcp-server-guide
        lockKey: figma/mcp-server-guide
        stagingPath: .local/share/figma-skills-stage
        ownershipStatePath: .local/state/figma-skills/ownership.json
    # Existing individually versioned externals. For host: github, `name` is
    # also the skills/<name>/ subtree in the source repository. GitLab entries
    # fetch one declared SKILL.md from `skillPath`.
    external:
    - name: agent-browser
      source: vercel-labs/agent-browser
    - name: improve
      source: shadcn/improve
      ref: main
    - name: glab
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab
    - name: glab-stack
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab-stack
  # omp plugin marketplaces, single-sourced here. omp's plugin updater
  # (run_onchange_after_update-omp-plugins.sh.tmpl) ranges over
  # agents.omp.plugins and, per entry, looks up its marketplace here to resolve
  # the source path and OS/container eligibility. `marketplaces` is the shared
  # registry keyed by each marketplace's registered name.
  #   - kind: how the updater resolves the marketplace source path.
  #       localDir      -> a host directory OMP scans natively (h82-dotfiles).
  #       localArchive  -> the versioned tree chezmoi extracts from a GitHub
  #                        release (compound-engineering-plugin). `source`,
  #                        `externalPath`, and `versionSource` live here because
  #                        the archive is shared across OSes; omp reads the
  #                        extracted path on every desktop OS.
  #   - os: the OSes where omp emits the plugin row, taken directly from each
  #     marketplace's declared list (no special-casing).
  #   - container: `skip` filters the row when the `container` fact is true
  #     (mxm4-haptic has nothing to pulse in a container); `keep` leaves it in.
  #     This applies to every plugin filed under the marketplace; a plugin row
  #     cannot override it.
  marketplaces:
    h82-dotfiles:
      kind: localDir
      path: .local/share/omp-plugins     # relative to $HOME; OMP-native catalog
      os: [linux, darwin]
      container: skip
    compound-engineering-plugin:
      kind: localArchive
      source: EveryInc/compound-engineering-plugin
      externalPath: .local/share/compound-engineering
      versionSource: compoundEngineeringRelease
      os: [linux, darwin]
      container: keep
  # aoe (agent-of-empires) launches custom agents declared here. Apply
  # reconciles ONLY these declared leaves into aoe's live global
  # ~/.config/agent-of-empires/config.toml via the existing kimi-reconcile
  # binary (run_after_config-aoe.sh.tmpl), preserving every undeclared key aoe
  # writes there itself. Each custom_agents.<name> value is the command aoe runs
  # for that agent; the invoker replaces `~/` with the home dir in the emitted
  # JSON, so a leading-~/ wrapper path is expanded to absolute while a bare
  # command name (no ~/) passes through verbatim. agent_detect_as.<name> tells
  # aoe which known agent's launch flags to emit; a name absent from that map is
  # launched with no injected flag.
  #   - zsh: the bare `zsh` command (resolved on PATH, no wrapper, no ~/ to
  #     expand), with NO agent_detect_as entry, so aoe injects no flag and runs a
  #     plain interactive shell. Registered ahead of use — the intent is to later
  #     point aoe's default sessions (e.g. default-branch worktrees) at this
  #     plain-shell agent instead of a coding agent; that default wiring is not
  #     done here yet.
  # The `tmux` leaves exist because aoe's `auto` modes step aside for a user
  # tmux config, and this repo deploys one (`dot_config/tmux/tmux.conf`):
  #   - status_bar: `auto` defers on the mere EXISTENCE of ~/.tmux.conf,
  #     $XDG_CONFIG_HOME/tmux/tmux.conf, or ~/.config/tmux/tmux.conf, so aoe
  #     unset its own status* session options and every aoe session fell back to
  #     tmux's stock green bar. `enabled` restores the themed bar (session name,
  #     title, branch, detach hint) without weakening the deployed tmux.conf.
  #   - clipboard: `auto` defers when the user config sets `set-clipboard` OR
  #     `allow-passthrough`; ours sets the latter for omp's inline images, so
  #     aoe silently stopped writing `set -s set-clipboard on` and OSC 52 from a
  #     wrapped agent died inside tmux. `enabled` writes both; passthrough is
  #     already on, so set-clipboard is the only effective change. aoe appends
  #     it to `new-session`, so it lands on newly created sessions.
  # `mouse` stays undeclared: its `auto` defers only when the user config sets
  # `mouse`, which ours does not, so aoe already applies `mouse on`.
  aoe:
    config.toml:
      session:
        custom_agents:
          omp: omp
          # Bare on-PATH shell agent; key is the aoe agent name, value the command.
          zsh: zsh
        agent_detect_as:
          omp: pi
      tmux:
        status_bar: enabled
        clipboard: enabled
  # oh-my-pi (can1357/oh-my-pi) — a fork of pi (badlogic/pi-mono).
  #
  # config.yml is NOT a chezmoi target. omp rewrites it itself through /model,
  # /settings, and first-run setup, so a managed-readonly target produced
  # permanent drift (a deployed 0600 file holding a modelRoles.default present
  # in no source checkout). Instead `run_after_config-omp-settings` asserts each
  # declared PATH below on every apply and leaves everything else to omp. Unlike
  # upstream pi, omp has no auth.json. OAuth credentials (anthropic,
  # google-antigravity, kimi-code) live in ~/.omp/agent/agent.db
  # through omp `/login`, so only static API keys are declared here. omp is
  # batteries-included (built-in MCP runtime and native Anthropic OAuth), so the
  # upstream pi-mcp-extension and pi-anthropic-auth packages are not carried.
  # Compound-engineering is delivered through omp's marketplace, so this
  # settings block carries no `packages` key. omp is cross-platform across
  # every OS chezmoi manages, so no OS-specific branching is needed here.
  omp:
    plugins:
    - { name: mxm4-haptic, marketplace: h82-dotfiles }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    models:
      # Override-only providers: a modelOverrides map adjusting metadata on a
      # model omp's built-in catalog already serves. opencode-go publishes no
      # 256k Kimi variant the way kimi-code does, so the cap is bought here to
      # keep every Kimi hop on one context budget. Under-reporting a real limit
      # cannot error; it only makes compaction fire earlier.
      providers:
        opencode-go:
          modelOverrides:
            kimi-k3:
              contextWindow: 262144
    # Every key below is a LITERAL omp settings path as `omp config list` spells
    # it — this is a flat path->value map, NOT a nested config.yml document. The
    # provisioner runs one `omp config set <path> <json>` per entry, because a
    # path inside a record (modelRoles.default) is not settable while a record
    # itself (modelRoles) is, and `theme` is the reverse: only theme.dark and
    # theme.light are real paths. Consequences: a record-typed path is owned
    # WHOLESALE, so an omp-written member inside it does not survive an apply,
    # while any path omp writes BESIDE this set is preserved byte-identical.
    # Values must never contain an op:// reference — the CLI receives them as
    # process arguments, so declared settings are credential-free by contract
    # and secrets reach omp through auth.env below.
    #
    # Tier basis: the ceiling/mid boundary follows LMArena's coding and agent
    # leaderboards (text category=coding and agent category=overall, snapshot
    # 2026-08-03). All three doer tiers now sit on Anthropic, so the ladder is
    # effort-graded across two models rather than vendor-graded across three:
    # opus-5 at :max and :xhigh, sonnet-5 at :high. The light tier is still a
    # latency choice, which is why it takes :high and not the :xhigh the main
    # loop uses - `mnemopi.llmMode: smol` runs it on every retained turn, so
    # maximum deliberation there is the wrong default. `omp bench` remains its
    # check; no bench number was recorded for this change. Everything else here
    # is enforced by `.chezmoitemplates/omp-settings-validate.tmpl`, not prose.
    settings:
      # Three tiers. A role names a tier; a chain hangs on the tier's model
      # (see retry.fallbackChains below), so grade is a property of the model.
      # `slow` and `default` deliberately share one model at two efforts, which
      # is why they also share one chain - see the collision note there.
      modelRoles:
        slow: anthropic/claude-opus-5:max           # deliberation ceiling
        default: anthropic/claude-opus-5:xhigh      # main coding and editing loop
        smol: anthropic/claude-sonnet-5:high        # light floor that still follows tools
        advisor: openai-codex/gpt-5.6-sol:xhigh     # critic seat; the one line no doer tier uses
        plan: "@slow"                               # both tiers are 1M now; the alias buys :max effort
        commit: "@smol"                             # else commit messages ride the session model
      # EXHAUSTIVE over `omp agents unpack`, not a diff against frontmatter. An
      # omitted agent lands on its own frontmatter (override -> frontmatter ->
      # task role/session, oh-my-pi docs/task-agent-discovery.md), so silence is
      # never neutrality - and frontmatter moves between releases. Naming all
      # seven makes the mapping immune to that drift; `.ci/check-omp-agent-roster.sh`
      # fails the build when omp's roster and this key set diverge.
      task.agentModelOverrides:
        task: "@default"                            # generic writable subagent
        scout: "@default"                           # read-only research; CE dispatches its personas here
        designer: "@default"                        # UI and visual work
        librarian: "@smol"                           # external library lookup
        sonic: "@smol"                              # strictly mechanical work
        reviewer: "@advisor"                        # critic, not doer
        security-reviewer: "@slow"                  # highest-stakes review seat
      task.showResolvedModelBadge: true
      task.enableEffort: true
      # Ceiling on subagent effort. It MUST stay at max while `slow` is :max:
      # omp maps a task item's effort onto the model's supported range, clamps
      # it here, and carries that ceiling across retry-fallback switches, so an
      # xhigh cap would clamp `security-reviewer: "@slow"` down to :xhigh and
      # make `slow` and `default` identical inside every subagent - collapsing
      # the top of the ladder exactly where the stakes are highest.
      task.maxEffort: max
      retry.usageAwareFallback: true
      # Keyed by MODEL, not role. An exact provider/model-id key outranks a role
      # chain by specificity (oh-my-pi docs/settings.md), so every role using that
      # model recovers within its own grade and no role needs a chain of its own.
      # `default` is the floor for anything no key names - a hand-picked /model.
      # A provider/* key is rejected at render: it would span the whole provider
      # and catch another tier's model, and anthropic backs three tiers here.
      retry.fallbackChains:
        # Ceiling AND main loop: both resolve to this one model id, so they share
        # one chain by necessity. `omp-settings-validate.tmpl` rejects a thinking
        # suffix on a chain key, so :max and :xhigh cannot be separated here, and
        # declaring the key twice would be worse than useless - duplicate keys in
        # one YAML document collapse silently at decode, upstream of every
        # validator, so one chain would vanish with no error anywhere.
        # Both hops leave anthropic, and the last keeps `opencode-go/kimi-k3` a
        # declared selector, which is what keeps its models override legal.
        anthropic/claude-opus-5:
        - kimi-code/k3-256k:max
        - opencode-go/kimi-k3:max
        # Light: three plans, one per hop, none of them anthropic - so one
        # Anthropic cap cannot degrade this tier at the same moment it degrades
        # the two above it.
        anthropic/claude-sonnet-5:
        - google-antigravity/gemini-3.6-flash:high
        - openai-codex/gpt-5.6-luna:max
        - kimi-code/kimi-for-coding:high
        # Critic: reaches neither doer model. It also skips a second
        # openai-codex line, because usage-aware fallback makes a same-provider
        # hop useless when the plan cap is what failed.
        openai-codex/gpt-5.6-sol:
        - google-antigravity/gemini-3-pro:high
        - opencode-go/glm-5.2:max
        # Floor for a hand-picked /model that no key above names.
        default:
        - anthropic/claude-opus-5:xhigh
        - kimi-code/k3-256k:max
      # Turn review plus the `reviewer` agent. Enabling it starts a continuous
      # flow of each turn's transcript delta to the critic; advisor.subagents
      # stays undeclared so its false default keeps subagent turns out of it.
      advisor.enabled: false
      # Provider availability gate. It is applied BEFORE any credential check,
      # so it is the only knob that keeps a backend out of every AUTOMATIC
      # selection path. `retry.fallbackChains` above was never the exposure -
      # retry walks declared chains only, and no chain names anything here - but
      # omp also has catalog-wide scans that no chain governs, each firing
      # wherever a declared selector does not resolve: its built-in
      # priority.json role chains carry BARE patterns (`gpt-5.5`, `codex`,
      # `mini`, `haiku`), the vision fallback for a text-only model ends at
      # "first image-capable available", the smol/slow finders end at
      # availableModels[0], and providers.imageOrder's built-in tail names
      # openrouter. Every one of those ranks by CATALOG ORDER, which is
      # incidental: openrouter and opencode-zen served 473 of the 562 available
      # ids on this host (openrouter 413, opencode-zen 60), so a bare-id scan
      # was one catalog reshuffle away from spending token-metered capacity
      # instead of a plan. The trade is that a disabled provider also leaves
      # `/model`, so it cannot be chosen by hand either; re-enabling one is a
      # delete from this list. Both aggregator keys stay declared under auth.env
      # - provisioning a credential is independent of this gate, and
      # OPENCODE_API_KEY still serves opencode-go, which is plan-metered and
      # stays available. No declared selector names any provider on this list,
      # and none may: a disabled provider leaves `omp models --json`, so the
      # catalog gate in the provisioner fails the apply on one.
      #
      # `zai` is here for the opposite reason, and it is TEMPORARY. Its plan
      # expired on 2026-08-06 and its credential left auth.env below, which is
      # what DURABLY removes the provider from `omp models --json`. But the
      # dotenv reconciler preserves every UNDECLARED entry byte-identically, so
      # an already-provisioned host keeps its stale `ZAI_API_KEY=` line until
      # that line is hand-deleted - and until then the key is still PRESENT, so
      # the catalog-wide scans above can still select a provider that cannot
      # answer, exactly when a scan fires because something else failed. This
      # entry closes that window from the repo side instead of depending on the
      # operator acting first. Delete this entry and the stale dotenv line
      # together: once the line is gone the credential gate excludes `zai` on
      # its own and this entry is dead data.
      disabledProviders:
      - openrouter
      - opencode-zen
      - zai
      # Exa first; unlisted providers keep their built-in relative order after
      # it. The deep-research surfaces are pinned off rather than left to a
      # default that could change upstream.
      providers.webSearchOrder:
      - exa
      exa.enabled: true
      theme.dark: titanium
      theme.light: light
      symbolPreset: nerd
      setupVersion: 1
      defaultThinkingLevel: xhigh
      # Assert the preferred progress display and tmux scrollback behavior.
      display.shimmer: 'kitt'
      display.showTokenUsage: true
      terminal.showProgress: true
      tui.scrollbackRebuild: true
      # Use the native agents skill roots without duplicate compatibility scans.
      skills.enableCodexUser: false
      skills.enableClaudeUser: false
      skills.enableClaudeProject: false
      # Keep structural search and host desktop control available.
      astGrep.enabled: true
      computer.enabled: true
      generate_image.enabled: true
      github.enabled: true
      steeringMode: one-at-a-time
      followUpMode: one-at-a-time
      power.sleepPrevention: idle
      startup.setupWizard: false
      startup.checkUpdate: true
      autolearn.enabled: true
      commands.enableClaudeUser: false
      commands.enableClaudeProject: false
      commands.enableOpencodeUser: false
      commands.enableOpencodeProject: false
      # Local long-term memory. ONLY the backend selector is declared: `mnemopi`
      # itself is not a settable path (`omp config set mnemopi` is rejected as an
      # unknown setting), every knob under it is its own leaf, and the defaults
      # already suit this host — `mnemopi.scoping: per-project` isolates memory
      # per working directory, `autoRecall`/`autoRetain` are on, and
      # `llmMode: smol` lands on the declared `smol` role, since `tiny` is not
      # declared and omp documents that unset `tiny` falls through to `@smol`.
      # Restating a default here would only hide a future upstream change. The
      # absence of `mnemopi.*` keys is therefore deliberate, not an oversight.
      #
      # Privacy note, in two parts. STORAGE is local: this backend retains
      # completed conversation turns to a local SQLite store and, unlike the
      # `local` backend, documents no secret/token redaction and no retention
      # limit, so content accumulates unredacted until `/memory clear`. Keep the
      # agent memories directory out of backups and sync tooling.
      # PROCESSING is not local: mnemopi's default `llmMode: smol` lands on the
      # declared `smol` role, so LLM-backed extraction and consolidation
      # send retained transcript content to that cloud model. "Local" here means
      # local STORAGE (as opposed to the remote `hindsight` server backend), not
      # local compute. This reuses the same provider trust boundary ordinary
      # turns already cross, but it re-sends PAST transcripts, including ones
      # whose original session ran on a different provider. Set
      # `mnemopi.llmMode: none` to keep processing on-device at the cost of
      # LLM-backed consolidation.
      memory.backend: mnemopi
    # Static API keys omp reads from its dotenv. OAuth credentials (anthropic,
    # google-antigravity, kimi-code) live in ~/.omp/agent/agent.db
    # via omp /login and are never declared here. This is a TOOL/PROVIDER
    # credential map keyed by environment variable, not a model-provider auth
    # shape. Exa is a search tool, not a model provider.
    # run_after_config-omp-auth requires exactly this three-variable closed
    # set: EXA_API_KEY, OPENROUTER_API_KEY, and OPENCODE_API_KEY. ZAI_API_KEY
    # left the set on 2026-08-06 when the Z.ai coding plan expired; because the
    # reconciler preserves every UNDECLARED dotenv entry, the already-deployed
    # line survives in ~/.omp/agent/.env and must be deleted by hand once, or
    # omp keeps offering a dead `zai` provider.
    # OPENCODE_API_KEY enables both OpenCode providers, of which
    # settings.disabledProviders keeps only opencode-go selectable, and
    # OPENROUTER_API_KEY stays provisioned although that backend is disabled
    # there, so re-enabling either provider is a settings-only change.
    # A shape-only check would let a data edit inject an arbitrary variable such
    # as HTTP_PROXY or NODE_OPTIONS into the environment omp loads for every
    # session, and dropping the cardinality check would let an emptied map
    # silently delete a key.
    auth:
      env:
      - variable: EXA_API_KEY
        key: op://Private/Exa/API Key
      - variable: OPENROUTER_API_KEY
        key: op://Private/OpenRouter/API Key
      - variable: OPENCODE_API_KEY
        key: op://Private/Opencode/API Key
