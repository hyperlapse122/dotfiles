
agents:
  validOS: [linux, darwin]
  mcp:
    servers:
    - name: codegraph
      transport: stdio
      command: codegraph
      args:
      - serve
      - "--mcp"
    - name: glab
      transport: stdio
      command: glab
      args:
      - mcp
      - serve
    - name: agent-browser
      transport: stdio
      command: agent-browser
      args:
      - mcp
      - "--tools"
      - all
    - name: context7
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: op://Private/Context7/API Key
    - name: mdn
      transport: http
      url: https://mcp.mdn.mozilla.net/
      headers:
        X-Moz-1st-Party-Data-Opt-Out: "1"
  skills:
    external:
    - name: agent-browser
      source: vercel-labs/agent-browser
    - name: improve
      source: shadcn/improve
      ref: main
    - name: i-have-adhd
      source: ayghri/i-have-adhd
    - name: composition-patterns
      source: vercel-labs/agent-skills
      ref: main
    - name: react-best-practices
      source: vercel-labs/agent-skills
      ref: main
    - name: react-view-transitions
      source: vercel-labs/agent-skills
      ref: main
    - name: web-design-guidelines
      source: vercel-labs/agent-skills
      ref: main
    - name: writing-guidelines
      source: vercel-labs/agent-skills
      ref: main
    - name: glab
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab
    - name: glab-stack
      source: gitlab-org/cli
      host: gitlab
      versionSource: glabRelease
      skillPath: internal/commands/skills/bundled/assets/glab-stack
  agentPlugins:
    external: []
  marketplaces:
    h82-dotfiles:
      kind: localDir
      path: .local/share/omp-plugins
      os: [linux, darwin]
      container: skip
      jetson: skip
    compound-engineering-plugin:
      kind: localArchive
      source: EveryInc/compound-engineering-plugin
      externalPath: .local/share/compound-engineering
      versionSource: compoundEngineeringRelease
      exclude:
      - "*/plugin.json"
      os: [linux, darwin]
      container: keep
  aoe:
    config.toml:
      session:
        custom_agents:
          omp: omp
          zsh: zsh
        agent_detect_as:
          omp: pi
      tmux:
        status_bar: enabled
        clipboard: enabled
  omp:
    plugins:
    - { name: mxm4-haptic, marketplace: h82-dotfiles }
    - { name: compound-engineering, marketplace: compound-engineering-plugin }
    pluginsRemoved:
    - { name: i-have-adhd, marketplace: i-have-adhd }
    - { name: unmanaged-repo-guard, marketplace: h82-dotfiles }
    models:
      providers:
        google-antigravity:
          modelOverrides:
            gemini-3.7-flash:
              thinking:
                mode: google-level
                efforts:
                - low
                - medium
                - high
    settings:
      theme.dark: titanium
      theme.light: light
      symbolPreset: nerd
      statusLine.preset: default
      statusLine.separator: powerline-thin
      terminal.showProgress: false
      tui.textSizing: true
      tui.codexResetFireworks: true
      tui.scrollbackRebuild: true
      display.shimmer: 'classic'
      display.showTokenUsage: true
      tui.imeSafeCursor: true
      task.showResolvedModelBadge: true
      ttsr.repeatMode: after-gap
      power.sleepPrevention: idle
      steeringMode: one-at-a-time
      followUpMode: one-at-a-time
      startup.setupWizard: false
      startup.checkUpdate: true
      stt.enabled: true
      setupVersion: 1
      enabledModels:
      - anthropic/claude-fable-5
      - anthropic/claude-opus-5
      - anthropic/claude-sonnet-5
      - google-antigravity/gemini-3.*
      - kimi-code/*
      disabledProviders:
      - openrouter
      - opencode-go
      - opencode-zen
      - zai
      - github-copilot
      modelRoles:
        advisor: "@worker"
        commit: "@worker"
        default: anthropic/claude-opus-5:xhigh
        fable: anthropic/claude-fable-5:max
        plan: "@fable"
        skim: google-antigravity/gemini-3.7-flash:low
        slow: anthropic/claude-opus-5:max
        smol: anthropic/claude-sonnet-5:high
        tiny: google-antigravity/gemini-3.1-flash-lite:minimal
        worker: google-antigravity/gemini-3.7-flash:high
      task.agentModelOverrides:
        designer: "@worker"
        librarian: "@skim"
        reviewer: "@slow"
        scout: "@skim"
        security-reviewer: "@worker"
        sonic: "@worker"
        task: "@worker"
      skills.enableCodexUser: false
      skills.enableClaudeUser: false
      skills.enableClaudeProject: false
      memory.backend: mnemopi
      autolearn.enabled: true
      mnemopi.embeddingVariant: multilingual
      mnemopi.autoRecall: true
      mnemopi.autoRetain: true
      mnemopi.polyphonicRecall: true
      mnemopi.enhancedRecall: true
      mnemopi.proactiveLinking: true
      advisor.enabled: false
      defaultThinkingLevel: xhigh
      includeModelInPrompt: false
      retry.usageAwareFallback: true
      retry.usageReservePolicy: auto
      retry.usageReservePct: 15
      retry.fallbackRevertPolicy: never
      retry.fallbackChains:
        anthropic/claude-fable-5:
        - google-antigravity/gemini-3.1-pro:high
        anthropic/claude-opus-5:
        - google-antigravity/gemini-3.1-pro:high
        anthropic/claude-sonnet-5:
        - google-antigravity/gemini-3.7-flash:high
        google-antigravity/gemini-3.7-flash:
        - google-antigravity/gemini-3.1-flash-lite:minimal
        default:
        - anthropic/claude-opus-5:high
        - google-antigravity/gemini-3.7-flash:high
      secrets.enabled: true
      providers.webSearchGeminiModel: null
      providers.webSearchOrder:
      - gemini
      providers.imageOrder:
      - antigravity
      - openrouter
      provider.appendOnlyContext: on
      task.isolation.mode: none
      task.enableEffort: false
      task.enableLsp: true
      task.maxEffort: max
      commands.enableClaudeUser: false
      commands.enableClaudeProject: false
      commands.enableOpencodeUser: false
      commands.enableOpencodeProject: false
      tools.approvalMode: yolo
      tools.approval: {}
      astGrep.enabled: true
      generate_image.enabled: true
      computer.enabled: true
      github.enabled: true
      security.enabled: true
      mcp.notifications: true
    auth:
      env:
      - variable: OPENROUTER_API_KEY
        key: op://Private/OpenRouter/API Key
