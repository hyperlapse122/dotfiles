# Manifest for root-owned Linux system configuration
# Managed by modular subsystem scripts under .chezmoiscripts/30-linux/.
# See system/README.md for the full model.
#
# Single source of truth: add/gate a system/linux/etc
# file or list a removed /etc path HERE, organized by subsystem.
system:
  linux:
    keyd:
      keyboards:
        - id: "0001:0001"
          name: "AT Translated Set 2 keyboard"

    desktop:
      overrides:
        # De-brands the login greeter to upstream Breeze on both distros.
        # Forcing Current=breeze without the theme installed yields a broken
        # login screen, so skip when the breeze SDDM theme is absent.
        - path: etc/sddm.conf.d/90-breeze.conf
          gate: sddmBreeze
        # GNOME targets: force password-only auth at the GDM greeter so
        # pam_gnome_keyring always unlocks the login keyring.
        - path: etc/dconf/profile/gdm
          gate: gdm
        - path: "etc/dconf/db/gdm.d/*"
          gate: gdm
      removed:
        # Retired systemd system-sleep hooks for container proxy and open-design
        - path: /etc/systemd/system-sleep/cli-proxy-api.sh
        - path: /etc/systemd/system-sleep/open-design.sh

    sudoers:
      overrides:
        # sudoers(5): drop-ins must be mode 0440 (sudo ignores
        # group/world-writable files) and the filename must not contain '.'
        # or end in '~'. VM-only so password-less sudo never lands on bare
        # metal; visudo-checked everywhere.
        - path: "etc/sudoers.d/*"
          mode: "440"
          gate: vm
          check: visudo

    sysctl: {}

    udev:
      removed:
        # Retired uinput and receiver udev rules
        - path: /etc/udev/rules.d/80-uinput.rules
        - path: /etc/udev/rules.d/logitech-receiver.rules
        - path: /etc/udev/rules.d/70-uinput-solaar.rules

    hardware:
      overrides:
        # thinkpad_acpi module config/load only makes sense on a ThinkPad.
        - path: etc/modprobe.d/thinkpad_acpi.conf
          gate: thinkpad
        - path: etc/modules-load.d/thinkpad_acpi.conf
          gate: thinkpad
        # Render offload and runtime power management for a laptop's discrete
        # GPU. A desktop with a single discrete card has nothing to offload to.
        - path: etc/modprobe.d/nvidia-hybrid-power.conf
          gate: hybridGraphics
        - path: etc/modprobe.d/nvidia-hybrid-modeset.conf
          gate: hybridGraphics
      removed:
        # Retired kernel-install(8) drop-in for VirtualBox module signing
        - path: /etc/kernel/install.d/50-vbox-sign.install
          distro: fedora

    # Sleep policy is a laptop concern, gated on the battery fact. Its own
    # subsystem rather than a passenger on the hibernation-storage installer,
    # which is wrapped in a Fedora-and-btrfs condition and carries no fact
    # machinery.
    sleep:
      overrides:
        - path: "etc/systemd/sleep.conf.d/*"
          gate: battery
        - path: "etc/systemd/logind.conf.d/*"
          gate: battery

    bluetooth: {}
