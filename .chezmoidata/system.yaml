# Manifest for root-owned Linux system configuration
# Managed by modular subsystem scripts under .chezmoiscripts/30-linux/.
# See system/README.md for the full model.
#
# Single source of truth: add/gate a system/linux/etc
# file or list a removed /etc path HERE, organized by subsystem.
system:
  linux:
    keyd:
      keyboards:
        - id: "0001:0001"
          name: "AT Translated Set 2 keyboard"

    desktop:
      overrides:
        # De-brands the login greeter to upstream Breeze on both distros.
        # Forcing Current=breeze without the theme installed yields a broken
        # login screen, so skip when the breeze SDDM theme is absent.
        # ONE fact, not two gates: a manifest entry carries one gate expression
        # and the shared helper has no conjunction form. sddmBreezeUsable is the
        # theme being installed AND this host running SDDM, so the drop-in is
        # never installed on a host the retirement below would strip it from on
        # the same run.
        - path: etc/sddm.conf.d/90-breeze.conf
          gate: sddmBreezeUsable
        # GNOME targets: force password-only auth at the GDM greeter so
        # pam_gnome_keyring always unlocks the login keyring.
        - path: etc/dconf/profile/gdm
          gate: gdm
        - path: "etc/dconf/db/gdm.d/*"
          gate: gdm
      removed:
        # Retired systemd system-sleep hooks for container proxy and open-design
        - path: /etc/systemd/system-sleep/cli-proxy-api.sh
        - path: /etc/systemd/system-sleep/open-design.sh
        # The Breeze drop-in de-brands an SDDM greeter. Fedora 44 KDE ships the
        # Plasma login manager, which has no theme engine at all -- no [Theme]
        # section and no themes directory -- so the intent is not merely unmet
        # there, it is unexpressible.
        #
        # A POSITIVE FACT, NOT THE INVERSE OF THE INSTALL GATE. Three host classes
        # have to come out right and !displayManagerSddm got the first one wrong:
        #   unknown display manager -> remove NOTHING. That fact is false when the
        #     probe could not answer, so the inverse turned an unreadable fact into
        #     an active removal on a real SDDM host.
        #   known host, drop-in not usable -> RETIRE. This covers a non-SDDM host
        #     and, unlike the old gate, an SDDM host that lost the breeze theme --
        #     which used to keep a Current=breeze file pointing at a theme that is
        #     gone, the broken login screen sddmBreeze exists to prevent.
        #   known SDDM host with the theme -> KEEP. It is the install case.
        - path: /etc/sddm.conf.d/90-breeze.conf
          gate: sddmBreezeRetirable

    sudoers:
      overrides:
        # sudoers(5): drop-ins must be mode 0440 (sudo ignores
        # group/world-writable files) and the filename must not contain '.'
        # or end in '~'. VM-only so password-less sudo never lands on bare
        # metal; visudo-checked everywhere.
        - path: "etc/sudoers.d/*"
          mode: "440"
          gate: vm
          check: visudo

    sysctl: {}

    udev:
      overrides:
        # Power the driverless discrete GPU off on an integrated-only host. It
        # must never land on a desktop or on a hybrid host that keeps its driver.
        - path: etc/udev/rules.d/80-nvidia-integrated-only.rules
          gate: integratedOnly
      removed:
        # Retired uinput and receiver udev rules
        - path: /etc/udev/rules.d/80-uinput.rules
        - path: /etc/udev/rules.d/logitech-receiver.rules
        - path: /etc/udev/rules.d/70-uinput-solaar.rules
        # The power-off rule retires where a hybrid host keeps its driver again
        # (the policy row was removed). A POSITIVE fact gates it: an unknown host
        # resolves it false and removes nothing.
        - path: /etc/udev/rules.d/80-nvidia-integrated-only.rules
          gate: nvidiaHybridDriver

    hardware:
      overrides:
        # thinkpad_acpi module config/load only makes sense on a ThinkPad.
        - path: etc/modprobe.d/thinkpad_acpi.conf
          gate: thinkpad
        - path: etc/modules-load.d/thinkpad_acpi.conf
          gate: thinkpad
        # Render offload and runtime power management for a laptop's discrete
        # GPU. A desktop with a single discrete card has nothing to offload to,
        # and an integrated-only host has no driver to configure.
        - path: etc/modprobe.d/nvidia-hybrid-power.conf
          gate: nvidiaHybridDriver
        - path: etc/modprobe.d/nvidia-hybrid-modeset.conf
          gate: nvidiaHybridDriver
        # Driver blacklist for a hybrid host the fleet runs integrated-only.
        - path: etc/modprobe.d/nvidia-integrated-only.conf
          gate: integratedOnly
      removed:
        # Retired kernel-install(8) drop-in for VirtualBox module signing
        - path: /etc/kernel/install.d/50-vbox-sign.install
          distro: fedora
        # The hybrid drop-ins retire where the driver stack is withdrawn. A
        # POSITIVE fact gates the retirement, as sddmBreezeRetirable does for the
        # desktop subsystem: an unknown host resolves it false and removes
        # nothing.
        - path: /etc/modprobe.d/nvidia-hybrid-power.conf
          gate: integratedOnly
        - path: /etc/modprobe.d/nvidia-hybrid-modeset.conf
          gate: integratedOnly
        # The blacklist retires on the reverse transition, when a hybrid host
        # keeps its driver again, so a reinstalled stack can load.
        - path: /etc/modprobe.d/nvidia-integrated-only.conf
          gate: nvidiaHybridDriver

    # Sleep policy is a laptop concern, gated on the battery fact. Its own
    # subsystem rather than a passenger on the hibernation-storage installer,
    # which is wrapped in a Fedora-and-btrfs condition and carries no fact
    # machinery.
    sleep:
      overrides:
        - path: "etc/systemd/sleep.conf.d/*"
          gate: battery
        - path: "etc/systemd/logind.conf.d/*"
          gate: battery

    # Fingerprint authentication on Fedora. The feature set is data; which hosts
    # get it is the fingerprintReader fact plus the greeter check the installer
    # makes before enabling anything.
    fingerprint:
      authselectFeatures:
        - with-fingerprint

    bluetooth: {}
