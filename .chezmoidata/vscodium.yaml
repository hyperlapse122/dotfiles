# .chezmoidata/vscodium.yaml — single source of truth for VSCodium extensions.
#
# Declare gallery extension IDs (publisher.name) here; the reconcilers install
# missing ones and force-update the declared ones:
#   - POSIX (Linux AND macOS): .chezmoiscripts/30-linux/
#     run_onchange_after_install-vscodium-extensions.sh.tmpl
#   - Windows: .chezmoiscripts/30-windows/
#     run_onchange_after_install-vscodium-extensions.ps1.tmpl (native
#     PowerShell; validates this authority at render AND at runtime before
#     any mutation, and fails closed)
# Each list is rendered into its script body, so editing it re-triggers the
# run_onchange — add/bump extensions HERE, not in the scripts. Both renderers
# produce the SAME managed set by construction.
#
# Additive only: extensions installed by hand are never uninstalled, and
# removing an entry here merely stops managing it — uninstall by hand
# (`codium --uninstall-extension <id>`).
#
# VSCodium resolves IDs against its configured gallery (Open VSX by default);
# some Microsoft-marketplace-only extensions do not exist there.
vscodium:
  extensions:
    - anthropic.claude-code
    - biomejs.biome
    - tamasfe.even-better-toml
    - void-zero.vite-plus-extension-pack
    - openai.chatgpt
