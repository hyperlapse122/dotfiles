# Manifest of networking config provisioned onto every desktop OS from
# .chezmoidata/networking.yaml (`networking.wifi`), by the OS-native
# import-wifi-1password tools in dot_local/bin:
#
#   Linux   ~/.local/bin/import-wifi-1password (NetworkManager, nmcli/polkit,
#           rendered from private_executable_import-wifi-1password.tmpl), driven
#           on apply by .chezmoiscripts/30-linux/run_onchange_after_import-wifi-1password.sh.tmpl.
#   macOS   ~/.local/bin/import-wifi-1password-macos (user-scope configuration
#           profiles via profiles(1); rendered from
#           private_executable_import-wifi-1password-macos.sh.tmpl). Real runs
#           need sudo (profiles(1) requirement); --dry-run does not.
#
# Currently a single top-level key `wifi`; the file is named `networking` (not
# `wifi`) to leave room for future ethernet/dns/vpn siblings without another
# .chezmoidata file rename.
#
# Single source of truth (like agents.yaml): declare every Wi-Fi
# network HERE, not by editing 1Password items or the scripts. Only the networks
# enumerated below are provisioned. Each tool adds or overwrites its OS profile
# store to match this file: a missing network is added, an existing one is
# overwritten, and --force recreates it from scratch.
#
# PLATFORM SUPPORT MATRIX (per manifest field):
#   ssid / psk / open      : both tools.
#   priority               : Linux — connection.autoconnect-priority (-999..999).
#                            macOS — NOT expressible in a Wi-Fi payload;
#                            warned about and ignored.
#   ipv4.dns / ipv6.dns /  : Linux — per-family connection DNS, fully applied.
#   ignoreAutoDns            macOS — NOT expressible in a native Wi-Fi profile
#                            (per-interface/service DNS is live state, not
#                            per-network profile state); warned about and
#                            ignored. The defaults below therefore apply to
#                            Linux only.
#
# SECRETS — op:// references, resolved at chezmoi RENDER time. Any string VALUE
# that begins exactly with `op://` is passed to onepasswordRead when the tools
# are rendered; every other string is used verbatim. So `ssid` and `psk` may
# each be EITHER a literal ("MyHome_5G") OR a 1Password reference
# ("op://Private/Home Wi-Fi/password"). This is the resolve-op-refs-json.tmpl
# rule (the same one used by agent configs), applied to this whole
# structure — so a per-network DNS entry could even be an op:// ref too.
#
# Because secrets are resolved at RENDER time, every rendered tool CONTAINS the
# real PSKs — which is exactly why each source carries the `private_` attribute
# (owner-only), NOT the world-readable 0755 of an ordinary ~/.local/bin tool,
# and why each is OS-gated in dot_local/bin/.chezmoiignore so secrets are never
# baked into the wrong platform's copy. At RUNTIME the native tools never place
# a PSK on a command line or in a log: macOS hands the key to the OS
# through an owner-only TRANSIENT profile file (.mobileconfig) deleted on
# every exit path through one shared trap, after which the imported profile
# is owned by the OS store. The Linux tool's nmcli argv
# trade-off is documented in its own header. The run_onchange fingerprint
# hashes THIS file's RAW text (the op:// refs, never the resolved passwords), so
# no secret enters chezmoi state / `chezmoi diff`. Trade-off (same as
# agents.toml): rotating a PSK's VALUE in 1Password alone does NOT re-trigger
# the import — the raw ref is unchanged — so after a rotation re-run the
# platform's import-wifi-1password tool by hand or `chezmoi apply --force`.
#
# Shape (networking.wifi):
#   defaults — applied to every network unless the network overrides that field:
#     ipv4.dns      : list of IPv4 DNS servers -> the connection's ipv4.dns.
#                     [] = no manual v4 DNS (keep DHCP-provided).
#     ipv6.dns      : list of IPv6 DNS servers -> the connection's ipv6.dns.
#                     [] = no manual v6 DNS (keep RA/DHCPv6-provided).
#     ignoreAutoDns : one flag applied to EACH family with manual entries -
#                     true sets that family's ignore-auto-dns to yes (so ONLY the
#                     manual `dns` is used, DHCP/RA-provided DNS ignored). A
#                     family with an empty `dns` list is untouched — an IPv4-only
#                     manifest does NOT flip ipv6.ignore-auto-dns.
#   networks — list, one entry per network:
#     ssid          : REQUIRED. The network name. Literal or op:// ref.
#     psk           : the WPA/WPA2/WPA3-personal passphrase. Literal or op:// ref.
#                     Omit (or leave empty) for an OPEN network (key-mgmt none).
#     priority      : optional int in -999..999. Linux -> connection.autoconnect-
#                     priority (NM autoconnects to the highest-priority known
#                     network, default 0) — e.g. give a dual-band router's 5GHz
#                     SSID 10 and leave its 2.4GHz sibling unset. Absent = left
#                     at NM's default, and never clobbered on an existing
#                     connection. macOS -> ignored with a warning.
#     ipv4.dns      : optional per-network override of defaults.ipv4.dns.
#     ipv6.dns      : optional per-network override of defaults.ipv6.dns.
#     ignoreAutoDns : optional per-network override of defaults.ignoreAutoDns.
#
#   Declarative model: an EXISTING profile/connection is overwritten, so on
#   Linux any manual DNS on a family whose overridden list is empty is CLEARED
#   back to DHCP/RA. Set a family's `dns: []` to explicitly opt that family
#   out; leave the family absent to inherit the defaults.
#
# Enterprise (802.1x) and WPA3-only SAE networks are out of scope because a
# plain PSK cannot express them.
networking:
  wifi:
    defaults:
      # Cloudflare's public dual-stack resolvers.
      ipv4:
        dns: ["1.1.1.1", "1.0.0.1"]
      ipv6:
        dns: ["2606:4700:4700::1111", "2606:4700:4700::1001"]
      ignoreAutoDns: true
    # Add one entry per network. `ssid` and `psk` may be an `op://` reference or a
    # literal.
    # Examples:
    #   - ssid: "op://Private/Home Wi-Fi/network name"
    #     psk: "op://Private/Home Wi-Fi/password"
    #     priority: 10
    #   - ssid: "MyHome_2G"
    #     psk: "op://Private/Home Wi-Fi/password"
    #   - ssid: "GuestOpen"
    #     ipv4: { dns: [] }
    #     ipv6: { dns: [] }
    #   - ssid: "V6PriorityNet"
    #     psk: "op://Private/V6/password"
    #     ipv6: { dns: ["2620:fe::fe"] }
    networks:
      - ssid: "op://Private/KT HomeHub 5G/name"
        psk: "op://Private/KT HomeHub 5G/password"
      - ssid: "op://Private/CPS-01/name"
        psk: "op://Private/CPS-01/password"
