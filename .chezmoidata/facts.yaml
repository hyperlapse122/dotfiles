# Named host-fact registry — the NAMES, their types, and what each one gates.
#
# Single source of truth for host IDENTITY: what a host *is* (its OS, distro,
# desktop, hardware, virtualization, and the platform features the /etc manifest
# gates on). It is NOT what happens to be installed at the moment a script runs —
# `command -v kwriteconfig6`, `command -v codium`, a live D-Bus session, a `sudo -n`
# credential cache: those describe the moment, not the machine, and they stay as
# plain runtime probes in bash. Datafying them would fold this repo's own install
# order into the fact set.
#
# ---------------------------------------------------------------------------
# The model: gate ASSIGNMENT is data, gate RESOLUTION is code.
#
# This file declares the NAME of every fact and nothing else — the probe
# expressions live in code, exactly the way .chezmoidata/system.yaml declares a
# gate NAME per /etc path while the installer owns `gate_ok()`. A shell probe
# spelled as a YAML value would be code hiding in data.
#
# Three layers, and which one owns a fact is decided by WHERE its probe can run
# (see `probe:` below):
#
# The cache is NOT boolean-only. write_facts_cache emits `<name>: true|false` for a
# bool fact and `<name>: <value>` for a string one (`""` for the empty string), and
# facts.tmpl parses it PER LINE: a line it cannot read is dropped on its own and
# that fact falls back to its declared absentDefault, rather than voiding the whole
# file. That distinction is load-bearing — `headless` and `virt` default to true, so
# a whole-file void skips the entire /etc install set on an ordinary desktop with a
# successful exit code. The writer validates its own output before publishing it and
# names any line it drops on stderr, so a defect in the writer cannot hide behind the
# reader's tolerance. A string fact's value must match [A-Za-z0-9._-]+ or it is
# written as the empty skip value; that is the same charset facts-sh.tmpl requires
# for an unquoted shell assignment.
#
#   probe: hook      .install-prerequisites.sh (write_facts_cache) — chezmoi's
#                    read-source-state.pre hook, so it runs ONCE per chezmoi
#                    command, before the source state is read. It writes
#                    ${XDG_CACHE_HOME:-~/.cache}/chezmoi/facts.yaml. A fact lands
#                    here when it needs a subprocess or a symlink walk, because
#                    the template functions cannot do that job: `output`
#                    propagates a non-zero exit as a template error that ABORTS
#                    the render (systemd-detect-virt --vm exits 1 on bare metal),
#                    and `glob` does not traverse symlinks — /sys/bus/pci/devices/*
#                    is nothing but symlinks, so a template-side PCI walk misses a
#                    GPU behind a PCIe bridge and reports nvidia=false on a host
#                    that has one.
#   probe: template  .chezmoitemplates/facts.tmpl — an in-process `stat`, a
#                    stat-guarded `include`, or a `glob`. No subprocess, so it
#                    costs nothing per render.
#   probe: builtin   .chezmoitemplates/facts.tmpl, straight from chezmoi's own
#                    template data (.chezmoi.os, .chezmoi.osRelease.id, lookPath).
#
# facts.tmpl merges all three into ONE map. Consumers never read this file or the
# cache directly:
#
#   templates / .chezmoiignore / deployed file content
#       {{ $f := includeTemplate "facts.tmpl" . | fromYaml }} … {{ if $f.nvidia }}
#   scripts
#       {{ includeTemplate "facts-sh.tmpl" . }}   → FACT_NVIDIA=1, FACT_DESKTOP=gnome, …
#   data files that name a gate (system.yaml `gate:`)
#       {{ includeTemplate "facts-validate.tmpl" (dict "ctx" . "gates" (list …)) }}
#
# ---------------------------------------------------------------------------
# Gate-expression grammar (what a `gate:` / `gates:` value may say):
#
#   <fact>          boolean fact is true          nvidia, thinkpad, gdm
#   !<fact>         boolean fact is false         !virt
#   <fact>.<value>  string fact equals value      desktop.kde, distro.fedora
#
# facts-validate.tmpl checks the fact half of every expression against this
# registry and FAILS THE APPLY on an unknown name, listing the valid ones — the
# same loud abort the /etc installer already does for an unknown `gate:`. It also
# fails when a name declared here has no probe behind it, and when a probe emits
# a name that is not declared here: a fact never silently evaluates false because
# someone typo'd it.
#
# ---------------------------------------------------------------------------
# Adding a fact:
#
#   1. Declare it here (name, type, probe layer, gates, whenFalse; hook facts also
#      declare their fail-safe `absentDefault`).
#   2. Implement the probe in the layer you named — write_facts_cache in
#      .install-prerequisites.sh, or facts.tmpl. Skipping this step aborts the
#      apply; it does not silently resolve false.
#   3. Pick the layer by whether the probe needs a subprocess/symlink walk (hook)
#      or is a plain file test (template). When in doubt, template — it is free.
#
# `whenFalse:` is not decoration. Every fact here is FAIL-SAFE, but the safe value
# is PER FACT, not a uniform false. Every `probe: hook` entry declares that value
# once as `absentDefault`; facts.tmpl discovers the hook set from the registry and
# reads it. The rule: the value a fact takes when the cache is missing must SKIP
# the thing it gates, never grant it.
#
# For most facts that is `false`, because the gate reads `<fact>` and false means
# skip. `vm` is the one gating a PRIVILEGE GRANT (etc/sudoers.d/* → %wheel NOPASSWD),
# so its false direction — no password-less sudo — is the only safe one.
#
# TWO facts are INVERTED, so a uniform false would FAIL OPEN:
#   virt      `bareMetalPackages` gates on `!virt`, so false INSTALLS the bare-metal
#             set. Its safe absent-value is TRUE.
#   headless  headless-guard SKIPS when the fact is 1, so false lets a headless
#             server run the desktop/system provisioning that guard exists to keep
#             off it. Its safe absent-value is TRUE.
#
# A new hook fact whose gate reads `!<fact>`, or whose guard skips on true, declares
# `absentDefault: true` and says why in `whenFalse:`. A fact that cannot be written
# so that ONE of its two values is harmless does not belong in this registry.
factRegistry:
  # --- OS / distro / desktop (chezmoi builtins) ------------------------------
  os:
    type: string
    probe: builtin
    values: [linux, darwin]
    source: .chezmoi.os
    gates: >-
      Everything OS-specific: the .chezmoiignore per-OS blocks and every
      script's {{ if eq .chezmoi.os "linux" }} gate.
    whenFalse: n/a — always resolves to exactly one value.
  distro:
    type: string
    probe: builtin
    values: [fedora, ubuntu, ""]
    source: .chezmoi.osRelease.id (empty on darwin — no /etc/os-release)
    gates: >-
      The Fedora package installer (20-linux-fedora), the Ubuntu/Jetson installer
      (20-linux-ubuntu), the LUKS TPM2 path, the compile-time gate on the authd
      login-shell branch, and system.yaml's per-distro `removed:` entries. Fedora
      and Ubuntu are the managed Linux distributions; Ubuntu is opened only as far
      as bootstrap, package-source trust, and the Jetson profile require.
    whenFalse: >-
      Empty (non-Linux): every distro-gated script renders to nothing on that OS.
  desktop:
    type: string
    probe: builtin
    values: [kde, gnome, none]
    source: >-
      lookPath "plasmashell" → kde, else lookPath "gnome-shell" → gnome, else none.
      Keyed on the shell binary the ISO shipped, so it is stable from first boot
      (neither binary comes from this repo's package lists). KDE wins when both are
      present — the precedence encoded in .chezmoitemplates/facts.tmpl (lookPath
      plasmashell first, then gnome-shell).
    gates: >-
      desktop and IME packages; the 50-linux-kde and
      50-linux-gnome script guards; the per-desktop fcitx5 launch mechanism
      (KDE via KWin virtualkeyboard, GNOME via XDG autostart + Kimpanel);
      the pinentry choice.
    whenFalse: >-
      `none` (headless, container, CI — neither shell binary on PATH): neither
      per-desktop package set installs, and the KDE variant renders for the
      file-content consumers, which is what keeps CI artifacts deterministic and
      inert. See .chezmoitemplates/facts.tmpl.

  # --- Hardware (shell probes; the cache is why they are correct) ------------
  nvidia:
    type: bool
    probe: hook
    absentDefault: false
    source: >-
      PCI vendor 0x10de anywhere under /sys/bus/pci/devices/*/vendor. The fact
      identifies an NVIDIA GPU device on the PCI bus (including PCIe bridges and 3D
      controllers on Thor). All paths gated by `nvidia` are Fedora-specific driver and
      DKMS paths, fully isolated from Jetson/Ubuntu by distro gates. On a Jetson, CUDA is
      supplied by the vendor's nvidia-jetpack BSP metapackage and is gated on `jetson`.
    gates: >-
      nvidiaPackages (RPM Fusion's akmod driver stack plus the
      CUDA/libnvidia-container repos on Fedora), the nvidia-persistenced
      service, and the Fedora MOK enrollment path that signs the DKMS module.
      FORCE_NVIDIA=1 overrides it IN THE INSTALLER ONLY (see the
      FORCE_* note at the bottom).
    whenFalse: >-
      No driver, no CUDA repo, no container toolkit, no MOK enrollment. On a host
      whose GPU sits behind a PCIe bridge the hook's grep still finds it, where a
      template-only glob would not — that is why this one stays a hook probe.
      COEXISTS WITH gpuArch, deliberately, and is NOT superseded by it. This fact
      still decides whether .chezmoiscripts/30-components/10-nvidia.sh is deployed
      at all (the root .chezmoiignore gates on it); gpuArch decides what that
      script then does. Gating deployment on gpuArch instead would un-deploy the
      very script that must declare the unlisted-device skip, and that skip is the
      only thing standing between an unlisted GPU and a silently driverless host.
  gpuDeviceId:
    type: string
    probe: hook
    absentDefault: ""
    source: >-
      The PCI device id of the host's NVIDIA DISPLAY device, four hex digits with no
      0x prefix (a Quadro P520 gives 1d34). Class-filtered to 0x03* so an NVIDIA audio
      or USB-C function on the same card is not mistaken for the GPU. Raw hardware
      identity only — every policy statement about it is data in .chezmoidata/nvidia.yaml.
      Hook-probed because /sys/bus/pci/devices/* is a directory of symlinks and `glob`
      does not traverse them.
    gates: >-
      Nothing directly. It is the input gpuArch maps through the declared device table;
      no gate expression should name it, because an id is hardware trivia and a branch
      decision is policy.
    whenFalse: >-
      Empty — no NVIDIA display device, or the walk could not read sysfs. gpuArch then
      resolves empty too and every NVIDIA-gated path skips.
  gpuArch:
    type: string
    probe: template
    values: ["", ampere, pascal]
    source: >-
      gpuDeviceId looked up in nvidia.deviceArchitectures (.chezmoidata/nvidia.yaml).
      An id the table does not list resolves to the EMPTY STRING, and so does an absent
      cache. Extend `values:` only when a genuinely new architecture appears; adding a
      device id to an architecture that already exists is a data row and needs no
      registry edit.
    gates: >-
      Which driver branch the Fedora NVIDIA installer selects — its package set, its
      repository and exclusion policy, its module-signing certificate, and whether
      nvidia-persistenced is enabled. Read by the NVIDIA installer as $FACT_GPU_ARCH (through facts-sh.tmpl), in resolve_nvidia_branch's case statement -- NOT through a manifest gate. No gpuArch.<value> gate expression exists today; a manifest entry that wants one would be the first.
    whenFalse: >-
      Empty. Every NVIDIA-gated path inside the installer skips, and the installer
      declares that skip naming the unmatched device id so the operator can add a
      table row. The empty string is the skip value on purpose: a consumer that tests
      the fact for plain truthiness skips rather than installs, where a non-empty
      sentinel such as `none` would be TRUE in a Go template and install everywhere.
  hybridGraphics:
    type: bool
    probe: hook
    absentDefault: false
    source: >-
      An NVIDIA display device AND a display device from another vendor on the PCI
      bus — what an Optimus-style laptop looks like. Hook-probed for the same reason
      the vendor walk is: /sys/bus/pci/devices/* is a directory of symlinks.
    gates: >-
      Nothing directly in the manifest. It is one input of the two template facts
      integratedOnly and nvidiaHybridDriver, which own the hybrid drop-ins, the
      driver blacklist, and the udev power-off rule; the NVIDIA installer reads it
      as $FACT_HYBRID_GRAPHICS to enable the driver's sleep units.
    whenFalse: >-
      Both derived facts resolve false, so no hybrid drop-in, blacklist, or udev rule
      is installed or retired, and the sleep units stay disabled. A desktop with a
      single discrete card must not receive the hybrid options — offloading to an
      integrated GPU it does not have would be a broken display, so absent-means-skip
      is the only safe direction.
  integratedOnly:
    type: bool
    probe: template
    source: >-
      gpuArch is listed in nvidia.integratedOnlyArchitectures (.chezmoidata/nvidia.yaml)
      AND hybridGraphics is true. A hybrid laptop whose discrete GPU architecture the
      fleet has declared not worth a driver. ONE fact because a manifest entry carries
      ONE gate expression and the grammar has no conjunction form.
    gates: >-
      The NVIDIA installer's integrated-only skip (read as $FACT_INTEGRATED_ONLY before
      any branch resolves), the driver blacklist drop-in and the udev rule that hand the
      driverless GPU to PCI runtime power management, and the retirement of the two
      hybrid power-management drop-ins.
    whenFalse: >-
      Nothing is powered off and nothing is retired; the host keeps whatever the other
      NVIDIA facts select. Both inputs already fail-safe to this direction, so an
      unreadable cache leaves a working driver in place rather than blacklisting one.
      The discrete GPU stays enumerated on the PCI bus while powered off, so the hook
      keeps seeing it and the classification holds on every later apply.
  nvidiaHybridDriver:
    type: bool
    probe: template
    source: >-
      hybridGraphics AND NOT integratedOnly — a hybrid host that keeps the proprietary
      driver. The complement of integratedOnly inside the hybrid set, so the hybrid
      drop-ins are never installed and retired on the same run.
    gates: >-
      etc/modprobe.d/nvidia-hybrid-power.conf and nvidia-hybrid-modeset.conf, the
      runtime power-management and render-offload options for a laptop's discrete GPU.
    whenFalse: >-
      Neither drop-in is installed. Either the host is not hybrid, which is the
      direction hybridGraphics already took, or it is integrated-only and the drop-ins
      are being retired instead.
  battery:
    type: bool
    probe: hook
    absentDefault: false
    source: >-
      A power supply with type Battery whose `scope` is not `Device`. THE SCOPE CHECK
      IS LOAD-BEARING: a wireless mouse or keyboard registers an ordinary power supply,
      and this fleet already runs a mouse-battery watcher on desktops, so `type ==
      Battery` alone would make every such desktop claim laptop power behaviour. A
      chassis battery whose driver predates the attribute has no `scope` file and is
      treated as System.
    gates: >-
      The systemd sleep policy (suspend-then-hibernate) on laptops.
    whenFalse: >-
      Treated as a desktop, which is the behaviour every host had before this axis
      existed — so a missing probe changes nothing.
  fingerprintReader:
    type: bool
    probe: hook
    absentDefault: false
    source: >-
      A USB device whose vendor/product pair appears in .chezmoidata/.fingerprint-readers.tsv.
      There is NO generic sysfs signal for a fingerprint reader — they present a
      vendor-specific interface class and expose no product string — so the identity is
      declared rather than detected. The table is dot-prefixed TSV because the hook reads
      it directly: the hook runs before the source state and has no YAML parser, and a
      dot-prefixed name keeps the file out of the merged template data. Deliberately NOT
      a probe of fprintd or its PAM module, which describe what is installed at this
      moment rather than what the machine is.
    gates: >-
      Whether the Fedora authselect fingerprint feature is applied at all.
    whenFalse: >-
      The feature is not applied. An unlisted reader therefore enables no authentication
      factor, which is the only safe direction for hardware nobody verified.
  displayManager:
    type: string
    probe: hook
    absentDefault: ""
    source: >-
      The bare unit name behind the /etc/systemd/system/display-manager.service alias
      symlink (plasmalogin, gdm, sddm). The same signal `headless` already trusts as a
      reliable positive; hook-probed because resolving a symlink target is not something
      the template layer can do. No `values:` is declared: any display manager may appear
      on a host, and the bounded decisions are made through displayManagerSddm below.
    gates: >-
      Nothing directly today. Greeter-shaped configuration gates on displayManagerSddm,
      which is bounded and negatable; this fact carries the identity for reporting and
      for a future per-greeter decision.
    whenFalse: >-
      Empty — no display manager is enabled, which is also what `headless` reports.
  displayManagerSddm:
    type: bool
    probe: template
    source: >-
      displayManager equals "sddm". A BOOLEAN COMPANION to a string fact, and the reason
      is the gate grammar: facts-validate rejects a negated value comparison, so "this
      host does not run SDDM" cannot be written as !displayManager.sddm. The retirement
      entry for the SDDM greeter drop-in needs exactly that negation.
    gates: >-
      Nothing directly. It is the input both sddmBreezeUsable and sddmBreezeRetirable are
      derived from, so the SDDM comparison has ONE definition; no manifest entry names it.
    whenFalse: >-
      This host does not run SDDM -- OR the displayManager probe could not answer, which
      resolves the same false. That ambiguity is exactly why no manifest entry may gate on
      the inverse of this fact: !displayManagerSddm would turn an unreadable probe into an
      active removal. sddmBreezeRetirable exists to separate the two.
  thinkpad:
    type: bool
    probe: template
    source: >-
      /sys/class/dmi/id/product_version or /sys/class/dmi/id/product_family contains
      "ThinkPad" (case-insensitive), read with a stat-guarded `include`. NOT
      sys_vendor: that field holds the MANUFACTURER (LENOVO on every Lenovo consumer
      laptop, "Micro-Star International Co., Ltd." on this host) and never the model
      string. This replaces a `sudo dmidecode -t system` grep, which matched the same
      two DMI fields — at the cost of a sudo call in a file-install loop.
    gates: etc/modprobe.d/thinkpad_acpi.conf, etc/modules-load.d/thinkpad_acpi.conf.
    whenFalse: The ThinkPad ACPI module is neither configured nor force-loaded.
  jetson:
    type: bool
    probe: template
    source: >-
      stat /etc/nv_tegra_release. NVIDIA's own BSP documentation reads that file to
      identify the L4T release, and apply_binaries.sh copies it into every flashed
      rootfs, so it is the most stable Jetson marker across JetPack versions. NOT
      /proc/device-tree/model or .../compatible: those carry the hardware device-tree
      model, which a custom device tree changes. NOT the `nvidia` fact alone — Thor's
      Blackwell GPU is on PCIe, but Jetson behavior is discriminated by `jetson`.
    gates: >-
      The JetPack package delivery in 20-linux-ubuntu (nvidia-jetpack and the
      Jetson-gated package rows), the sharedHost disjunction below, and the
      .chezmoiignore host-profile block that drops the 50-linux-kde scripts.
    whenFalse: >-
      No JetPack metapackage, no Jetson-gated package delivery, and the
      50-linux-kde scripts deploy normally. A non-Jetson host is unaffected.

  # --- Virtualization — TWO facts, deliberately ------------------------------
  vm:
    type: bool
    probe: hook
    absentDefault: false
    source: systemd-detect-virt --vm --quiet (VMs only; a container is NOT a vm).
    gates: >-
      etc/sudoers.d/* — password-less sudo (%wheel NOPASSWD). THE ONLY FACT IN THIS
      REGISTRY THAT GATES A PRIVILEGE GRANT: a throwaway VM gets the convenience, a
      bare-metal workstation never does.
    whenFalse: >-
      No password-less-sudo drop-in. This is the safe direction, and it is why the
      fact must never be merged with `virt` (a container is virt-true but vm-false,
      and NOPASSWD must not follow it into a distrobox that bind-mounts $HOME).
  virt:
    type: bool
    probe: hook
    absentDefault: true
    source: >-
      systemd-detect-virt --quiet, bare — true for a VM AND for a container. Not the
      same probe as `vm`, and not a superset by accident: the installer's IS_VIRT
      has always been the bare form.
    gates: bareMetalPackages — inverted, so the gate expression is `!virt`.
    whenFalse: >-
      Inverted gate: virt=false is what INSTALLS the bare-metal set (firmware tools,
      power management, hardware daemons). virt=true skips it — the direction that
      keeps host-hardware packages out of a VM/container.

  # --- Distro flavor / platform features -------------------------------------
  sddmBreezeUsable:
    type: bool
    probe: template
    source: >-
      sddmBreeze AND displayManagerSddm — the Breeze SDDM theme is installed AND
      this host actually runs SDDM. ONE fact because a manifest entry carries ONE
      gate expression and the shared helper has no conjunction form. Gating the
      theme drop-in on the display manager alone would drop the theme-presence
      guard, which exists because forcing the theme without it yields a broken
      login screen; gating on the theme alone would install the drop-in on a
      non-SDDM host that happens to carry the theme, and the retirement entry
      would then remove it on the same run.
    gates: etc/sddm.conf.d/90-breeze.conf (de-brands the login greeter to Breeze).
    whenFalse: >-
      The drop-in is not installed, either because the theme is absent or because
      this host does not run SDDM. Both are the safe direction.
  sddmBreezeRetirable:
    type: bool
    probe: template
    source: >-
      displayManager is NON-EMPTY and sddmBreezeUsable is false -- a POSITIVE fact, which
      is the whole point. The retirement entry used to gate on !displayManagerSddm, and
      that fact is false on a host whose displayManager probe could not answer, so an
      unreadable probe DELETED the drop-in from a real SDDM host. Requiring a known display
      manager is what makes an unresolved fact skip rather than act, per the registry rule
      that false MUST skip rather than grant. The second half is the complement of the
      install gate rather than its own condition: an SDDM host that lost the breeze theme
      is not usable either, and under the old gate it neither installed the drop-in nor
      retired it, so it kept a Current=breeze file pointing at a theme that is gone.
    gates: >-
      /etc/sddm.conf.d/90-breeze.conf -- the retirement of the Breeze greeter drop-in.
    whenFalse: >-
      Nothing is removed. Either the display manager is unknown, so acting would be acting
      on a fact nobody could read, or the drop-in is usable here and belongs on this host.
  sddmBreeze:
    type: bool
    probe: template
    source: stat /usr/share/sddm/themes/breeze/theme.conf
    gates: etc/sddm.conf.d/90-breeze.conf (de-brands the login greeter to Breeze).
    whenFalse: >-
      The drop-in is not installed. Forcing Current=breeze without the theme present
      yields a BROKEN login screen, so absent-theme must skip, never install.
  gdm:
    type: bool
    probe: template
    source: >-
      stat /usr/share/gdm/greeter-dconf-defaults — the exact file-db the shipped
      /etc/dconf/profile/gdm references, so the probe tests the thing that has to
      exist rather than "is GNOME installed".
    gates: >-
      etc/dconf/profile/gdm and etc/dconf/db/gdm.d/* — the password-only GDM greeter
      (a fingerprint login hands PAM no secret and leaves the login keyring locked).
    whenFalse: >-
      No gdm dconf override (a KDE/SDDM host), and install-system-10-files skips its
      `dconf update`.
  fprintdPam:
    type: bool
    probe: template
    source: >-
      glob /usr/lib/*/security/pam_fprintd.so (or /lib/*/…) non-empty AND stat
      /etc/pam.d/common-auth. THE CONJUNCTION IS LOAD-BEARING — the common-auth half
      is what keeps this repo's Debian-shaped PAM stack off Fedora, whose rpm-owned
      polkit-1 includes system-auth instead. Drop it and a Fedora apply overwrites
      /etc/pam.d/polkit-1 with a stack that @includes a file Fedora does not have,
      breaking every polkit prompt on the host.
    gates: etc/pam.d/polkit-1 (fingerprint auth at polkit prompts).
    whenFalse: polkit prompts stay password-only — the distro default.

  # --- Host shape -------------------------------------------------------------
  headless:
    type: bool
    probe: hook
    absentDefault: true
    source: >-
      systemd default target != graphical.target AND no
      /etc/systemd/system/display-manager.service alias symlink (the symlink systemd
      creates when a DM is enabled — a reliable positive desktop signal;
      `systemctl list-unit-files display-manager.service` is not usable, it exits 0
      even when nothing matches). A host with no systemd resolves FALSE (treated as a
      desktop and configured), matching what headless-guard.sh.tmpl does today.
    gates: >-
      Every script behind headless-guard.sh.tmpl — the /etc install set and the
      desktop-shaped host tuning. INSTALL_SYSTEM_CONFIG_FORCE=1 overrides it in the
      guard, not here.
    whenFalse: >-
      Inverted: headless=false is the DESKTOP host, which is the one that gets
      configured. A server (headless=true) is skipped.
  container:
    type: bool
    probe: template
    source: >-
      (stat /run/.containerenv OR stat /.dockerenv) AND NOT stat /run/.toolboxenv.
      The toolbox/distrobox exclusion is the whole subtlety: both bind-mount the host
      $HOME and both create /run/.toolboxenv, so an apply inside one targets the REAL
      $HOME and must provision like a host, not skip. Only a "real" container — a
      Podman/Docker marker WITHOUT the toolbox marker — is one.
    gates: >-
      The root .chezmoiignore container block: every provisioning script and
      .config/garden/garden.yaml (whose GPG key the skipped 80-keys import
      would have provided).
    whenFalse: A normal host — everything deploys.
  sharedHost:
    type: bool
    probe: template
    source: >-
      A DISJUNCTION of three independently sufficient signals: stat
      /etc/dotfiles-shared-host (the operator's explicit declaration), the `jetson`
      fact above, or `.chezmoi.username` containing "@" (an authd/Entra-managed
      account, which only exists on a centrally-managed machine). Deliberately a
      TEMPLATE probe and not a hook one: all three resolve in-process, so the fact
      needs no cache and therefore declares no `absentDefault` — it cannot be wrong
      because a cache is missing. A head-count over `getent passwd` was rejected:
      authd enumeration depends on the daemon's ListUsers and can report only the
      users who have logged in.
    gates: >-
      The system-manifest install set (install-system-10-files, -20-host,
      -30-network) and every change to a system-wide daemon's identity or
      configuration — the Tailscale daemon enable, the Fedora CDI descriptor, unit
      enablement, and group and subid membership. Package installation and
      package-source trust are NOT gated: adding an apt source is additive delivery,
      and gating it would make a shared host unable to provision itself.
      INSTALL_SYSTEM_CONFIG_FORCE=1 overrides the headless guard ONLY and never
      this fact.
    whenFalse: >-
      The pre-existing unconditional behavior: the manifest installs and daemons are
      reconciled. RESIDUAL, accepted deliberately: a genuinely shared host with a
      local username, no Jetson, and no marker file resolves FALSE and so FAILS OPEN.
      The marker file is the fix and README.md documents it; a probe that guessed
      instead would be less predictable, not safer.

# ---------------------------------------------------------------------------
# FORCE_* overrides are NOT facts and never enter this registry.
#
# FORCE_NVIDIA exists so a GPU-less test container can still
# exercise the driver package set. It layers on TOP of a fact, in the package
# installer ONLY:
#
#   HAS_NVIDIA="$FACT_NVIDIA"; [[ "${FORCE_NVIDIA:-0}" == 1 ]] && HAS_NVIDIA=1
#
# It must never move into facts-sh.tmpl, because install-system-10-files shares
# that partial: a FORCE_* honoured there could layer a privilege-granting /etc
# drop-in onto a host whose fact is false — an escalation today's split
# deliberately blocks.
