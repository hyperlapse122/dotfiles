# thinkpad_acpi is loaded on every ThinkPad (see etc/modules-load.d) for the
# hotkey, LED and battery interfaces the desktop reads.
#
# fan_control=1 USED TO BE SET HERE and is deliberately gone. It only permits
# userspace fan control through /proc/acpi/ibm/fan; nothing in this repository
# ever read that interface, so it was an unowned surface with no consumer.
# Removing it returns fan management to the firmware, which is the safe
# direction. Re-add it in the same change that introduces the managed setting
# that needs it, never on its own.
