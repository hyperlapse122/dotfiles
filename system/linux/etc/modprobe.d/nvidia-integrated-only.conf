# Driver blacklist for a hybrid laptop the fleet runs on its integrated GPU only.
#
# Installed only where the integratedOnly fact holds. With no driver bound, the
# discrete GPU stays under PCI runtime power management and can be powered off
# (80-nvidia-integrated-only.rules sets power/control=auto). nouveau is listed
# so the in-kernel driver does not bind in the proprietary driver's absence.
# nova_core is not built on the current Fedora kernel; it is listed forward-
# looking to match the kernel arguments the NVIDIA driver package uses.
#
# `blacklist` only stops alias autoload. The `install` lines also fail an
# explicit modprobe: the driver package's nvidia-fallback.service runs
# `modprobe nouveau` when nvidia is absent, which would otherwise bind nouveau
# on a host that has not yet removed the package.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
blacklist nouveau
blacklist nova_core
install nvidia /bin/false
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
install nvidia_uvm /bin/false
install nouveau /bin/false
install nova_core /bin/false
