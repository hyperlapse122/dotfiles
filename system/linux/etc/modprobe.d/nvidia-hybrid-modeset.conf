# Kernel mode setting for the discrete GPU on a hybrid host.
#
# PRIME render offload needs the NVIDIA driver's KMS support so the compositor
# can import its buffers; without it an offloaded client has no path back to the
# integrated GPU's display.
#
# Installed only where the hybridGraphics fact is true, alongside
# nvidia-hybrid-power.conf.
options nvidia_drm modeset=1
