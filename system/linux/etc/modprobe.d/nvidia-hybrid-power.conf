# Runtime power management for a laptop's discrete NVIDIA GPU.
#
# On a hybrid host the discrete GPU is idle most of the time, and without these
# it stays at runtime_status=active on battery for a card nothing is using.
#
# NVreg_DynamicPowerManagement=0x02 lets the driver power the GPU down when no
# client holds it. NVreg_PreserveVideoMemoryAllocations=1 is what makes that safe
# across suspend: the driver saves video memory rather than assuming the GPU kept
# it, which is required once the GPU can lose power while suspended.
#
# Installed only where the hybridGraphics fact is true. A desktop with a single
# discrete card has nothing to offload to, so it must not receive these.
options nvidia NVreg_DynamicPowerManagement=0x02
options nvidia NVreg_PreserveVideoMemoryAllocations=1
