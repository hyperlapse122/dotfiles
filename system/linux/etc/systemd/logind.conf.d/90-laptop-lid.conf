# Closing the lid on a battery-powered machine starts the suspend-then-hibernate
# ladder that 90-laptop-suspend-then-hibernate.conf configures. Docked or on
# external power the machine keeps running, which is what an operator expects
# from a laptop used as a workstation.
#
# On hosts where Secure Boot kernel lockdown (integrity mode) disables
# hibernation (/sys/power/disk is disabled), systemd-logind automatically degrades
# suspend-then-hibernate to plain suspend.
#
# Installed only where the battery fact is true.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
