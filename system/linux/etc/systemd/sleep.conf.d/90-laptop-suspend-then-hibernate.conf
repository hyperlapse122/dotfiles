# A closed laptop should not run its battery flat.
#
# suspend-then-hibernate suspends first and hibernates before the battery is
# gone, which is why this repository already provisions a swapfile and a resume=
# argument. Plain suspend on this class of machine drains overnight.
#
# On hosts where kernel lockdown restricts hibernation (e.g. Secure Boot with
# integrity lockdown), the kernel disables /sys/power/disk and systemd-logind
# silently degrades suspend-then-hibernate to plain suspend.
#
# HibernateDelaySec is deliberately UNSET. With a battery present and no explicit
# delay, systemd tries the ACPI low-battery alarm first and otherwise schedules
# from the measured discharge rate — both strictly better than a constant a human
# picked. Setting a delay here would replace that with a worse guess.
#
# Installed only where the battery fact is true.
[Sleep]
MemorySleepMode=deep
