[ids]
*
# Logi Bolt receiver (MX Master 3S/4): leave it to libinput/Solaar. keyd
# matches vendor:product only and every receiver interface shares this id,
# so a keyboard paired through the same receiver would also be ignored.
-046d:c548

[control]
capslock=capslock

[main]
capslock=hangeul
leftshift+leftmeta+f23=layer(meta)
