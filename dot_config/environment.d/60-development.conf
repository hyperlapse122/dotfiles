# Rust
RUSTUP_INIT_SKIP_PATH_CHECK=yes

# .NET
DOTNET_CLI_TELEMETRY_OPTOUT=1
DOTNET_TELEMETRY_OPTOUT=1
COMPlus_EnableDiagnostics=0

# Turborepo
TURBO_TELEMETRY_DISABLED=1

# Codex
CODEX_UNSAFE_ALLOW_NO_SANDBOX=1

# codegraph
CODEGRAPH_TELEMETRY=0

# Claude Code: the binary is pinned in .chezmoidata/releases.json; bump it there.
# Without this the updater fetches a full build into ~/.local/share/claude/versions
# that the pinned launcher never runs, then reports the pin as behind. It turns off
# the BACKGROUND updater only -- a deliberate `claude update` still works.
# agents.claude.settings carries the same value for macOS, where this file is absent.
DISABLE_AUTOUPDATER=1

# agent-browser
AGENT_BROWSER_SKILLS_DIR=${HOME}/.agents/skills

# compound-engineering: disable the cross-model review peer pass
CROSS_MODEL_MAX_PEERS=0

# Android
ANDROID_HOME=${HOME}/.local/share/android-sdk
ANDROID_SDK_ROOT=${HOME}/.local/share/android-sdk
