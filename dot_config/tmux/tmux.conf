# ~/.config/tmux/tmux.conf — managed by chezmoi.
#
# Four settings, two purposes: omp's inline images, and modified-key reporting.
# Edit this source file, never the deployed copy.
# Docs: https://man.openbsd.org/tmux

# --- omp inline images ---
#
# The next two settings are a PAIR. Neither works alone, and removing either one
# silently degrades images rather than failing loudly. Treat a change to one as a
# change to both.

# tmux carries no Kitty-graphics handling of its own, so omp wraps its graphics
# escape in tmux's passthrough DCS. Upstream default is `off`, which makes tmux
# DISCARD that payload, so no pixels ever reach Kitty. `on` permits it from a
# visible pane; `all` would also permit it from panes tmux considers invisible,
# which the image path never needs — keep the narrower value.
#
# Do NOT test this with `kitten icat` and conclude the setting is unnecessary:
# tmux forwards a BARE Kitty APC whatever this option says and gates only the
# DCS-wrapped form, and icat falls back to the bare form. omp has no such
# fallback — it wraps every graphics emission — so this option is load-bearing
# for omp specifically. `.ci/test-tmux-kitty-passthrough.sh` probes the wrapped
# form, which is why it can tell the two apart.
#
# Accepted tradeoff: a visible pane can now send arbitrary escape sequences to
# Kitty, not only graphics. Kitty's remote-control API stays disabled, which is
# the bound; clipboard, title and notification sequences are residual risk.
#
# Cross-tool coupling: every aoe `[tmux]` setting defaults to `auto`, which
# means "step aside for the user's tmux config". Naming `allow-passthrough`
# here is enough to make aoe's clipboard `auto` drop its own
# `set -s set-clipboard on`, and the mere existence of this file makes its
# status_bar `auto` drop the themed session bar. `.chezmoidata/agents.yaml`
# pins both to `enabled` for that reason; check that data before adding any
# option aoe manages (status*, mouse, set-clipboard, allow-passthrough).
set -g allow-passthrough on

# omp turns Kitty Unicode placeholders on only for a `kitty` or `ghostty`
# terminal identity, or for tmux plus an explicitly forced protocol. Inside tmux
# KITTY_WINDOW_ID is absent and TERM_PROGRAM reports tmux, so identity never
# resolves to Kitty — and without placeholders tmux does not own the image cells,
# so an image that did reach the screen would be erased on the next frame.
# Forcing the protocol here is what turns placeholders on.
#
# This lives in tmux config rather than in ~/.config/environment.d/ on purpose:
# a systemd user-environment entry would force the Kitty protocol in bare Kitty,
# editor terminals and ssh sessions where it is wrong. Scoping it to tmux makes
# "only inside tmux" structural instead of conditional.
#
# Known limitation: the force is unconditional inside tmux, so attaching this
# server from a terminal that cannot draw Kitty graphics shows escape sequences
# instead of images. Unset it for that session by hand if that happens.
set-environment -g PI_FORCE_IMAGE_PROTOCOL kitty

# --- modified keys ---

# Upstream default is `off`, which collapses Shift+Enter into a bare carriage
# return. omp binds newline insertion to Shift+Enter, so it silently stops
# working under tmux and only the Ctrl+J fallback survives. `on` lets the
# application request the reporting mode itself; `always` would force mode 1
# over the application's own choice.
set -g extended-keys on

# csi-u is the format upstream pi documents alongside the setting above. The
# option arrived in tmux 3.5, so guard it — without the guard an older tmux
# reports a config error on every start. tmux compares these values lexically
# rather than semantically, which is correct for a 3.5 threshold and stays
# correct through 3.9.
%if #{>=:#{version},3.5}
set -g extended-keys-format csi-u
%endif
