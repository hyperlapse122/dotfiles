# ~/.config/tmux/tmux.conf — managed by chezmoi.
#
# Three settings, two purposes: modified keys and hyperlinks.
# Edit this source file, never the deployed copy.
# Docs: https://man.openbsd.org/tmux

# --- modified keys ---

# Upstream default is `off`, which collapses Shift+Enter into a bare carriage
# return. Agent CLIs bind newline insertion to Shift+Enter, so it silently stops
# working under tmux and only the Ctrl+J fallback survives. `on` lets the
# application request the reporting mode itself; `always` would force mode 1
# over the application's own choice.
set -g extended-keys on

# csi-u is the format tmux documents alongside the setting above. The option
# arrived in tmux 3.5, so guard it — without the guard an older tmux reports a
# config error on every start. tmux compares these values lexically rather than
# semantically, which is correct for a 3.5 threshold and stays correct through
# 3.9.
%if #{>=:#{version},3.5}
set -g extended-keys-format csi-u
%endif

# --- terminal hyperlinks ---

# Enable OSC 8 explicit hyperlink passthrough across all outer terminals.
# Upstream tmux disables hyperlink features by default unless advertised by
# terminfo or terminal-features.
set -as terminal-features ",*:hyperlinks"
