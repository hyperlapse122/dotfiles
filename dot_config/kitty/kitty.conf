# ~/.config/kitty/kitty.conf — managed by chezmoi.
#
# Minimal, self-contained kitty defaults. kitty inherits $SHELL (zsh, set by
# the repo's chsh script) so no `shell` directive is needed here. This file does
# NOT couple to fonts.yaml and includes no absent files — tune values here, not
# in a generated file. Docs: https://sw.kovidgoyal.net/kitty/conf/

# --- window ---
hide_window_decorations yes
remember_window_size  no
initial_window_width  82c
initial_window_height 24c

# --- font ---
font_size 12.0

# --- input / clipboard ---
copy_on_select        clipboard
strip_trailing_space  smart

# --- scrolling ---
scrollback_lines 10000

# --- bell ---
enable_audio_bell no

# --- cursor ---
cursor_shape            beam
cursor_blink_interval   0

# --- misc ---
update_check_interval 0
